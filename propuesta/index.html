<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<title>Propuesta · Connect Studios</title>
<meta property="og:title" content="Tu propuesta de Connect Studios">
<meta property="og:description" content="Lo que platicamos, qué incluye, cómo trabajamos y la inversión.">
<meta property="og:image" content="https://connectstudios.mx/assets/img/reel-portada.webp">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23000'/%3E%3Crect x='14' y='10' width='36' height='44' rx='4' fill='none' stroke='%23F3E7C8' stroke-width='5'/%3E%3Crect x='14' y='44' width='36' height='10' fill='%23E3B23C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400..700&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js')</script>
<style>
:root{
  --negro:#000;
  --panel:#0B0B0C;
  --panel-2:#121214;
  --linea:#26262A;
  --linea-2:#3A3A40;
  --crema:#F2EFE9;
  --crema-2:#C9C5BD;
  --crema-3:#8A867F;
  --verde:#39FF88;
  --verde-t:rgba(57,255,136,.12);
  --dorado:#E3B23C;
  --display:'Anton',Impact,'Arial Narrow',sans-serif;
  --texto:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --suave:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--negro);color:var(--crema);font-family:var(--texto);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
img{display:block;max-width:100%}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--verde);outline-offset:3px}
[hidden]{display:none!important}
.envoltura{max-width:72rem;margin:0 auto;padding:0 clamp(1rem,4vw,2.5rem)}

/* Vista previa del admin */
.previa{position:sticky;top:0;z-index:40;background:var(--dorado);color:#000;font-weight:700;font-size:.86rem;text-align:center;padding:.55rem 1rem}

/* Portada */
.portada{position:relative;overflow:hidden;isolation:isolate;min-height:86vh;min-height:86svh;display:flex;flex-direction:column}
.fondo{position:absolute;inset:0;z-index:-2;background:url(https://connectstudios.mx/assets/img/bts/bts-3.webp) center 40%/cover no-repeat;filter:saturate(.65) brightness(.4);transform:scale(1.06)}
.js .fondo{animation:acerca 2.2s var(--suave) both}
@keyframes acerca{from{transform:scale(1.2);filter:saturate(.65) brightness(.06)}}
.portada::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.25) 38%,#000 100%)}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.4rem 0}
.logo{width:132px;height:auto}
.logo-txt{font-family:var(--display);text-transform:uppercase;font-size:1.2rem;text-decoration:none}
.top-der{font-size:.8rem;font-weight:600;color:var(--crema-2);letter-spacing:.04em}
.portada-txt{margin-top:auto;padding:0 0 clamp(2.5rem,7vh,4.5rem)}
.ceja{display:inline-flex;align-items:center;gap:.55rem;font-size:.74rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--verde);margin:0 0 1.5rem}
.ceja::before{content:"";width:1.6rem;height:1px;background:var(--verde)}
h1{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(3rem,9vw,7rem);line-height:.88;margin:0;overflow-wrap:anywhere}
.bajada{color:var(--crema-2);font-size:clamp(1.05rem,2vw,1.3rem);max-width:40rem;margin:1.1rem 0 0}
.meta{display:flex;flex-wrap:wrap;gap:.9rem 2.6rem;margin:2rem 0 0;padding-top:1.4rem;border-top:1px solid rgba(242,239,233,.16)}
.meta div{min-width:0}
.meta dt{font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--crema-3)}
.meta dd{margin:.25rem 0 0;font-weight:600;font-size:1.02rem}
.meta .m-precio dd{font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1;color:var(--verde)}
.meta .m-precio small{font-family:var(--texto);font-size:.78rem;font-weight:600;color:var(--crema-2);margin-left:.3rem}
.portada .acciones{margin-top:1.8rem}

/* Secciones */
.seccion{padding:clamp(3.5rem,9vh,6rem) 0;border-top:1px solid var(--linea)}
.cab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem 3rem;align-items:end;margin-bottom:2.4rem}
.cab span{display:inline-flex;align-items:center;gap:.5rem;font-size:.76rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--verde)}
.cab span::before{content:"";width:1.6rem;height:1px;background:var(--verde)}
.cab h2{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(2.4rem,5.4vw,4rem);line-height:.92;margin:.5rem 0 0;padding-top:.14em}
.cab p{color:var(--crema-2);margin:0;max-width:34rem}

/* Lo que platicamos */
.entendi{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:clamp(2rem,5vw,4rem);align-items:start}
.entendi .cab{grid-template-columns:1fr;margin:0}
.cita{position:relative;margin:0;padding:0 0 0 1.6rem;border-left:2px solid var(--verde)}
.cita p{font-size:clamp(1.12rem,2.1vw,1.38rem);line-height:1.55;color:var(--crema);margin:0 0 1rem}
.cita p:last-child{margin:0}

/* Qué incluye */
.recibes-top{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:clamp(.7rem,2vw,1.1rem);margin-bottom:clamp(.7rem,2vw,1.1rem)}
.stat{position:relative;overflow:hidden;display:flex;align-items:center;gap:1.1rem 1.4rem;padding:clamp(1.3rem,3vw,1.9rem);border:1px solid rgba(57,255,136,.4);border-radius:20px;background:radial-gradient(120% 140% at 0% 0%,rgba(57,255,136,.15),transparent 60%),var(--panel)}
.stat b{flex:none;font-family:var(--display);font-weight:400;font-size:clamp(4.2rem,9vw,6.2rem);line-height:.8;color:var(--verde)}
.stat strong{display:block;font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(1.25rem,2.3vw,1.65rem);line-height:1.02}
.stat span{display:block;color:var(--crema-2);font-size:.92rem;margin-top:.4rem}
.recibes{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(.7rem,2vw,1.1rem)}
.item{display:flex;flex-direction:column;gap:.9rem;background:var(--panel);border:1px solid var(--linea);border-radius:18px;padding:1.3rem 1.3rem 1.4rem;transition:border-color .3s,transform .35s var(--suave)}
.item:hover{border-color:var(--linea-2);transform:translateY(-3px)}
.item .ico{width:2.8rem;height:2.8rem;border-radius:12px;display:grid;place-items:center;background:var(--verde-t);color:var(--verde);box-shadow:inset 0 0 0 1px rgba(57,255,136,.3)}
.item .ico svg{width:1.4rem;height:1.4rem}
.item b{display:block;font-size:1.02rem;line-height:1.35}
.item p{margin:.3rem 0 0;color:var(--crema-2);font-size:.92rem}
.item-cta{justify-content:space-between;border-color:rgba(57,255,136,.35);background:radial-gradient(120% 140% at 100% 100%,rgba(57,255,136,.14),transparent 60%),var(--panel);cursor:pointer;text-align:left;font:inherit;color:inherit}
.item-cta small{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--crema-3)}
.item-cta .monto{font-family:var(--display);font-weight:400;font-size:clamp(2rem,4vw,2.6rem);line-height:.95;color:var(--crema)}
.item-cta .monto em{font-style:normal;font-family:var(--texto);font-size:.85rem;font-weight:600;color:var(--crema-2);margin-left:.35rem}
.item-cta .ir{display:inline-flex;align-items:center;gap:.4rem;font-weight:600;color:var(--verde)}
.item-cta .ir svg{width:1.05rem;height:1.05rem;transition:transform .3s var(--suave)}
.item-cta:hover .ir svg{transform:translateX(4px)}

/* Cómo trabajamos */
.linea-t{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.9rem}
.linea-t::before{content:"";position:absolute;left:0;right:0;top:1.05rem;height:1px;background:var(--linea-2)}
.linea-t::after{content:"";position:absolute;left:0;right:0;top:1.05rem;height:1px;background:var(--verde);transform:scaleX(0);transform-origin:left;transition:transform 1.8s var(--suave) .2s}
.linea-t.visto::after{transform:scaleX(1)}
.etapa{position:relative;padding-top:2.6rem}
.etapa::before{content:"";position:absolute;top:.6rem;left:0;width:.95rem;height:.95rem;border-radius:50%;background:#000;border:2px solid var(--verde)}
.etapa small{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--verde)}
.etapa h3{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:1.6rem;line-height:1;margin:.35rem 0 .5rem}
.etapa p{color:var(--crema-2);font-size:.92rem;margin:0}

/* Inversión */
.inversion{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(1.2rem,3vw,2rem);align-items:start}
.precio-caja{position:relative;overflow:hidden;background:var(--panel);border:1px solid rgba(57,255,136,.35);border-radius:20px;padding:clamp(1.5rem,4vw,2.4rem);box-shadow:0 30px 70px -40px rgba(57,255,136,.45)}
.precio-caja .et{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--crema-3)}
.precio{font-family:var(--display);font-weight:400;font-size:clamp(3.4rem,8vw,5.4rem);line-height:.9;color:var(--crema);margin:.6rem 0 .4rem;font-variant-numeric:tabular-nums}
.precio-nota{color:var(--crema-2);font-weight:600}
.anticipo{margin-top:1.4rem;padding-top:1.2rem;border-top:1px solid var(--linea);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:baseline}
.anticipo b{font-family:var(--display);font-weight:400;font-size:1.8rem;color:var(--verde)}
.anticipo span{color:var(--crema-2);font-size:.92rem}
/* Proyectos: 50% y 50%, o todo a meses sin intereses */
.opciones-pago{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(.8rem,2vw,1.2rem);margin-top:clamp(1.2rem,3vw,2rem)}
@media (max-width:640px){.opciones-pago{grid-template-columns:1fr}}
.op{background:var(--panel);border:1px solid var(--linea);border-radius:18px;padding:clamp(1.2rem,3vw,1.6rem)}
.op-msi{border-color:rgba(57,255,136,.35);background:radial-gradient(120% 140% at 100% 0%,rgba(57,255,136,.12),transparent 60%),var(--panel)}
.op small{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--verde)}
.op h3{margin:.45rem 0 .9rem;font-size:1.15rem}
.op-fila{display:flex;justify-content:space-between;align-items:baseline;gap:.8rem;padding:.6rem 0;border-top:1px solid var(--linea)}
.op-fila span{color:var(--crema-2);font-size:.92rem}
.op-fila b{font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1;color:var(--crema);font-variant-numeric:tabular-nums;white-space:nowrap}
.op-msi .op-fila b{color:var(--verde)}
.op p{margin:.75rem 0 0;color:var(--crema-3);font-size:.84rem}
.msi-nota{margin:.7rem 0 0;color:var(--crema-2);font-size:.88rem}
.msi-nota b{color:var(--crema)}
.condiciones{display:grid;gap:.9rem}
.bloque{background:var(--panel);border:1px solid var(--linea);border-radius:16px;padding:1.3rem 1.4rem}
.bloque h3{margin:0 0 .6rem;font-size:1.02rem}
.bloque p{margin:0;color:var(--crema-2);font-size:.95rem;white-space:pre-line}
.bloque ul{list-style:none;margin:0;padding:0;display:grid;gap:.7rem}
.bloque li{display:grid;grid-template-columns:1.3rem minmax(0,1fr);gap:.6rem;color:var(--crema-2);font-size:.95rem}
.bloque li svg{width:1.05rem;height:1.05rem;color:var(--verde);margin-top:.2rem}

/* Ejemplo */
.ejemplo{position:relative;display:block;overflow:hidden;border-radius:20px;border:1px solid var(--linea);background:#050505;aspect-ratio:16/9;text-decoration:none}
.ejemplo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.6) saturate(.85);transition:transform 1.2s var(--suave),filter .5s}
.ejemplo:hover img{transform:scale(1.03);filter:brightness(.72)}
.ejemplo iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ejemplo .play{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:1rem;text-align:center;padding:1rem;background:none;border:0;cursor:pointer;width:100%}
.ejemplo .play i{width:4.6rem;height:4.6rem;border-radius:50%;background:var(--verde);display:grid;place-items:center;box-shadow:0 12px 40px -8px rgba(57,255,136,.6);transition:transform .35s var(--suave)}
.ejemplo:hover .play i{transform:scale(1.07)}
.ejemplo .play i::after{content:"";margin-left:5px;border-left:19px solid #000;border-top:12px solid transparent;border-bottom:12px solid transparent}
.ejemplo .play span{font-family:var(--display);text-transform:uppercase;font-size:clamp(1.5rem,3.4vw,2.3rem);line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.7)}
.ejemplo .play small{color:var(--crema-2);font-size:.9rem}

/* Decisión */
.decision{position:relative;overflow:hidden;border:1px solid var(--linea-2);border-radius:24px;background:radial-gradient(120% 140% at 100% 0%,rgba(57,255,136,.12),transparent 55%),var(--panel);padding:clamp(1.6rem,5vw,3.4rem);scroll-margin-top:1.5rem}
.decision h2{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(2.6rem,6vw,4.4rem);line-height:.9;margin:.4rem 0 1rem;padding-top:.14em}
.decision h2 em{font-style:normal;color:var(--verde)}
.decision > p,.decision .txt{color:var(--crema-2);max-width:38rem;margin:0 0 1.6rem}
.acciones{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.9rem;padding:0 1.25rem;border:1px solid var(--linea-2);border-radius:999px;background:transparent;font-weight:600;font-size:.94rem;text-decoration:none;cursor:pointer;transition:border-color .2s,background .2s,transform .2s,box-shadow .2s}
.btn:hover{border-color:var(--crema-3);background:#111;transform:translateY(-2px)}
.btn-v{background:var(--verde);border-color:var(--verde);color:#000}
.btn-v:hover{background:var(--verde);box-shadow:0 10px 30px rgba(57,255,136,.3)}
.btn-grande{min-height:3.3rem;padding:0 1.6rem;font-size:1rem}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn svg{width:17px;height:17px}
.enlace{background:none;border:0;padding:.4rem .2rem;color:var(--crema-3);font-size:.9rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.enlace:hover{color:var(--crema)}
.panel{margin-top:1.6rem;padding-top:1.6rem;border-top:1px solid var(--linea);max-width:36rem}
.campo{display:grid;gap:.4rem;margin-bottom:1rem}
.campo label,.campo .lbl{font-size:.82rem;font-weight:700;color:var(--crema-2)}
.campo input:not([type=checkbox]):not([type=radio]),.campo textarea{width:100%;background:#000;border:1px solid var(--linea-2);border-radius:10px;padding:.8rem .9rem;color:var(--crema)}
.campo textarea{min-height:5.5rem;resize:vertical}
.campo input:not([type=checkbox]):not([type=radio]):focus,.campo textarea:focus{outline:none;border-color:var(--verde)}
.motivos{display:grid;gap:.45rem}
.motivos label{display:flex;align-items:center;gap:.6rem;padding:.65rem .8rem;border:1px solid var(--linea);border-radius:10px;cursor:pointer;font-weight:500;color:var(--crema)}
.motivos input{accent-color:var(--verde);width:1rem;height:1rem;margin:0}
.motivos label:has(input:checked){border-color:var(--verde);background:var(--verde-t)}
.legal{font-size:.84rem;color:var(--crema-3);margin:.2rem 0 1.1rem}
.legal a{color:var(--crema-2)}
.error{color:#FF8B7A;font-weight:600;font-size:.9rem;margin:.8rem 0 0}

/* Ya aceptada: siguientes pasos */
.pasos-sig{list-style:none;margin:0;padding:0;display:grid;gap:.9rem;counter-reset:s}
.pasos-sig > li{counter-increment:s;position:relative;background:#050505;border:1px solid var(--linea);border-radius:16px;padding:1.2rem 1.3rem 1.2rem 4.2rem}
.pasos-sig > li::before{content:counter(s,decimal-leading-zero);position:absolute;left:1.2rem;top:1.05rem;font-family:var(--display);font-size:2rem;line-height:1;color:var(--verde)}
.pasos-sig h3{margin:0 0 .3rem;font-size:1.05rem}
.pasos-sig p{margin:0;color:var(--crema-2);font-size:.95rem}
.pago{margin-top:1rem;display:grid;gap:.6rem}
.clabe-caja{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem;background:var(--panel);border:1px solid rgba(57,255,136,.4);border-radius:12px;padding:.9rem 1rem}
.clabe-caja small{display:block;font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--crema-3)}
.clabe{font-family:var(--display);font-size:clamp(1.4rem,4.6vw,2rem);letter-spacing:.05em;color:var(--verde);font-variant-numeric:tabular-nums;line-height:1.1}
.pago dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.4rem 1rem;margin:0}
.pago dt{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--crema-3)}
.pago dd{margin:.15rem 0 0;font-weight:600;overflow-wrap:anywhere}
.listo-marca{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .8rem;border-radius:999px;background:var(--verde-t);color:var(--verde);font-weight:700;font-size:.8rem;letter-spacing:.06em}

/* Cuándo arrancamos */
.fechas-ini{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:.9rem}
.fecha-caja{background:var(--panel);border:1px solid var(--linea);border-radius:18px;padding:1.4rem 1.5rem}
.fecha-caja.principal{border-color:rgba(57,255,136,.4);box-shadow:0 24px 60px -40px rgba(57,255,136,.5)}
.fecha-caja .et{display:block;font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--verde);margin-bottom:1rem}
.fecha-caja:not(.principal) .et{color:var(--crema-3)}
.fecha-caja .fila{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.fecha-caja small{display:block;font-size:.78rem;color:var(--crema-3);font-weight:600}
.fecha-caja b{display:block;font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(1.45rem,3vw,2.1rem);line-height:1;margin-top:.3rem}
.fecha-caja:not(.principal) b{font-size:clamp(1.2rem,2.4vw,1.5rem);color:var(--crema-2)}

/* Pasos después de aceptar */
.pasos-sig > li.hecho{border-color:rgba(57,255,136,.45)}
.pasos-sig > li.hecho::before{content:"✓";font-family:var(--texto);font-weight:800;font-size:1.5rem;top:1.15rem}
.pasos-sig > li.espera{opacity:.55}
.pasos-sig .acciones{margin-top:.9rem}
.transfer{margin-top:.9rem}

/* Revisión del proyecto */
.rev-videos{display:grid;gap:.7rem;margin-top:1rem}
.rev-video{background:var(--panel);border:1px solid var(--linea);border-radius:14px;padding:1rem 1.1rem}
.rev-cab{display:flex;align-items:baseline;gap:.7rem;margin:0}
.rev-cab b{font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1;color:var(--verde)}
.rev-cab span{font-weight:600}
.rev-video .acciones{margin-top:.7rem}
.rev-video .campo{margin:.9rem 0 0}
.rev-video .acepto{margin:.6rem 0 0}
.rev-nota{margin:1rem 0 0;color:var(--crema-3);font-size:.88rem}
.rev-confirma{margin-top:1rem;padding:1rem 1.1rem;border:1px solid rgba(57,255,136,.4);border-radius:14px;background:var(--verde-t)}
.rev-confirma p{color:var(--crema);margin:0 0 .8rem}
.rev-lista{margin:.8rem 0 0;padding-left:1.1rem;color:var(--crema-2);font-size:.92rem}
.rev-lista li{margin:.25rem 0}
.rev-lista b{color:var(--crema)}

/* Panel para firmar y vista del contrato */

async function rpc(fn, args) {
  const r = await fetch(CONFIG.URL + fn, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CONFIG.LLAVE },
    body: JSON.stringify(args)
  });
  const txt = await r.text();
  if (!r.ok) throw new Error(txt || ('Error ' + r.status));
  return txt ? JSON.parse(txt) : null;
}

function videoYouTube(url) {
  const m = String(url || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);
  return m ? m[1] : null;
}

// Lo que recibes: lo que empieza con número va grande (máx. 3); lo demás con su ícono, y al final cuánto cuesta todo
function bloqueIncluye(ceja, incluye, diasTiempo) {
  if (!incluye.length) return '';
  const mensual = P.tipo === 'mensual';
  const stats = [], items = [];
  incluye.forEach(x => {
    const m = x.match(/^(\d+)\s+(.+)$/);
    if (m && stats.length < 3) {
      const [principal, ...resto] = m[2].split(',');
      stats.push({ n: m[1], principal: principal.trim(), resto: resto.join(',').trim() });
    } else {
      const k = x.indexOf(':');
      items.push(k > 0 && k < 60 ? { titulo: x.slice(0, k), texto: x.slice(k + 1).trim() } : { titulo: x, texto: '' });
    }
  });
  const may = t => t ? t[0].toUpperCase() + t.slice(1) : '';
  const nota = [IVA[P.iva], mensual ? 'al mes' : ''].filter(Boolean).join(' ');
  return `<section class="seccion">
    <div class="cab r"><div>${ceja('La propuesta')}<h2>${mensual ? 'Lo que recibes' : 'Lo que incluye'}</h2></div>
      <p>${mensual ? `Cada mes. Tú pones las ideas y ${esc(diasTiempo)} días de tu tiempo; del resto me encargo yo.` : 'Todo lo que lleva tu video, de principio a fin.'}</p></div>
    ${stats.length ? `<div class="recibes-top" style="--n:${stats.length}">${stats.map(x => `<div class="stat r"><b>${esc(x.n)}</b><div><strong>${esc(x.principal)}</strong>${x.resto ? `<span>${esc(may(x.resto))}</span>` : ''}</div></div>`).join('')}</div>` : ''}
    <ul class="recibes">
      ${items.map(x => `<li class="item r"><span class="ico">${iconoDe(x.titulo + ' ' + x.texto)}</span><div><b>${esc(x.titulo)}</b>${x.texto ? `<p>${esc(may(x.texto))}</p>` : ''}</div></li>`).join('')}
      <li class="r" style="display:flex"><button class="item item-cta" type="button" data-accion="ir" data-id="inversion" style="width:100%">
        <small>Todo esto por</small>
        <span class="monto">${esc(dinero(P.precio))}<em>${esc(nota)}</em></span>
        <span class="ir">Ver la inversión ${FLECHA}</span>
      </button></li>
    </ul>
  </section>`;
}

// Fechas (solo contenido mensual). Cada mes se entrega y se paga el mismo día, así que el
// cliente elige su día de pago (1 o 15) y con eso la mitad del mes en que grabamos.
// Se puede cambiar hasta firmar el contrato; con contrato, ya es su primer mes.
function bloqueFechas(ceja) {
  if (P.tipo !== 'mensual') return '';
  const c = P.contrato && P.contrato.primer_ciclo;
  if (c) {
    const dia = diaDe(c);
    return `<section class="seccion" id="fechas">
      <div class="cab r"><div>${ceja('Fechas')}<h2>Tu primer mes</h2></div><p>Pagas el día ${dia} de cada mes, el mismo día que recibes tus videos.</p></div>
      <div class="fechas-ini"><div class="fecha-caja principal r"><span class="et">Pagas el día ${dia} de cada mes</span>
        <div class="fila"><div><small>Grabamos</small><b>${esc(rangoVentana(c))}</b></div><div><small>Recibes tus videos y pagas</small><b>${esc(fCorta(c.entrega))}</b></div></div></div></div>
    </section>`;
  }
  const opciones = [1, 15].map(ventanaDe).filter(Boolean);
  if (!opciones.length) return '';
  const primera = P.ventanas[0];
  return `<section class="seccion" id="fechas">
    <div class="cab r"><div>${ceja('Fechas')}<h2>Elige tu día de pago</h2></div>
      <p>Cada mes recibes tus videos y pagas tu mensualidad el mismo día: el 1 o el 15, según la mitad del mes en que grabemos. Entre tu anticipo y la primera grabación hay ${esc(P.margen_dias)} días para nuestra cita presencial y tus guiones.</p></div>
    <div class="dias-pago" role="radiogroup" aria-label="Tu día de pago">
      ${opciones.map(v => { const d = diaDe(v), sel = P.dia_pago === d; return `<button type="button" class="dia-op r${sel ? ' elegido' : ''}" role="radio" aria-checked="${sel}" data-accion="dia-pago" data-dia="${d}"${P.vencida ? ' disabled' : ''}>
        <span class="dia-top"><span class="et">${sel ? 'Elegiste pagar el' : 'Pagas el'}</span>${v === primera ? '<span class="antes">Arrancas antes</span>' : ''}<span class="marca">${CHECK}</span></span>
        <span class="dia-num">Día ${d}</span><span class="dia-sub">de cada mes</span>
        <span class="fila"><span><small>Grabamos</small><strong>${esc(rangoVentana(v))}</strong></span><span><small>Recibes tus videos y pagas</small><strong>${esc(fCorta(v.entrega))}</strong></span></span>
        <span class="limite">Para arrancar así, firma y paga tu anticipo a más tardar el ${esc(fCorta(v.limite))}.</span>
      </button>`; }).join('')}
    </div>
    <p class="dia-nota">${P.dia_pago ? 'Lo puedes cambiar hasta que firmes tu contrato.' : 'Toca el que te acomode mejor. Lo puedes cambiar hasta que firmes tu contrato.'}</p>
    <p class="error" data-error-dia hidden></p>
  </section>`;
}

// Al elegir: se ve al instante y se guarda (en la vista previa no se guarda)
async function elegirDia(dia) {
  if (P.dia_pago === dia) return;
  const antes = P.dia_pago;
  P.dia_pago = dia;
  repintarFechas();
  if (previa) return repintarDecision(false);
  try {
    P = await rpc('propuesta_dia_pago', { p_token: token, p_dia: dia });
  } catch (e) {
    P.dia_pago = antes;
    repintarFechas();
    const err = document.querySelector('[data-error-dia]');
    if (err) { err.textContent = /contrato_firmado/.test(String(e.message)) ? 'Tu contrato ya está firmado con tu día de pago.' : 'No se pudo guardar. Inténtalo de nuevo.'; err.hidden = false; }
    return;
  }
  repintarDecision(false);
}
function repintarFechas() {
  const sec = document.getElementById('fechas');
  if (!sec) return;
  const span = sec.querySelector('.cab span').outerHTML;   // conserva su número de sección
  sec.outerHTML = bloqueFechas(() => span);
  document.querySelectorAll('#fechas .r').forEach(e => e.classList.add('visto'));
}

// Proyectos: total con IVA, si se pagó todo de una vez y los planes de meses sin intereses
function totalProyecto() { return P.iva === 'mas_iva' ? Math.round(P.precio * 116) / 100 : Number(P.precio); }
// Plazos y monto mínimo (con IVA) de cada uno. Tienen que coincidir con Stripe →
// Configuración → Métodos de pago → Tarjetas → Meses sin intereses (Manuel, oct 2026).
const MSI = [[3, 5000], [6, 30000]];
const planesPara = monto => MSI.filter(([, min]) => monto >= min).map(([n]) => n);
const conMsi = () => P.tipo === 'proyecto' && !!P.stripe;
const pagoCompleto = () => !!(P.pagada_at && P.liquidada_at && P.pagada_at === P.liquidada_at);   // el cobro "total" marca los dos a la vez
const alMes = (monto, n) => Math.ceil(monto / n * 100) / 100;
function opcionesProyecto() {
  if (!conMsi() || !planesPara(totalProyecto()).length) return '';
  const tot = totalProyecto(), ant = totalAnticipo() ?? Math.round(tot * 50) / 100, resto = Math.round((tot - ant) * 100) / 100;
  const iva = P.iva === 'mas_iva' ? ', IVA incluido' : '';
  return `<div class="opciones-pago">
    <div class="op r"><small>Opción 1</small><h3>50% ahora y 50% al entregar</h3>
      <div class="op-fila"><span>Anticipo para arrancar</span><b>${esc(dinero(ant))}</b></div>
      <div class="op-fila"><span>Al entregar el video</span><b>${esc(dinero(resto))}</b></div>
      <p>Con tarjeta o por transferencia${iva}.</p></div>
    <div class="op op-msi r"><small>Opción 2</small><h3>Todo a meses sin intereses</h3>
      ${planesPara(tot).map(n => `<div class="op-fila"><span>${n} meses de</span><b>${esc(dinero(alMes(tot, n)))}</b></div>`).join('')}
      <p>Pagas el total de ${esc(dinero(tot))}${P.iva === 'mas_iva' ? ' (IVA incluido)' : ''} con tu tarjeta de crédito y tu banco te lo divide sin intereses. Aplica con la mayoría de las tarjetas de crédito mexicanas.</p></div>
  </div>`;
}

function totalAnticipo() {
  if (!P.anticipo) return null;
  return P.iva === 'mas_iva' ? Math.round(P.anticipo * 116) / 100 : Number(P.anticipo);
}

// ---------- Producción y revisión del proyecto ----------
// El cliente de un proyecto no entra al portal: aquí ve en qué va, revisa (en Frame.io o escribiendo), aprueba y paga
let ajustesAbiertos = false;   // el formulario para pedir ajustes
let porAprobar = false;        // la confirmación antes de aprobar
const hoyMx = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/Mexico_City' });
const diaMx = iso => new Date(iso).toLocaleDateString('en-CA', { timeZone: 'America/Mexico_City' });
const pad2 = n => String(n).padStart(2, '0');
const rondas = n => n === 1 ? '1 ronda' : `${n} rondas`;
const diasGrab = g => { const [a, b] = g || []; return !a ? '' : !b || a === b ? `el ${fCorta(a)}` : a.slice(0, 7) === b.slice(0, 7) ? `el ${Number(a.slice(8, 10))} y el ${fCorta(b)}` : `el ${fCorta(a)} y el ${fCorta(b)}`; };
const nombreVideo = v => v.titulo || `Video ${v.numero}`;

function pasoProduccion(pr, paso) {
  const vids = pr.videos || [], uno = vids.length === 1;
  const quedan = Math.max(0, pr.rondas - pr.rondas_usadas), hoy = hoyMx();
  const carpeta = pr.carpeta ? `<a class="btn" href="${esc(pr.carpeta)}" target="_blank" rel="noopener">Abrir la carpeta</a>` : '';
  if (pr.estado === 'produccion') {
    const grabado = (pr.grabacion[1] || pr.grabacion[0]) < hoy;
    return paso('', 'En producción', grabado
      ? `Ya grabamos y estamos editando. Te lo entrego el ${esc(fCorta(pr.entrega))} y te aviso por WhatsApp para que lo revises aquí mismo.`
      : `Grabamos ${esc(diasGrab(pr.grabacion))} y te entrego el ${esc(fCorta(pr.entrega))}. Te aviso por WhatsApp para que lo revises aquí mismo.`,
      `<div class="acciones"><a class="btn" href="${esc(wa(`Hola Manuel, tengo una duda sobre el proyecto de ${P.empresa}.`))}" target="_blank" rel="noopener">${WA_ICONO} Escribirme</a></div>`);
  }
  if (pr.estado === 'ajustes') {
    const pedidos = vids.filter(v => v.ajuste && v.estado !== 'entregado');
    return paso('', 'Estamos haciendo tus ajustes', `Los pediste${pr.ajustes_at ? ` el ${esc(fCorta(diaMx(pr.ajustes_at)))}` : ''}. Te aviso por WhatsApp en cuanto estén para que los revises aquí mismo.`,
      pedidos.length || pr.ajustes_general ? `<ul class="rev-lista">${pedidos.map(v => `<li><b>${esc(nombreVideo(v))}:</b> ${esc(v.ajuste)}</li>`).join('')}${pr.ajustes_general ? `<li>${esc(pr.ajustes_general)}</li>` : ''}</ul>` : '');
  }
  if (pr.estado === 'aprobado') {
    const bajar = vids.filter(v => v.final_url).map(v => `<a class="btn" href="${esc(v.final_url)}" target="_blank" rel="noopener">${uno ? 'Descargar tu video' : `Descargar ${esc(nombreVideo(v))}`}</a>`).join('');
    return paso('hecho', uno ? 'Video aprobado' : 'Videos aprobados', `Quedó aprobado${pr.aprobado_at ? ` el ${esc(fCorta(diaMx(pr.aprobado_at)))}` : ''}. Descárgalo en alta calidad; el link está disponible 30 días.`,
      bajar || carpeta ? `<div class="acciones">${bajar}${carpeta}</div>` : '');
  }
  // En revisión
  const vencida = pr.revision_hasta && pr.revision_hasta < hoy;
  const conFio = vids.some(v => v.revision_url);
  const tarjetas = vids.map(v => `<div class="rev-video">
      <p class="rev-cab"><b>${pad2(v.numero)}</b><span>${esc(nombreVideo(v))}</span></p>
      <div class="acciones">${v.revision_url ? `<a class="btn btn-v" href="${esc(v.revision_url)}" target="_blank" rel="noopener">Ver y comentar</a>` : v.final_url ? `<a class="btn btn-v" href="${esc(v.final_url)}" target="_blank" rel="noopener">Ver el video</a>` : ''}</div>
      ${ajustesAbiertos ? `<div class="campo"><label for="aj-${v.id}">¿Qué cambiarías?</label><textarea id="aj-${v.id}" name="aj-${v.id}" maxlength="1500" placeholder="Por ejemplo: en el segundo 0:42 cambiar la música por algo más tranquilo"></textarea></div>
        ${v.revision_url ? `<label class="acepto"><input type="checkbox" name="fio-${v.id}"> Dejé mis comentarios en Frame.io</label>` : ''}` : ''}
    </div>`).join('');
  const explica = `${conFio ? 'En Frame.io puedes comentar en el segundo exacto y hasta dibujar sobre el video; solo te pide tu nombre y correo, sin crear cuenta. ' : ''}${vencida ? 'Ya pasó el plazo para pedir ajustes, así que se aprueba hoy.' : `Tienes hasta el ${esc(fCorta(pr.revision_hasta))} para revisarlo${quedan ? ` y te ${quedan === 1 ? 'queda' : 'quedan'} ${rondas(quedan)} de ajustes` : ''}. Si no me dices nada, se aprueba solo.`}`;
  let abajo;
  if (ajustesAbiertos) {
    abajo = `<div class="campo" style="margin-top:1rem"><label for="aj-general">¿Algo general? <span style="font-weight:400;color:var(--crema-3)">(opcional)</span></label><textarea id="aj-general" name="general" maxlength="1500"></textarea></div>
      <p class="rev-nota">Junta todo en un solo envío: cada envío cuenta como una ronda${quedan ? ` y te ${quedan === 1 ? 'queda' : 'quedan'} ${rondas(quedan)}` : ''}.</p>
      <div class="acciones" style="margin-top:.9rem"><button class="btn btn-v" type="submit"${previa ? ' disabled' : ''}>Enviar mis ajustes</button><button class="enlace" type="button" data-accion="cerrar-ajustes">Cancelar</button></div>`;
  } else if (porAprobar) {
    abajo = `<div class="rev-confirma"><p>¿Lo apruebas tal como está? Ya no podrás pedir cambios${P.liquidada_at ? '' : ' y se activa el pago final'}.</p>
      <div class="acciones"><button class="btn btn-v" type="button" data-accion="aprobar-entrega"${previa ? ' disabled' : ''}>Sí, lo apruebo</button><button class="enlace" type="button" data-accion="cancelar-aprobar">Cancelar</button></div></div>`;
  } else {
    abajo = `<div class="acciones" style="margin-top:1rem"><button class="btn btn-v" type="button" data-accion="pre-aprobar">${uno ? 'Aprobar mi video' : 'Aprobar mis videos'}</button>
      ${quedan && !vencida ? '<button class="btn" type="button" data-accion="abrir-ajustes">Pedir ajustes</button>' : `<a class="btn" href="${esc(wa(`Hola Manuel, revisé el video de ${P.empresa} y tengo un comentario.`))}" target="_blank" rel="noopener">${WA_ICONO} Escribirme</a>`}</div>`;
  }
  return paso('', uno ? 'Revisa tu video' : `Revisa tus ${vids.length} videos`, explica,
    `<form data-form="ajustes" id="revisar" novalidate><div class="rev-videos">${tarjetas}</div>${carpeta && !conFio ? `<div class="acciones">${carpeta}</div>` : ''}${abajo}<p class="error" data-error hidden></p></form>`);
}

async function aprobarEntrega(boton) {
  const err = document.querySelector('#revisar [data-error]');
  boton.disabled = true; boton.textContent = 'Aprobando…';
  try {
    P = await rpc('propuesta_aprobar_entrega', { p_token: token });
    porAprobar = false;
    repintarDecision(false);
    document.getElementById('decision').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    boton.disabled = false; boton.textContent = 'Sí, lo apruebo';
    if (err) { err.textContent = errorRevision(e); err.hidden = false; }
  }
}

async function pedirAjustes(f, boton, decir) {
  const vids = (P.produccion && P.produccion.videos) || [];
  const ajustes = vids.map(v => {
    const t = (f.elements['aj-' + v.id] || {}).value || '', fio = !!(f.elements['fio-' + v.id] || {}).checked;
    const texto = t.trim() ? t.trim() + (fio ? ' (También dejé comentarios en Frame.io.)' : '') : fio ? 'Dejé mis comentarios en Frame.io.' : '';
    return { video_id: v.id, texto };
  }).filter(a => a.texto);
  const general = (f.elements.general || {}).value || '';
  if (!ajustes.length && !general.trim()) return decir('Escribe qué cambiarías o marca que dejaste tus comentarios en Frame.io.');
  boton.disabled = true; boton.textContent = 'Enviando…';
  try {
    P = await rpc('propuesta_pedir_ajustes', { p_token: token, p_ajustes: ajustes, p_general: general.trim() });
    ajustesAbiertos = false;
    repintarDecision(false);
    document.getElementById('decision').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    boton.disabled = false; boton.textContent = 'Enviar mis ajustes';
    decir(errorRevision(e));
  }
}

function errorRevision(e) {
  const m = String(e && e.message || '');
  return /no_en_revision/.test(m) ? 'Esta revisión ya se cerró. Recarga la página para ver en qué va.'
    : /fuera_de_plazo/.test(m) ? 'Ya pasó el plazo para pedir ajustes. Escríbeme por WhatsApp y lo vemos.'
    : /sin_rondas/.test(m) ? 'Ya usaste tus rondas de ajustes. Escríbeme por WhatsApp y lo vemos.'
    : /sin_ajustes/.test(m) ? 'Escribe qué cambiarías o marca que dejaste tus comentarios en Frame.io.'
    : /Failed to fetch|NetworkError|Load failed/i.test(m) ? 'No hay conexión. Revisa tu internet e inténtalo de nuevo.'
    : 'No se pudo enviar. Inténtalo de nuevo o escríbeme por WhatsApp.';
}

function bloqueDecision() {
  const pila = String(P.nombre || '').split(/\s+/)[0];
  const dudas = `<a class="btn" href="${esc(wa(`Hola Manuel, tengo una duda sobre la propuesta para ${P.empresa}.`))}" target="_blank" rel="noopener">${WA_ICONO} Tengo dudas</a>`;

  // Ya aceptada: firmar el contrato, pagar el anticipo y agendar la cita presencial
  if (P.aceptada_at) {
    const mensual = P.tipo === 'mensual', firmado = !!P.contrato, pagado = !!P.pagada_at;
    const completo = pagoCompleto(), liquidado = !!P.liquidada_at, pedido = !!P.liquidacion_pedida_at;
    const puedePagar = !mensual || firmado || !P.contrato_listo;
    const tot = totalAnticipo(), g = P.pago, resto = Number(P.restante) || 0;
    const monto = P.anticipo ? `${dinero(P.anticipo)}${P.iva === 'mas_iva' ? ` + IVA = ${dinero(tot)}` : P.iva === 'incluido' ? ' (IVA incluido)' : ''}` : '';
    const paso = (clase, titulo, texto, extra) => `<li class="${clase}"><h3>${titulo}</h3><p>${texto}</p>${extra || ''}</li>`;
    const transferencia = (concepto, comprobante) => g ? `<div class="pago">
        <div class="clabe-caja"><div><small>CLABE interbancaria</small><span class="clabe">${esc(String(g.clabe).replace(/(\d{4})(?=\d)/g, '$1 '))}</span></div>
          <button class="btn" type="button" data-accion="copiar" data-texto="${esc(g.clabe)}">Copiar CLABE</button></div>
        <dl><div><dt>Banco</dt><dd>${esc(g.banco)}</dd></div><div><dt>Titular</dt><dd>${esc(g.titular)}</dd></div>
          ${g.cuenta ? `<div><dt>Cuenta</dt><dd>${esc(g.cuenta)}</dd></div>` : ''}
          <div><dt>Concepto</dt><dd>${esc(P.empresa)} ${esc(concepto)}</dd></div></dl>
        <div class="acciones"><a class="btn" href="${esc(wa(`Hola Manuel, te mando el comprobante del ${comprobante} de ${P.empresa}.`))}" target="_blank" rel="noopener">${WA_ICONO} Mandar comprobante</a></div>
      </div>` : '<p>Te mando los datos para transferir por WhatsApp.</p>';
    // Cuánto queda al mes en cada plan de meses sin intereses
    const notaMsi = (antes, monto) => !planesPara(monto).length ? '' : `<p class="msi-nota">${antes} ${planesPara(monto).map(n => `${n} meses de <b>${esc(dinero(alMes(monto, n)))}</b>`).join(' o ')}.</p>`;
    const opciones = (que, concepto, botonTxt, extra) => P.stripe
      ? `<div class="acciones"><button class="btn btn-v" type="button" data-accion="pagar-tarjeta" data-que="${que}"${previa ? ' disabled' : ''}>${botonTxt}</button>${extra ? extra.boton || '' : ''}
          <button class="enlace" type="button" data-accion="ver-transferencia">${verTransferencia ? 'Ocultar datos para transferir' : 'Prefiero transferir'}</button></div>
          ${extra && extra.nota ? extra.nota : ''}
          <p class="error" data-error-pago hidden></p>
          ${verTransferencia ? `<div class="transfer">${transferencia(concepto, concepto)}</div>` : ''}`
      : transferencia(concepto, concepto);
    const msiTotal = conMsi() && planesPara(totalProyecto()).length > 0;
    const opcionesPago = mensual || !msiTotal
      ? opciones('anticipo', 'anticipo', 'Pagar con tarjeta')
      : opciones('anticipo', 'anticipo', 'Pagar el anticipo con tarjeta', {
          boton: `<button class="btn" type="button" data-accion="pagar-tarjeta" data-que="total"${previa ? ' disabled' : ''}>Pagar todo a meses sin intereses</button>`,
          nota: notaMsi('Si pagas todo a meses sin intereses:', totalProyecto()) });

    const p1 = !mensual
      ? paso(pagado ? 'hecho' : '', 'Confirmamos alcance y fechas', 'Te escribo para confirmar las fechas de grabación y arrancar el guion.')
      : firmado
        ? paso('hecho', 'Contrato firmado', `Lo firmaste el ${esc(fechaHora(P.contrato.firmado_at))}.`, `<div class="acciones"><button class="btn" type="button" data-accion="ver-contrato">Ver o descargar el contrato</button></div>`)
        : P.contrato_listo
          ? paso('', 'Firma tu contrato', 'Lee tu contrato, ya con lo de esta propuesta, y fírmalo aquí mismo con el dedo o el mouse. Toma un par de minutos.', `<div class="acciones"><button class="btn btn-v" type="button" data-accion="abrir-firma">Revisar y firmar</button></div>`)
          : paso('', 'Firma tu contrato', 'Te lo mando para firmar en línea, con lo que viene en esta propuesta.');
    const p2 = pagado
      ? completo
        ? paso('hecho', 'Pago completo', 'Pagaste el total con tarjeta. ¡Gracias!')
        : paso('hecho', 'Anticipo pagado', `Lo recibí ${P.pago_metodo === 'tarjeta' ? 'con tarjeta' : 'por transferencia'}. ¡Gracias!`)
      : !puedePagar
        ? paso('espera', `Anticipo${monto ? ': ' + monto : ''}`, 'En cuanto firmes, aquí mismo pagas tu anticipo con tarjeta o por transferencia.')
        : paso('', `Anticipo${monto ? ': ' + monto : ''}`, P.anticipo ? `Con este pago apartamos tus fechas.${!mensual && msiTotal ? ' O, si prefieres, paga todo de una vez a meses sin intereses.' : ''}` : 'El monto te lo confirmo con el contrato.', opcionesPago);
    const msjArranque = mensual
      ? pagado
        ? `Hola Manuel, ya firmé y pagué el anticipo de ${P.empresa}. ¿Qué día hacemos nuestra cita presencial?`
        : `Hola Manuel, ya ${firmado ? 'firmé el contrato de' : 'acepté la propuesta para'} ${P.empresa}. ¿Qué día hacemos nuestra cita presencial?`
      : `Hola Manuel, ya ${pagado ? (completo ? 'pagué el total de' : 'pagué el anticipo de') : 'acepté la propuesta para'} ${P.empresa}. ¿Cuándo arrancamos?`;
    const pr = !mensual && P.produccion;
    const credito = !mensual && P.pago_modalidad === 'credito' && P.credito_dias;
    const p3 = pr ? pasoProduccion(pr, paso)
      : !mensual && !completo && (pedido || liquidado)
      ? paso('hecho', 'Producción', 'Tu video quedó listo.')
      : paso(pagado ? '' : 'espera', mensual ? 'Agenda tu cita presencial' : 'Arrancamos',
        mensual ? 'Es en persona: estrategia, tu portal y cómo escribir tus guiones. Escríbeme para elegir el día. <a href="/bienvenida/">Mira cómo arrancamos</a>.'
                : 'Con el anticipo apartamos las fechas de grabación y arrancamos el guion.',
        `<div class="acciones"><a class="btn${pagado ? ' btn-v' : ''}" href="${esc(wa(msjArranque))}" target="_blank" rel="noopener">${WA_ICONO} ${mensual ? 'Agendar mi cita presencial' : 'Escribirme'}</a></div>`);
    // Pago final del proyecto: se activa cuando Manuel lo pide al entregar
    const p4 = mensual || completo ? ''
      : liquidado
        ? paso('hecho', 'Pago final', `Lo recibí ${P.liquidacion_metodo === 'tarjeta' ? 'con tarjeta' : 'por transferencia'}. Todo quedó pagado. ¡Gracias!`)
        : pedido
          ? paso('', `Pago final: ${esc(dinero(resto))}`, credito && P.final_vence ? `Vence el ${esc(fecha(P.final_vence))}. Puedes pagarlo aquí cuando quieras.` : 'Tu video ya está listo. Con este pago queda todo liquidado.',
              opciones('liquidacion', 'pago final', 'Pagar con tarjeta', conMsi() ? { nota: notaMsi('Con tarjeta de crédito, a meses sin intereses:', resto) } : null))
          : paso('espera', `Pago final: ${esc(dinero(resto))}`, credito
              ? `Cuando apruebes tu video, tienes ${esc(P.credito_dias)} días para pagar el resto, con tarjeta o por transferencia.`
              : 'Cuando apruebes tu video, aquí mismo pagas el resto, con tarjeta o por transferencia.');
    const txt = mensual
      ? (pagado ? 'Ya quedó todo. Solo falta agendar tu cita presencial.' : 'Esto es lo que sigue, en orden:')
      : pr && pr.estado === 'revision' ? (pr.videos.length === 1 ? 'Tu video está listo: revísalo y dime si lo apruebas o qué ajustarías.' : 'Tus videos están listos: revísalos y dime si los apruebas o qué ajustarías.')
      : pr && pr.estado === 'ajustes' ? 'Estoy haciendo tus ajustes. Te aviso en cuanto estén.'
      : pr && pr.estado === 'aprobado' && pedido && !liquidado ? (credito && P.final_vence ? `Tu video está aprobado. El pago final vence el ${esc(fecha(P.final_vence))}.` : 'Tu video está aprobado: solo falta el pago final.')
      : pr && pr.estado === 'aprobado' ? 'Todo listo y pagado. ¡Gracias por confiar en mí!'
      : pr ? 'Ya estamos en producción. Aquí ves en qué va.'
      : completo ? 'Ya quedó todo pagado. Te escribo para arrancar.'
      : liquidado ? 'Todo quedó pagado. ¡Gracias por confiar en mí!'
      : pedido ? 'Tu video está listo: solo falta el pago final.'
      : pagado ? 'Ya quedó el anticipo. Te escribo para arrancar.' : 'Esto es lo que sigue, en orden:';

    return `<div class="decision r" id="decision">
      <span class="listo-marca">${CHECK.replace('<svg', '<svg width="16" height="16"')} Propuesta aceptada</span>
      <h2>Gracias, <em>${esc(String(P.aceptada_por || pila).split(/\s+/)[0])}.</em></h2>
      <p class="txt">${txt}</p>
      ${pagoVuelta && !pagoListo(P) ? '<p class="listo-marca" data-confirmando style="margin:0 0 1rem">Confirmando tu pago con el banco…</p>' : ''}
      <ol class="pasos-sig">${p1}${p2}${p3}${p4}</ol>
    </div>`;
  }

  // Vencida
  if (P.vencida) {
    return `<div class="decision r" id="decision">
      <div class="cab" style="margin:0"><span>Propuesta vencida</span></div>
      <h2>Venció el <em>${esc(fecha(P.vigencia).replace(/ de \d{4}$/, ''))}.</em></h2>
      <p class="txt">Escríbeme y la actualizamos con fechas nuevas.</p>
      <div class="acciones"><a class="btn btn-v btn-grande" href="${esc(wa(`Hola Manuel, la propuesta para ${P.empresa} ya venció. ¿Me la actualizas?`))}" target="_blank" rel="noopener">${WA_ICONO} Escribirme</a></div>
    </div>`;
  }

  const dijoQueNo = P.rechazada_at && !panel;
  // Las fechas van antes de la inversión; aquí se repite el límite para no perderlo al decidir
  const v1 = P.tipo === 'mensual' && (ventanaDe(P.dia_pago) || (P.ventanas || [])[0]);
  const limite = v1 ? ` Para grabar ${rangoVentana(v1)}, firma y paga a más tardar el ${fCorta(v1.limite)}.` : '';
  let abajo = '';
  if (panel === 'aceptar') {
    abajo = `<form class="panel" data-form="aceptar" novalidate>
      <div class="campo"><label for="a-nombre">Tu nombre</label><input id="a-nombre" name="nombre" maxlength="120" autocomplete="name" value="${esc(P.nombre)}" required></div>
      ${P.tipo === 'mensual' && (P.ventanas || []).length ? `<div class="campo"><span class="lbl">Tu día de pago</span>
        <div class="motivos">${[1, 15].map(ventanaDe).filter(Boolean).map(v => `<label><input type="radio" name="dia_pago" value="${diaDe(v)}"${P.dia_pago === diaDe(v) ? ' checked' : ''}> Día ${diaDe(v)} · grabamos ${esc(rangoVentana(v))}</label>`).join('')}</div></div>` : ''}
      <p class="legal">Al aceptar confirmas esta propuesta tal como está. Después te mando el contrato para firmar en línea${P.tipo === 'mensual' ? '; las condiciones completas están en los <a href="https://connectstudios.mx/terminos/" target="_blank" rel="noopener">términos del servicio</a>' : ''}.</p>
      <div class="acciones"><button class="btn btn-v btn-grande" type="submit"${previa ? ' disabled' : ''}>Confirmar y aceptar</button><button class="enlace" type="button" data-accion="cerrar-panel">Cancelar</button></div>
      <p class="error" data-error hidden></p>
    </form>`;
  } else if (panel === 'rechazar') {
    abajo = `<form class="panel" data-form="rechazar" novalidate>
      <div class="campo"><span class="lbl">¿Qué pasó? Me ayuda mucho saberlo.</span>
        <div class="motivos">${Object.entries(MOTIVOS).map(([k, t]) => `<label><input type="radio" name="motivo" value="${k}"> ${t}</label>`).join('')}</div></div>
      <div class="campo"><label for="r-com">¿Algo más? <span style="font-weight:400;color:var(--crema-3)">(opcional)</span></label><textarea id="r-com" name="comentario" maxlength="1000"></textarea></div>
      <div class="acciones"><button class="btn btn-grande" type="submit"${previa ? ' disabled' : ''}>Enviar</button><button class="enlace" type="button" data-accion="cerrar-panel">Cancelar</button></div>
      <p class="error" data-error hidden></p>
    </form>`;
  }
  return `<div class="decision r" id="decision">
    <div class="cab" style="margin:0"><span>${dijoQueNo ? 'Gracias por decírmelo' : 'Siguiente paso'}</span></div>
    <h2>${dijoQueNo ? 'Por ahora <em>no.</em>' : '<em>¿Arrancamos?</em>'}</h2>
    <p class="txt">${dijoQueNo
      ? `Me dijiste que por ahora no. Si cambias de opinión, puedes aceptarla aquí mismo hasta el ${esc(fecha(P.vigencia))}.`
      : `Si todo te hace sentido, acéptala aquí y te mando el contrato.${esc(limite)} Si algo no te queda claro, escríbeme. Vigente hasta el ${esc(fecha(P.vigencia))}.`}</p>
    ${panel ? '' : `<div class="acciones">
      <button class="btn btn-v btn-grande" type="button" data-accion="abrir-aceptar">Aceptar la propuesta</button>
      ${dudas}
      ${dijoQueNo ? '' : '<button class="enlace" type="button" data-accion="abrir-rechazar">Ahora no</button>'}
    </div>`}
    ${abajo}
  </div>`;
}

const CAMPOS_CLIENTE = { CLIENTE_NOMBRE: ['razon_social', 'nombre o razón social'], CLIENTE_RFC: ['rfc', 'RFC'],
  CLIENTE_REPRESENTANTE: ['representante', ''], CLIENTE_DOMICILIO: ['domicilio', 'domicilio'], CLIENTE_CORREO: ['correo', 'correo'],
  CLIENTE_WHATSAPP: ['whatsapp', 'WhatsApp'], CLIENTE_GOOGLE: ['correo_google', 'cuenta de Google'], PLATAFORMAS: ['plataformas', 'plataformas'] };

function bloqueFirmas(c, d) {
  const cliente = c ? c.razon_social : (d.razon_social || '');
  const por = c ? c.representante : d.representante;
  return `<div class="firmas">
    <div class="firma-col"><span>EL PRESTADOR</span>${c && c.firma_prestador ? `<img src="${esc(c.firma_prestador)}" alt="Firma de EL PRESTADOR">` : '<i class="sin-firma">Pendiente</i>'}
      <b>Manuel Alejandro Pérez Becerra</b><small>Connect Studios${c && c.firma_prestador_at ? ' · ' + esc(fechaHora(c.firma_prestador_at)) : ''}</small></div>
    <div class="firma-col"><span>EL CLIENTE</span>${c ? `<img src="${esc(c.firma_cliente)}" alt="Firma de EL CLIENTE">` : '<i class="sin-firma">Tu firma va aquí</i>'}
      <b>${esc(cliente) || '&nbsp;'}</b><small>${por ? 'Por: ' + esc(por) + ' · ' : ''}${c ? esc(c.firmado_por) + ' · ' + esc(fechaHora(c.firmado_at)) : 'Firma abajo'}</small></div>
  </div>`;
}

// Vista previa: los datos del cliente se llenan mientras escribe. El texto que se guarda lo arma la base.
function llenarContrato(d) {
  let h = P.contrato_plantilla || '';
  for (const [k, [campo, nombre]] of Object.entries(CAMPOS_CLIENTE)) {
    let v = String(d[campo] || '').trim();
    if (k === 'CLIENTE_REPRESENTANTE' && !v) v = 'No aplica';
    h = h.split(`{{${k}}}`).join(v ? `<mark>${esc(v)}</mark>` : `<mark class="falta">[${esc(nombre)}]</mark>`);
  }
  return h.split('{{FIRMAS}}').join(bloqueFirmas(null, d));
}

function datosFirma(f) {
  return {
    razon_social: f.elements.razon_social.value.trim(), rfc: f.elements.rfc.value.toUpperCase().replace(/[\s-]/g, ''),
    representante: f.elements.representante.value.trim(), domicilio: f.elements.domicilio.value.trim(),
    correo: f.elements.correo.value.trim(), whatsapp: f.elements.whatsapp.value.trim(), correo_google: f.elements.correo_google.value.trim().toLowerCase().replace(/\s+/g, ''),
    plataformas: [...f.querySelectorAll('input[name=plataforma]:checked')].map(x => x.value).join(', '),
    nombre_firma: f.elements.nombre_firma.value.trim()
  };
}

let lienzo = null;

  cerrarCapa();

    <form data-form="firmar" novalidate>
      <div class="bloque-firma" style="margin-top:0;padding-top:0;border:0"><h3>1. Tus datos para el contrato</h3><p>Como aparecen en tu constancia de situación fiscal.</p>

        <div class="dos">
          <div class="campo"><label for="c-correo">Correo para avisos</label><input id="c-correo" name="correo" type="email" maxlength="200" autocomplete="email" value="${esc(P.correo || '')}"></div>
          <div class="campo"><label for="c-wa">WhatsApp para avisos</label><input id="c-wa" name="whatsapp" type="tel" maxlength="25" autocomplete="tel" value="${esc(P.whatsapp || '')}"></div>
        </div>
        <div class="dos">

        <div class="campo"><span class="lbl">Redes donde publicamos <span style="font-weight:400;color:var(--crema-3)">(hasta 4)</span></span>
          <div class="plataformas">${PLATAFORMAS.map(x => `<label><input type="checkbox" name="plataforma" value="${x}"${['Instagram', 'Facebook'].includes(x) ? ' checked' : ''}> ${x}</label>`).join('')}</div></div>
      </div>
      <div class="bloque-firma"><h3>2. Lee tu contrato</h3><p>Lo resaltado en amarillo son los datos que escribiste arriba; lo que esté en rojo todavía falta.</p>
        <div class="hoja-scroll"><div class="hoja" data-vista></div></div>
      </div>
      <div class="bloque-firma"><h3>3. Firma</h3><p>Con el dedo o el mouse, dentro del recuadro.</p>
        <div class="campo"><label for="c-nombre">Nombre de quien firma</label><input id="c-nombre" name="nombre_firma" maxlength="120" autocomplete="name" value="${esc(P.aceptada_por || P.nombre)}"></div>
        <div class="lienzo"><canvas aria-label="Recuadro para firmar"></canvas><div class="linea-firma"></div><div class="pista" data-pista>Firma aquí</div></div>
        <div class="acciones" style="margin-top:.6rem"><button class="enlace" type="button" data-accion="borrar-firma">Borrar firma</button></div>

        <div class="acciones"><button class="btn btn-v btn-grande" type="submit"${previa ? ' disabled' : ''}>Firmar contrato</button><button class="enlace" type="button" data-accion="cerrar-capa">Ahora no</button></div>
        <p class="error" data-error hidden></p>
      </div>
    </form>
  </div>`;
  document.body.appendChild(capa);
  document.body.style.overflow = 'hidden';
  const f = capa.querySelector('form');
  const pintarVista = () => { capa.querySelector('[data-vista]').innerHTML = llenarContrato(datosFirma(f)); };
  f.addEventListener('input', pintarVista);
  f.addEventListener('change', e => {
    if (e.target.name === 'plataforma' && f.querySelectorAll('input[name=plataforma]:checked').length > 4) { e.target.checked = false; }
    pintarVista();
  });
  pintarVista();
  lienzo = prepararLienzo(capa.querySelector('canvas'), capa.querySelector('[data-pista]'));
  f.elements.rfc.focus({ preventScroll: true });
}

// Recuadro de firma: trazos suaves, nítido en pantallas de alta densidad
function prepararLienzo(cv, pista) {
  const ctx = cv.getContext('2d');
  let trazos = 0, dibujando = false, ultimo = null;
  const ajustar = () => {
    const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111'; ctx.lineWidth = 2.4;
  };
  ajustar();
  const punto = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.addEventListener('pointerdown', e => { dibujando = true; ultimo = punto(e); pista.hidden = true; try { cv.setPointerCapture(e.pointerId); } catch (_) { /* sin captura, igual dibuja */ } e.preventDefault(); });
  cv.addEventListener('pointermove', e => {
    if (!dibujando) return;
    const p = punto(e);
    ctx.beginPath(); ctx.moveTo(ultimo.x, ultimo.y);
    ctx.quadraticCurveTo(ultimo.x, ultimo.y, (ultimo.x + p.x) / 2, (ultimo.y + p.y) / 2); ctx.lineTo(p.x, p.y); ctx.stroke();
    ultimo = p; trazos++;
  });
  const soltar = () => { dibujando = false; };
  cv.addEventListener('pointerup', soltar); cv.addEventListener('pointercancel', soltar);
  return {
    vacio: () => trazos < 12,
    borrar: () => { ctx.clearRect(0, 0, cv.width, cv.height); trazos = 0; pista.hidden = false; },
    png: () => {
      // Recorta el espacio vacío para que la imagen pese poco
      const w = cv.width, h = cv.height, px = ctx.getImageData(0, 0, w, h).data;
      let x0 = w, y0 = h, x1 = 0, y1 = 0;
      for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) if (px[(y * w + x) * 4 + 3] > 0) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      const m = 12, ox = Math.max(0, x0 - m), oy = Math.max(0, y0 - m), ow = Math.min(w, x1 + m) - ox, oh = Math.min(h, y1 + m) - oy;
      const out = document.createElement('canvas'); out.width = ow; out.height = oh;
      out.getContext('2d').drawImage(cv, ox, oy, ow, oh, 0, 0, ow, oh);
      return out.toDataURL('image/png');
    }
  };
}

function verContrato() {
  cerrarCapa();
  const c = P.contrato;
  const capa = document.createElement('div');
  capa.className = 'capa'; capa.id = 'capa-contrato';
  capa.innerHTML = `<div class="capa-in" role="dialog" aria-modal="true" aria-labelledby="contrato-titulo">
    <div class="capa-cab"><div><h2 id="contrato-titulo">Tu contrato</h2><p>${c.firma_prestador_at ? 'Firmado por las dos partes.' : 'Firmado por ti. Falta mi firma: te aviso cuando esté.'}</p></div>
      <button class="cerrar" type="button" data-accion="cerrar-capa" aria-label="Cerrar">×</button></div>
    <div class="contrato-acciones"><button class="btn btn-v" type="button" data-accion="imprimir">Descargar PDF</button><span style="color:var(--crema-3);font-size:.85rem;align-self:center">Elige "Guardar como PDF" en la ventana que se abre.</span></div>
    <div class="hoja">${c.html.split('{{FIRMAS}}').join(bloqueFirmas(c))}
      <div class="certificado"><h3>Certificado de firma electrónica</h3>
        <p><b>Documento:</b> Contrato de prestación de servicios de producción de contenido audiovisual y su Anexo 1 (versión ${esc(c.version)}).</p>
        <p><b>Huella del documento (SHA-256):</b> ${esc(c.hash)}</p>
        <p><b>Firmó EL CLIENTE:</b> ${esc(c.firmado_por)}, por ${esc(c.razon_social)}, el ${esc(fechaHora(c.firmado_at))} (hora del centro de México)${c.firma_ip ? `, desde la IP ${esc(c.firma_ip)}` : ''}.</p>
        ${c.firma_navegador ? `<p><b>Navegador:</b> ${esc(c.firma_navegador)}</p>` : ''}
        <p><b>Firmó EL PRESTADOR:</b> ${c.firma_prestador_at ? `Manuel Alejandro Pérez Becerra, el ${esc(fechaHora(c.firma_prestador_at))} (hora del centro de México)` : 'pendiente'}.</p>
        <p><b>Plataforma:</b> Portal de Connect Studios (portal.connectstudios.mx). Cualquier cambio al texto cambiaría su huella.</p>
      </div>
    </div>
  </div>`;
  document.body.appendChild(capa);
  document.body.style.overflow = 'hidden';
}

function cerrarCapa() {
  document.querySelectorAll('.capa').forEach(x => x.remove());
  document.body.style.overflow = '';
  lienzo = null;
}

async function pagarConTarjeta(boton) {
  const err = document.querySelector('[data-error-pago]');
  boton.disabled = true; const txt = boton.textContent; boton.textContent = 'Abriendo el pago…';
  try {
    const r = await fetch(CONFIG.PAGOS, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ accion: boton.dataset.que || 'anticipo', token }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.url) throw new Error(d.error || 'No se pudo iniciar el pago.');
    location.href = d.url;
  } catch (e) {
    boton.disabled = false; boton.textContent = txt;
    if (err) { err.textContent = String(e.message || e) + ' También puedes pagar por transferencia.'; err.hidden = false; }
  }
}

// Al regresar de Stripe el aviso del banco tarda unos segundos: se revisa varias veces
async function confirmarPago(intentos) {
  if (!pagoVuelta || !P || pagoListo(P) || intentos <= 0) {
    if (pagoVuelta) history.replaceState(null, '', location.pathname + location.hash);
    return;
  }
  await new Promise(r => setTimeout(r, 3000));
  try {
    const nuevo = await rpc('propuesta_ver', { p_token: token, p_registrar: false });
    if (nuevo && pagoListo(nuevo)) { P = nuevo; pintar(); document.getElementById('decision').scrollIntoView({ block: 'start' }); history.replaceState(null, '', location.pathname + location.hash); return; }
  } catch (e) { /* se vuelve a intentar */ }
  if (intentos === 1) { const m = document.querySelector('[data-confirmando]'); if (m) m.textContent = 'Tu pago se está procesando. En cuanto el banco lo confirme lo verás aquí.'; }
  return confirmarPago(intentos - 1);
}

function repintarDecision(enfocar) {
  const d = document.getElementById('decision');
  if (!d) return pintar();
  d.outerHTML = bloqueDecision();
  const nuevo = document.getElementById('decision');
  nuevo.classList.add('visto');
  barraFija();
  if (enfocar) {
    const campo = nuevo.querySelector('input:not([type=radio]), input[type=radio]');
    if (campo) campo.focus({ preventScroll: true });
    nuevo.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

// ---------- Apariciones suaves y barra para aceptar ----------
let ioBarra = null;
function animar() {
  const els = document.querySelectorAll('.r, .linea-t');
  if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) { els.forEach(e => e.classList.add('visto')); return; }
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visto'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
  els.forEach(e => io.observe(e));
}
function barraFija() {
  const fija = document.getElementById('fija');
  const puede = P && !P.aceptada_at && !P.vencida;
  fija.querySelector('span').innerHTML = puede ? `${esc(P.empresa)}<b>${esc(dinero(P.precio))}</b>` : '';
  if (ioBarra) ioBarra.disconnect();
  if (!puede || !('IntersectionObserver' in window)) { fija.classList.remove('ver'); return; }
  const vistos = new Map();
  ioBarra = new IntersectionObserver(es => {
    es.forEach(e => vistos.set(e.target, e.isIntersecting));
    const ver = ![...vistos.values()].some(Boolean);
    fija.classList.toggle('ver', ver);
    fija.setAttribute('aria-hidden', String(!ver));
    fija.querySelector('button').tabIndex = ver ? 0 : -1;
  });
  [document.querySelector('.portada'), document.getElementById('decision')].forEach(el => el && ioBarra.observe(el));
}

// ---------- Acciones ----------
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-accion]');
  if (!el) return;
  const a = el.dataset.accion;
  if (a === 'ir') { const d = document.getElementById(el.dataset.id); if (d) d.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (a === 'abrir-aceptar' || a === 'ir-aceptar') { panel = 'aceptar'; repintarDecision(true); }
  else if (a === 'abrir-rechazar') { panel = 'rechazar'; repintarDecision(true); }
  else if (a === 'cerrar-panel') { panel = ''; repintarDecision(false); }
  else if (a === 'abrir-firma') { abrirFirma(); }
  else if (a === 'ver-contrato') { verContrato(); }
  else if (a === 'cerrar-capa') { cerrarCapa(); }
  else if (a === 'borrar-firma') { if (lienzo) lienzo.borrar(); }
  else if (a === 'imprimir') { document.body.classList.add('imprimiendo'); window.print(); setTimeout(() => document.body.classList.remove('imprimiendo'), 500); }
  else if (a === 'pagar-tarjeta') { if (!previa) pagarConTarjeta(el); }
  else if (a === 'abrir-ajustes') { ajustesAbiertos = true; porAprobar = false; repintarDecision(false); const t = document.querySelector('#revisar textarea'); if (t) t.focus(); }
  else if (a === 'cerrar-ajustes') { ajustesAbiertos = false; repintarDecision(false); document.getElementById('revisar').scrollIntoView({ block: 'center' }); }
  else if (a === 'pre-aprobar') { porAprobar = true; repintarDecision(false); }
  else if (a === 'cancelar-aprobar') { porAprobar = false; repintarDecision(false); }
  else if (a === 'aprobar-entrega') { if (!previa) aprobarEntrega(el); }
  else if (a === 'ver-transferencia') { verTransferencia = !verTransferencia; repintarDecision(false); }
  else if (a === 'ver-video') {
    const caja = el.closest('[data-yt]');
    caja.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${caja.dataset.yt}?autoplay=1&rel=0" title="Ejemplo de video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
  }
  else if (a === 'dia-pago') { elegirDia(Number(el.dataset.dia)); }
  else if (a === 'ver-reel') {
    const marco = el.closest('.marco');
    const v = document.createElement('video');
    Object.assign(v, { src: el.dataset.video, controls: true, autoplay: true, playsInline: true });
    v.setAttribute('playsinline', '');
    v.addEventListener('play', () => document.querySelectorAll('.reel video').forEach(o => { if (o !== v) o.pause(); }));
    marco.querySelector('img').replaceWith(v);
    marco.querySelectorAll('.tipo, button').forEach(x => x.remove());
    v.play().catch(() => {});
  }
  else if (a === 'copiar') {
    const t = el.dataset.texto || '';
    try { await navigator.clipboard.writeText(t); }
    catch (e) { const ta = Object.assign(document.createElement('textarea'), { value: t }); document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (_) {} ta.remove(); }
    el.textContent = 'Copiada ✓';
    setTimeout(() => { el.textContent = 'Copiar CLABE'; }, 2200);
  }
});

document.addEventListener('submit', async ev => {
  const f = ev.target.closest('form[data-form]');
  if (!f) return;
  ev.preventDefault();
  if (previa) return;
  const err = f.querySelector('[data-error]'), boton = f.querySelector('[type=submit]');
  const decir = t => { err.textContent = t; err.hidden = !t; };
  decir('');
  if (f.dataset.form === 'firmar') return firmar(f, boton, decir);
  if (f.dataset.form === 'ajustes') { if (!ajustesAbiertos || !boton) return; return pedirAjustes(f, boton, decir); }
  try {
    if (f.dataset.form === 'aceptar') {
      const nombre = f.elements.nombre.value.trim();
      if (nombre.length < 2) { decir('Escribe tu nombre para aceptar.'); return f.elements.nombre.focus(); }
      const opDia = f.querySelector('input[name=dia_pago]:checked');
      if (f.querySelector('input[name=dia_pago]') && !opDia) { decir('Elige tu día de pago: el 1 o el 15 de cada mes.'); return; }
      boton.disabled = true; boton.textContent = 'Aceptando…';
      if (opDia && Number(opDia.value) !== P.dia_pago) P = await rpc('propuesta_dia_pago', { p_token: token, p_dia: Number(opDia.value) });
      P = await rpc('propuesta_aceptar', { p_token: token, p_nombre: nombre });
      panel = '';
      pintar();
      document.getElementById('decision').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } else {
      const motivo = (f.querySelector('input[name=motivo]:checked') || {}).value;
      if (!motivo) { decir('Elige una opción.'); return; }
      boton.disabled = true; boton.textContent = 'Enviando…';
      P = await rpc('propuesta_rechazar', { p_token: token, p_motivo: motivo, p_comentario: f.elements.comentario.value.trim() });
      panel = '';
      repintarDecision(false);
    }
  } catch (e) {
    boton.disabled = false; boton.textContent = f.dataset.form === 'aceptar' ? 'Confirmar y aceptar' : 'Enviar';
    const m = String(e && e.message || '');
    decir(/propuesta_vencida/.test(m) ? 'Esta propuesta ya venció. Escríbeme y la actualizamos.'
      : /Failed to fetch|NetworkError|Load failed/i.test(m) ? 'No hay conexión. Revisa tu internet e inténtalo de nuevo.'
      : 'No se pudo guardar. Inténtalo de nuevo o escríbeme por WhatsApp.');
  }
});

async function firmar(f, boton, decir) {
  const d = datosFirma(f);
  const correoOk = t => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(t);
  const falta = (campo, txt) => { decir(txt); const el = f.elements[campo]; if (el && el.focus) el.focus(); };
  if (d.razon_social.length < 2) return falta('razon_social', 'Escribe tu nombre o razón social.');
  if (!RFC_OK.test(d.rfc)) return falta('rfc', 'Revisa tu RFC: son 12 caracteres si es empresa o 13 si es persona física.');
  if (d.domicilio.length < 5) return falta('domicilio', 'Escribe tu domicilio completo.');
  if (!correoOk(d.correo)) return falta('correo', 'Revisa el correo para avisos.');
  if (!/^\d{10,15}$/.test(d.whatsapp.replace(/\D/g, ''))) return falta('whatsapp', 'Revisa el WhatsApp: 10 dígitos.');
  if (!correoOk(d.correo_google)) return falta('correo_google', 'Escribe la cuenta de Google con la que vas a entrar al portal.');
  if (d.correo_google !== f.elements.correo_google2.value.trim().toLowerCase().replace(/\s+/g, '')) return falta('correo_google2', 'Las dos cuentas de Google no coinciden. Revísalas letra por letra.');
  if (!d.plataformas) return decir('Elige al menos una red donde publicamos.');
  if (d.nombre_firma.length < 2) return falta('nombre_firma', 'Escribe el nombre de quien firma.');
  if (!lienzo || lienzo.vacio()) return decir('Dibuja tu firma en el recuadro.');
  if (!f.elements.acepto.checked) return decir('Marca la casilla para aceptar firmar el contrato.');
  boton.disabled = true; boton.textContent = 'Firmando…';
  try {
    P = await rpc('contrato_firmar', { p_token: token, p_datos: d, p_firma: lienzo.png() });
    cerrarCapa();
    pintar();
    document.getElementById('decision').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    boton.disabled = false; boton.textContent = 'Firmar contrato';
    const m = String(e && e.message || '');
    decir(/contratos_rfc_check/.test(m) ? 'Revisa tu RFC.' : /contratos_(correo|correo_google)_check/.test(m) ? 'Revisa los correos.'
      : /contratos_whatsapp_check/.test(m) ? 'Revisa el WhatsApp.' : /contratos_domicilio_check/.test(m) ? 'Revisa el domicilio.'
      : /Failed to fetch|NetworkError|Load failed/i.test(m) ? 'No hay conexión. Revisa tu internet e inténtalo de nuevo.'
      : 'No se pudo firmar. Inténtalo de nuevo o escríbeme por WhatsApp.');
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.querySelector('.capa')) cerrarCapa(); });

// ---------- Arranque ----------
async function arrancar() {
  if (!/^[A-Za-z0-9_-]{10,40}$/.test(token)) {
    return pantallaSola('Falta el link', 'Este link está incompleto. Ábrelo desde el mensaje que te mandé o pídemelo de nuevo.',
      `<a class="btn btn-v" href="${esc(wa('Hola Manuel, no me abre el link de la propuesta. ¿Me lo mandas de nuevo?'))}" target="_blank" rel="noopener">${WA_ICONO} Pedir el link</a>`);
  }
  try {
    P = await rpc('propuesta_ver', { p_token: token, p_registrar: !previa });
  } catch (e) {
    return pantallaSola('No cargó', 'No pude cargar la propuesta. Revisa tu conexión e inténtalo de nuevo.',
      '<button class="btn btn-v" type="button" onclick="location.reload()">Intentar de nuevo</button>');
  }
  if (!P) {
    return pantallaSola('No la encuentro', 'Esta propuesta no existe o ya no está disponible. Escríbeme y te la mando de nuevo.',
      `<a class="btn btn-v" href="${esc(wa('Hola Manuel, no encuentro la propuesta que me mandaste. ¿Me la compartes de nuevo?'))}" target="_blank" rel="noopener">${WA_ICONO} Escribirme</a>`);
  }
  pintar();
  if (new URLSearchParams(location.search).has('contrato') && P.contrato) verContrato();
  else if (enRevision() && !pagoVuelta) setTimeout(() => { const r = document.getElementById('revisar'); if (r) r.closest('li').scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 600);
  confirmarPago(10);
}
window.addEventListener('hashchange', () => {
  const nuevo = leerToken();
  if (nuevo && nuevo !== token) location.reload();
  else if (location.hash !== '#' + token) history.replaceState(null, '', location.pathname + location.search + '#' + token);
});
arrancar();
</script>
