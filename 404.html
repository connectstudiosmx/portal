<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Página no encontrada · Connect Studios</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23000'/%3E%3Crect x='14' y='10' width='36' height='44' rx='4' fill='none' stroke='%23F3E7C8' stroke-width='5'/%3E%3Crect x='14' y='44' width='36' height='10' fill='%23E3B23C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --negro:#000;
  --linea-2:#3A3A40;
  --crema:#F2EFE9;
  --crema-2:#C9C5BD;
  --crema-3:#8A867F;
  --verde:#39FF88;
  --display:'Anton',Impact,'Arial Narrow',sans-serif;
  --texto:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --suave:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100svh;background:var(--negro);color:var(--crema);font-family:var(--texto);line-height:1.55;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--verde);outline-offset:3px}
.fondo{position:fixed;inset:0;z-index:-2;background:url(/img/set.webp) center/cover no-repeat;filter:saturate(.6) brightness(.3)}
.velo{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at center,rgba(0,0,0,.35) 0%,#000 80%)}
header{padding:1.4rem clamp(1rem,4vw,2.5rem)}
.logo{display:block;width:132px;height:auto}
.logo-txt{font-family:var(--display);text-transform:uppercase;font-size:1.2rem;text-decoration:none}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1rem 4rem}
.num{font-family:var(--display);font-size:clamp(7rem,28vw,16rem);line-height:.8;color:transparent;-webkit-text-stroke:2px var(--verde);margin:0;animation:aparece .9s var(--suave) both}
.num span{display:inline-block;animation:parpadea 4s steps(1) 1.2s infinite}
@keyframes parpadea{0%,100%{opacity:1}92%{opacity:.2}94%{opacity:1}96%{opacity:.35}}
h1{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(2rem,6vw,3.2rem);line-height:.95;margin:1.4rem 0 .7rem;animation:aparece .9s var(--suave) .15s both}
p{color:var(--crema-2);max-width:28rem;margin:0 0 2rem;animation:aparece .9s var(--suave) .25s both}
.acciones{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;animation:aparece .9s var(--suave) .35s both}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:2.8rem;padding:0 1.2rem;border:1px solid var(--linea-2);border-radius:999px;font-weight:600;font-size:.92rem;text-decoration:none;background:rgba(0,0,0,.5);transition:border-color .2s,background .2s,transform .2s}
.btn:hover{border-color:var(--crema-3);background:#111;transform:translateY(-2px)}
.btn-v{background:var(--verde);border-color:var(--verde);color:#000}
.btn-v:hover{background:var(--verde)}
@keyframes aparece{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="fondo" aria-hidden="true"></div>
<div class="velo" aria-hidden="true"></div>
<header>
  <a href="https://connectstudios.mx" aria-label="Connect Studios, ir al sitio">
    <img class="logo" src="https://connectstudios.mx/assets/img/logo-connect.webp" alt="Connect Studios" width="640" height="180"
      onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo-txt',textContent:'Connect Studios'}))">
  </a>
</header>
<main>
  <p class="num" aria-hidden="true">4<span>0</span>4</p>
  <h1>Esta toma no existe</h1>
  <p>El link está mal escrito o la página ya no está. Estos sí funcionan:</p>
  <nav class="acciones" aria-label="Páginas">
    <a class="btn btn-v" href="/empezar/">Platiquemos</a>
    <a class="btn" href="/guia/">Guía gratis</a>
    <a class="btn" href="https://connectstudios.mx">Sitio web</a>
  </nav>
</main>
</body>
</html>
