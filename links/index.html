<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Connect Studios · Links</title>
<meta name="description" content="Video corporativo con dirección creativa. Guadalajara.">
<meta property="og:type" content="website">
<meta property="og:title" content="Connect Studios">
<meta property="og:description" content="Video corporativo con dirección creativa. Guadalajara.">
<meta property="og:image" content="https://connectstudios.mx/assets/img/reel-portada.webp">
<meta property="og:url" content="https://portal.connectstudios.mx/links/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23000'/%3E%3Crect x='14' y='10' width='36' height='44' rx='4' fill='none' stroke='%23F3E7C8' stroke-width='5'/%3E%3Crect x='14' y='44' width='36' height='10' fill='%23E3B23C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400..700&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js')</script>
<style>
:root{
  --negro:#000;
  --panel:#0B0B0C;
  --linea:#26262A;
  --linea-2:#3A3A40;
  --crema:#F2EFE9;
  --crema-2:#C9C5BD;
  --crema-3:#8A867F;
  --verde:#39FF88;
  --display:'Anton',Impact,'Arial Narrow',sans-serif;
  --texto:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --suave:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100svh;background:var(--negro);color:var(--crema);font-family:var(--texto);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--verde);outline-offset:3px}

.fondo{position:fixed;inset:0;z-index:-2;background:url(https://connectstudios.mx/assets/img/bts/bts-2.webp) center 25%/cover no-repeat;filter:grayscale(.3) brightness(.38);transform:scale(1.06)}
.js .fondo{animation:acerca 2.2s var(--suave) both}
@keyframes acerca{from{transform:scale(1.2);filter:grayscale(.3) brightness(.08)}}
.velo{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.75) 55%,#000 100%)}

main{flex:1;width:100%;max-width:30rem;margin:0 auto;padding:clamp(2.5rem,9vh,5rem) 1rem 2rem;display:flex;flex-direction:column}
.logo{display:block;width:150px;height:auto;margin:0 auto}
.logo-txt{display:block;text-align:center;font-family:var(--display);text-transform:uppercase;font-size:1.4rem}
h1{font-family:var(--display);font-weight:400;text-transform:uppercase;text-align:center;font-size:clamp(2.1rem,9vw,2.8rem);line-height:.95;margin:2rem 0 .7rem}
h1 em{font-style:normal;color:var(--verde)}
.sub{text-align:center;color:var(--crema-2);font-size:.95rem;margin:0 0 2.2rem}

.links{display:grid;gap:.75rem}
.link{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:1rem;padding:1.05rem 1.2rem;border-radius:14px;border:1px solid var(--linea-2);background:rgba(11,11,12,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-decoration:none;transition:transform .3s var(--suave),border-color .3s,background .3s}
.link b{display:block;font-weight:700;font-size:1.02rem}
.link small{display:block;color:var(--crema-3);font-size:.82rem;margin-top:.1rem}
.link svg{width:20px;height:20px;transition:transform .3s var(--suave)}
.link:hover{transform:translateY(-3px);border-color:var(--crema-3)}
.link:hover svg{transform:translateX(4px)}
.link-p{background:var(--verde);border-color:var(--verde);color:#000}
.link-p small{color:rgba(0,0,0,.62)}
.link-p:hover{border-color:var(--verde);box-shadow:0 10px 32px rgba(57,255,136,.28)}
.link-p::before{content:"";position:absolute;top:0;bottom:0;width:35%;left:-50%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:destello 3.6s ease-in-out 1.4s infinite}
@keyframes destello{0%{left:-50%}35%,100%{left:130%}}
.etiqueta{display:inline-block;font-size:.64rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--verde);border:1px solid rgba(57,255,136,.5);border-radius:999px;padding:.05rem .45rem;margin-left:.45rem;vertical-align:2px}

.pie{text-align:center;color:var(--crema-3);font-size:.78rem;margin-top:auto;padding-top:3rem}

.js .entra{opacity:0;transform:translateY(16px);animation:aparece .7s var(--suave) forwards}
@keyframes aparece{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.js .entra{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="fondo" aria-hidden="true"></div>
<div class="velo" aria-hidden="true"></div>
<main>
  <img class="logo entra" src="https://connectstudios.mx/assets/img/logo-connect.webp" alt="Connect Studios" width="640" height="180"
    onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo-txt',textContent:'Connect Studios'}))">
  <h1 class="entra" style="animation-delay:.1s">La reputación<br>ya la hiciste <em>tú.</em></h1>
  <p class="sub entra" style="animation-delay:.18s">Que se vea bien me toca a mí.</p>

  <nav class="links" aria-label="Links">
    <a class="link link-p entra" style="animation-delay:.26s" data-destino="/empezar/" href="/empezar/">
      <span><b>Platiquemos</b><small>Cuéntame de tu negocio y agenda una llamada</small></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <a class="link entra" style="animation-delay:.34s" data-destino="/guia/" href="/guia/">
      <span><b>Guía: 12 videos para tu negocio <span class="etiqueta">Gratis</span></b><small>Qué grabar este mes y cómo repartirlo</small></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <a class="link entra" style="animation-delay:.42s" data-destino="https://connectstudios.mx/" href="https://connectstudios.mx/">
      <span><b>Sitio web</b><small>Trabajo, servicios y demo reel</small></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </nav>

  <p class="pie">© Connect Studios · <a href="/privacidad.html">Privacidad</a></p>
</main>

<script>
// Cada botón lleva de dónde viene la visita. Por defecto: instagram / bio.
// Para otra red usa, por ejemplo: portal.connectstudios.mx/links/?s=tiktok
(function () {
  const p = new URLSearchParams(location.search);
  const fuente = (p.get('s') || p.get('utm_source') || 'instagram').replace(/[^\w-]/g, '').slice(0, 30) || 'instagram';
  document.querySelectorAll('[data-destino]').forEach(a => {
    const u = new URL(a.dataset.destino, location.origin);
    u.searchParams.set('utm_source', fuente);
    u.searchParams.set('utm_medium', 'bio');
    a.href = u.toString();
  });
})();
</script>
</body>
</html>
