<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Portal de Connect Studios</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23000'/%3E%3Crect x='14' y='10' width='36' height='44' rx='4' fill='none' stroke='%23F3E7C8' stroke-width='5'/%3E%3Crect x='14' y='44' width='36' height='10' fill='%23E3B23C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400..700&family=Bangers&family=Lobster&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,900;1,900&family=Poppins:wght@800&family=Righteous&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --negro:#000;
  /* Neutros como connectstudios.mx (sin tono café) */
  --panel:#0F0F10;
  --panel-2:#18181A;
  --linea:#26262A;
  --linea-2:#3A3A40;
  --crema:#F2EFE9;
  --crema-2:#C9C5BD;
  --crema-3:#8A867F;
  --dorado:#E3B23C;
  --dorado-2:#F0C65E;
  --amarillo:#FFD23F;  /* fechas límite */
  --verde:#39FF88;   /* verde de marca, el de connectstudios.mx */
  --verde-2:#7DFFB0;
  --verde-t:rgba(57,255,136,.14);
  --rojo:#F0705A;
  --display:'Anton',Impact,'Arial Narrow',sans-serif;
  --texto:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r1:4px;--r2:8px;
  --ancho:1180px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--negro);color:var(--crema);font-family:var(--texto);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--verde);text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--verde);outline-offset:2px}
[hidden]{display:none!important}
.nota{font-size:.82rem;color:var(--crema-3)}
.vacio{color:var(--crema-3);font-weight:500}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:2.25rem;padding:0 .95rem;border:1px solid var(--linea-2);border-radius:var(--r2);background:transparent;color:var(--crema);font-weight:600;font-size:.9rem;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--panel-2);border-color:var(--crema-3)}
.btn-p{background:var(--verde);border-color:var(--verde);color:#000}
.btn-p:hover{background:var(--verde-2);border-color:var(--verde-2)}
.btn-s{min-height:1.9rem;padding:0 .7rem;font-size:.82rem}
.btn-t{border-color:transparent;color:var(--crema-2)}
.btn-t:hover{color:var(--crema);border-color:transparent}
.btn-peligro{color:var(--rojo);border-color:rgba(240,112,90,.45)}
.btn-peligro:hover{color:var(--rojo);border-color:var(--rojo)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Barra superior */
.barra{position:sticky;top:0;z-index:30;background:rgba(0,0,0,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--linea);padding-top:env(safe-area-inset-top,0px)}
.barra-in{max-width:1400px;margin:0 auto;padding:.7rem 1.25rem;display:flex;align-items:center;gap:.5rem 1.25rem;flex-wrap:wrap}
.marca{display:flex;align-items:baseline;gap:.55rem}
.marca b{font-family:var(--display);font-weight:400;font-size:1.4rem;line-height:1;letter-spacing:.015em;text-transform:uppercase}
.marca b::after{content:"";display:inline-block;width:.3em;height:.3em;margin-left:.12em;background:var(--verde);vertical-align:.02em}
.marca span{font-size:.85rem;color:var(--crema-3);font-weight:500}
.nav{display:flex;gap:.2rem;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:none;padding:.45rem .62rem;border-radius:var(--r2);color:var(--crema-2);font-weight:600;font-size:.92rem;cursor:pointer;white-space:nowrap}
.nav button:hover{color:var(--crema);background:var(--panel-2)}
.nav button[aria-current="page"]{background:var(--crema);color:#000}
.punto{display:inline-grid;place-items:center;min-width:1.15rem;height:1.15rem;padding:0 .3rem;margin-left:.25rem;border-radius:999px;background:var(--dorado);color:#000;font-size:.68rem;font-weight:800;vertical-align:1px}
.quien{margin-left:auto;display:flex;align-items:center;gap:.6rem;font-size:.85rem}
.quien-txt{display:grid;line-height:1.15;text-align:right}
.quien-txt strong{font-weight:600}
.quien-txt small{color:var(--crema-3);font-size:.74rem}
@media (max-width:720px){.nav{order:3;width:100%}}

main.app{max-width:var(--ancho);margin:0 auto;padding:1.75rem 1.25rem 5rem}
.encabezado{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem 1.5rem;flex-wrap:wrap;margin-bottom:1.4rem}
.encabezado h1{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(2.2rem,5vw,3.1rem);line-height:.95;margin:0}
.sub{color:var(--crema-2);margin:.4rem 0 0;max-width:62ch}
.controles{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.campo-in{height:2.25rem;background:var(--panel);border:1px solid var(--linea-2);border-radius:var(--r2);padding:0 .7rem;color:var(--crema);max-width:100%}
.interruptor{display:inline-flex;align-items:center;gap:.45rem;font-size:.88rem;color:var(--crema-2);cursor:pointer;user-select:none}
.interruptor input{accent-color:var(--verde);width:1rem;height:1rem;margin:0}
.caja-vacia{border:1px dashed var(--linea-2);border-radius:var(--r2);padding:2rem 1.5rem;color:var(--crema-2);max-width:40rem}
.caja-vacia p{margin:0 0 1rem}
.error-linea{color:var(--rojo);font-weight:600}

/* Estados */
.estado{display:inline-flex;align-items:center;height:1.55rem;padding:0 .6rem;border-radius:999px;border:1.5px solid transparent;font-size:.76rem;font-weight:700;white-space:nowrap;line-height:1}
.e-sin_guion{border-style:dashed;border-color:var(--crema-3);color:var(--crema-3)}
.e-guion{background:rgba(242,239,233,.13);color:var(--crema)}
.e-grabado{background:var(--crema);color:#000}
.e-edicion,.e-produccion{background:var(--dorado);color:#000}
.e-revision{border-color:var(--dorado);color:var(--dorado)}
.e-listo{border-color:var(--verde);color:var(--verde)}
.e-entregado{background:var(--verde);color:#000}

/* Tira de avance: un cuadro por video */
.tira{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;height:8px;min-width:96px}
.tira i{border-radius:2px}
.tira .s-sin_guion{border:1px dashed var(--crema-3)}
.tira .s-guion{background:rgba(242,239,233,.3)}
.tira .s-grabado{background:var(--crema)}
.tira .s-edicion,.tira .s-produccion{background:var(--dorado)}
.tira .s-revision{background:repeating-linear-gradient(135deg,var(--dorado) 0 3px,transparent 3px 6px);outline:1px solid rgba(227,178,60,.6);outline-offset:-1px}
.tira .s-listo{border:1px solid var(--verde);background:var(--verde-t)}
.tira .s-entregado{background:var(--verde)}

/* Producción */
.grupo{background:var(--panel);border:1px solid var(--linea);border-left:4px solid var(--linea-2);border-radius:var(--r2);margin-bottom:1.1rem}
.grupo.n-urgente{border-left-color:var(--dorado)}
.grupo.n-vencido{border-left-color:var(--rojo)}
.grupo.n-hecho{border-left-color:var(--verde)}
/* Producción: cliente → meses → videos */
.cli-prod{background:var(--panel);border:1px solid var(--linea);border-left:4px solid var(--linea-2);border-radius:12px;margin-bottom:1rem}
.cli-prod.n-urgente{border-left-color:var(--amarillo)}
.cli-prod.n-vencido{border-left-color:var(--rojo)}
.cli-prod.n-hecho{border-left-color:var(--verde)}
.cp-cab{display:flex;align-items:flex-start;justify-content:space-between;gap:.8rem 1.4rem;flex-wrap:wrap;padding:1.05rem 1.15rem}
.cp-nombre{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:2.1rem;line-height:1;margin:0}
.cp-meta{color:var(--crema-2);font-size:.9rem;margin:.4rem 0 0}
.cp-der{display:flex;flex-direction:column;align-items:flex-end;gap:.45rem;padding-top:.3rem}
.cp-meses{display:grid;gap:.7rem;padding:0 .8rem .8rem}
.cp-meses .grupo{margin-bottom:0;background:#0A0A0B}
.cp-meses .g-cliente{font-size:1.45rem}
@media (max-width:720px){.cp-der{align-items:flex-start;padding-top:0}.cp-meses{padding:0 .5rem .5rem}}
.g-cab{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:.85rem 1.5rem;padding:1rem 1.1rem .95rem}
.g-cliente{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:1.75rem;line-height:1;margin:0}
.g-plegar{display:inline-flex;align-items:center;gap:.55rem;background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;text-align:left;cursor:pointer}
.g-plegar:hover{color:var(--verde)}
.g-flecha{flex:none;width:.42em;height:.42em;border-right:3px solid currentColor;border-bottom:3px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin:0 .1em}
.g-plegar[aria-expanded="true"] .g-flecha{transform:rotate(45deg) translate(-2px,-2px)}
.g-mes{color:var(--crema-2);font-weight:600;margin:.3rem 0 0;font-size:.95rem}
.g-resumen{color:var(--crema-3);font-weight:500}
@media (prefers-reduced-motion:reduce){.g-flecha{transition:none}}
.g-datos{display:flex;flex-wrap:wrap;gap:.35rem 1.4rem;font-size:.86rem;color:var(--crema-2);margin-top:.6rem}
.g-datos b{color:var(--crema);font-weight:600}
/* Fecha límite: la fecha en amarillo y lo que falta en verde; si ya venció, todo en rojo */
.limite b{color:var(--amarillo)}
.limite .faltan{font-style:normal;font-weight:700;color:var(--verde)}
.plazo-vencido,.plazo-vencido b,.plazo-vencido .faltan{color:var(--rojo)}
.g-der{display:flex;flex-direction:column;align-items:flex-end;gap:.45rem;padding-top:.35rem}
.g-der .tira{width:100%}
.g-acc{grid-column:1/-1;display:flex;gap:.4rem;flex-wrap:wrap}
.filas{border-top:1px solid var(--linea)}
.fila{display:grid;grid-template-columns:2.6rem minmax(0,1fr) auto;align-items:center;gap:.4rem .9rem;padding:.6rem 1.1rem;border-top:1px solid var(--linea)}
.fila:first-child{border-top:0}
.filas .fila:hover{background:var(--panel-2)}
.f-num{font-family:var(--display);font-size:1.35rem;color:var(--crema-3);line-height:1}
.f-cuerpo{min-width:0}
.f-titulo{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-meta{font-size:.8rem;color:var(--crema-3);display:flex;gap:.3rem .9rem;flex-wrap:wrap;margin-top:.1rem}
.f-der{display:grid;grid-template-columns:7.6rem 5.4rem minmax(10rem,auto);align-items:center;gap:.6rem}
.f-ver{background:none;border:0;padding:0;color:var(--verde);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.f-guion{grid-column:1/-1;padding:.2rem 0 .4rem}
.f-guion p{margin:0 0 .5rem}
.f-cambios{margin-top:.35rem;font-size:.84rem;color:var(--crema);background:rgba(240,112,90,.1);border-left:3px solid var(--rojo);padding:.35rem .6rem;border-radius:0 var(--r1) var(--r1) 0;overflow-wrap:anywhere}
.f-cambios b{color:var(--rojo)}
/* Tablero del editor */
.tablero{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0 0 1.6rem}
/* Cada cajita lleva una foto tenue y oscurecida para no distraer */
.t-dato,.t-prox{position:relative;isolation:isolate;overflow:hidden;min-height:112px;background:#0B0B0C;border:1px solid var(--linea);border-radius:12px;padding:.95rem 1.05rem;display:grid;gap:.35rem;align-content:end}
.t-dato::before,.t-prox::before{content:"";position:absolute;inset:0;z-index:-2;background:var(--foto,none) center 35%/cover;filter:grayscale(.3) brightness(.7);opacity:.8;transition:transform .5s ease}
.t-dato::after,.t-prox::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(8,8,9,.97) 22%,rgba(8,8,9,.6) 70%,rgba(8,8,9,.4)),linear-gradient(to right,rgba(8,8,9,.55),transparent 70%)}
.t-dato:hover::before,.t-prox:hover::before{transform:scale(1.05)}
.t-dato b{font-family:var(--display);font-weight:400;font-size:2.7rem;line-height:.9;color:var(--verde);text-shadow:0 2px 14px rgba(0,0,0,.6)}
.t-dato b.cero{color:var(--crema-3)}
.t-dato span,.t-prox span{font-size:.82rem;color:var(--crema-2);font-weight:600}
.t-dato.t-alerta{border-color:rgba(240,112,90,.55)}
.t-dato.t-alerta b{color:var(--rojo)}
.t-prox{grid-column:span 2;border-color:rgba(255,210,63,.45)}
.t-prox .t-fecha{font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1;text-transform:uppercase;color:var(--amarillo)}
.t-prox .t-faltan{font-size:1.1rem;font-weight:700;color:var(--verde)}
.t-prox small{color:var(--crema-3);font-size:.8rem}
.t-prox.n-vencido{border-color:var(--rojo)}
.t-prox.n-vencido .t-fecha,.t-prox.n-vencido .t-faltan{color:var(--rojo)}
[data-foto="set"]{--foto:url(img/set.webp)}
@media (prefers-reduced-motion:reduce){.t-dato::before,.t-prox::before{transition:none}.t-dato:hover::before,.t-prox:hover::before{transform:none}}
@media (max-width:560px){.t-prox{grid-column:1/-1}}
.clip.solo-ver{cursor:default}
.f-der .estado{justify-self:start}
.f-der.solo{display:flex}
.f-editor{font-size:.82rem;color:var(--crema-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-acc{display:flex;gap:.35rem;justify-content:flex-end}
.g-pie{padding:.45rem 1.1rem;border-top:1px solid var(--linea)}
@media (max-width:720px){
  .fila{grid-template-columns:2.2rem minmax(0,1fr)}
  .f-der{grid-column:2;display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .7rem}
  .f-acc{margin-left:auto}
  .g-cab{grid-template-columns:1fr}
  .g-der{align-items:flex-start;padding-top:0}
}

/* Vista del cliente: el mes como hoja de contactos de reels, con foto por estado */
/* Fotos: Unsplash (licencia libre). sin-guion: Feodor Chistyakov · guion: Gabriel Weyand ·
   grabado: Darko Sokoleski · edicion: Jakob Owens · entregado: Javier Esteban · set: Joshua Wann */
[data-foto="sin_guion"]{--foto:url(img/sin-guion.webp);--filtro:grayscale(1) brightness(.62)}
[data-foto="guion"]{--foto:url(img/guion.webp);--filtro:grayscale(.5) brightness(.8)}
[data-foto="grabado"]{--foto:url(img/grabado.webp);--filtro:saturate(.75) brightness(.85)}
[data-foto="produccion"]{--foto:url(img/edicion.webp);--filtro:saturate(.8) brightness(.8)}
[data-foto="entregado"]{--foto:url(img/entregado.webp);--filtro:saturate(1.05)}
.mes-tabs{display:flex;gap:.35rem;margin-bottom:1.1rem;overflow-x:auto;padding-bottom:2px}
.mes-tabs button{border:1px solid var(--linea-2);background:none;border-radius:999px;padding:.35rem .9rem;color:var(--crema-2);font-weight:600;cursor:pointer;white-space:nowrap}
.mes-tabs button:hover{border-color:var(--crema-3);color:var(--crema)}
.mes-tabs button[aria-pressed="true"]{background:var(--verde);color:#000;border-color:var(--verde)}
.hero-cli{position:relative;isolation:isolate;overflow:hidden;min-height:clamp(290px,40vw,430px);display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(1.3rem,4vw,2.6rem);margin-bottom:1.5rem;border:1px solid var(--linea);border-radius:14px;background:#050505}
.hero-cli::before{content:"";position:absolute;inset:0;z-index:-2;background:url(img/set.webp) 60% 40%/cover;filter:saturate(.6)}
.hero-cli::after{content:"";position:absolute;inset:0;z-index:-1;background:
  linear-gradient(to top,#000 3%,rgba(0,0,0,.7) 38%,rgba(0,0,0,.2) 72%,rgba(0,0,0,.5)),
  linear-gradient(to right,rgba(0,0,0,.78),rgba(0,0,0,0) 62%),
  radial-gradient(120% 95% at 72% 32%,transparent 40%,rgba(0,0,0,.72))}
.cli-empresa{margin:0 0 .6rem;color:var(--verde);font-weight:700;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase}
.mes-grande{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(3.2rem,11vw,7.5rem);line-height:.86;margin:0;letter-spacing:.005em;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.mes-info{display:flex;flex-wrap:wrap;gap:.8rem 2.6rem;margin:1.3rem 0 0;color:var(--crema-2);font-size:.95rem}
.mes-info b{display:block;color:var(--crema);font-size:1.2rem;font-weight:600}
.mes-info .clave b{color:var(--verde)}
.hero-cta{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.1rem;margin-top:1.5rem}
.hero-cta .nota{color:var(--crema-2);font-size:.88rem}
.avance-cli{display:flex;align-items:center;gap:.8rem 1.4rem;flex-wrap:wrap;margin:0 0 1.4rem}
.avance-num{font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,6vw,3.6rem);line-height:.85;color:var(--verde);white-space:nowrap}
.avance-num small{font-size:.45em;color:var(--crema-3);margin-left:.08em}
.avance-txt{flex:1 1 240px;display:grid;gap:.55rem;color:var(--crema-2)}
.avance-txt .tira{max-width:520px;height:10px}
.hoja{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:980px){.hoja{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.hoja{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}}
.cuadro{position:relative;isolation:isolate;aspect-ratio:9/16;background:#070707;border:1px solid var(--linea);border-radius:10px;padding:.7rem .65rem 1rem;display:flex;flex-direction:column;align-items:flex-start;gap:.45rem;text-align:left;cursor:pointer;overflow:hidden;color:var(--crema);transition:border-color .2s,box-shadow .2s,transform .2s}
.cuadro::before{content:"";position:absolute;inset:0;z-index:-1;background:
  linear-gradient(to top,rgba(0,0,0,.96) 6%,rgba(0,0,0,.6) 36%,rgba(0,0,0,.06) 62%,rgba(0,0,0,.5)),
  radial-gradient(130% 95% at 50% 42%,transparent 45%,rgba(0,0,0,.78)),
  var(--foto,none) center/cover;
  filter:var(--filtro,none);transition:transform .5s ease,filter .5s ease}
.cuadro:hover{border-color:var(--crema-3);transform:translateY(-2px)}
.cuadro:hover::before{transform:scale(1.06)}
.c-num{font-family:var(--display);font-size:clamp(1.7rem,4vw,2.6rem);line-height:.9;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.c-pie{margin-top:auto;display:grid;gap:.35rem;width:100%}
.c-tit{font-weight:600;font-size:.86rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;-webkit-hyphens:auto;hyphens:auto;text-shadow:0 1px 8px rgba(0,0,0,.85)}
.c-accion{font-size:.74rem;font-weight:700;color:var(--crema-2)}
.s-sin_guion .c-accion,.s-entregado .c-accion{color:var(--verde)}
.cuadro .estado{font-size:.66rem;height:auto;min-height:1.3rem;padding:.2rem .45rem;max-width:100%;white-space:normal;line-height:1.15}
.cuadro .e-sin_guion,.cuadro .e-guion{background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.cuadro .e-sin_guion{color:var(--crema);border-color:var(--crema-2)}
.cuadro::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--linea-2)}
.cuadro.s-guion::after{background:rgba(242,239,233,.45)}
.cuadro.s-grabado::after{background:var(--crema)}
.cuadro.s-produccion::after{background:var(--dorado)}

.rep-datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1rem}

.rep-caja{background:#0A0A0B;border:1px solid var(--linea);border-radius:10px;padding:1rem 1.1rem}

/* Pestañas del cliente: Mis videos / Resultados */
.cli-tabs{display:inline-flex;gap:4px;padding:4px;margin:0 0 1.2rem;border:1px solid var(--linea);border-radius:999px;background:var(--panel);max-width:100%;overflow-x:auto;scrollbar-width:none}

.aviso-vista{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;border:1px solid var(--dorado);color:var(--dorado);border-radius:var(--r2);padding:.6rem .9rem;margin-bottom:1.6rem;font-weight:600}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESES_C = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS_C = ['dom','lun','mar','mié','jue','vie','sáb'];
const DIAS_L = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const aFecha = s => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const aISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoy = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const sumarDias = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const diasEntre = (a, b) => Math.round((b - a) / 86400000);
const primerDia = d => new Date(d.getFullYear(), d.getMonth(), 1);
const fCorta = s => { const d = aFecha(s); return `${d.getDate()} ${MESES_C[d.getMonth()]}`; };
const fDia = s => { const d = aFecha(s); return `${DIAS_C[d.getDay()]} ${d.getDate()} ${MESES_C[d.getMonth()]}`; };
const fLarga = s => { const d = aFecha(s); return `${d.getDate()} de ${MESES[d.getMonth()]}`; };
const nombreMes = d => `${MESES[d.getMonth()][0].toUpperCase()}${MESES[d.getMonth()].slice(1)} ${d.getFullYear()}`;
function rango(a, b) {
  if (a === b) return fCorta(a);
  const x = aFecha(a), y = aFecha(b);
  if (x.getMonth() === y.getMonth() && x.getFullYear() === y.getFullYear()) return `${x.getDate()}–${y.getDate()} ${MESES_C[y.getMonth()]}`;
  return `${fCorta(a)} – ${fCorta(b)}`;
}
// Días de grabación: el primero y el último del ciclo. Son días sueltos, no un rango
// (pueden no ser seguidos): "el 18 y el 20 de octubre", nunca "del 18 al 20".
function diasGrab(a, b, largo) {
  if (!b || a === b) return largo ? `el ${fLarga(a)}` : fCorta(a);
  const x = aFecha(a), y = aFecha(b), mismoMes = x.getMonth() === y.getMonth();
  if (largo) return mismoMes ? `el ${x.getDate()} y el ${y.getDate()} de ${MESES[y.getMonth()]}` : `el ${fLarga(a)} y el ${fLarga(b)}`;
  return mismoMes ? `${x.getDate()} y ${y.getDate()} ${MESES_C[y.getMonth()]}` : `${fCorta(a)} y ${fCorta(b)}`;
}
// Tu regla: si grabas del 1 al 15, entregas el 1 del mes siguiente; si grabas del 16 en adelante, el 15.
function sugerirEntrega(inicioISO) {
  const d = aFecha(inicioISO);
  return d.getDate() <= 15 ? new Date(d.getFullYear(), d.getMonth() + 1, 1) : new Date(d.getFullYear(), d.getMonth() + 1, 15);
}
function plazo(iso) {
  const n = diasEntre(hoy(), aFecha(iso));
  if (n < 0) return { txt: `vencido hace ${-n} ${n === -1 ? 'día' : 'días'}`, nivel: 'vencido' };
  if (n === 0) return { txt: 'vence hoy', nivel: 'urgente' };
  if (n === 1) return { txt: 'vence mañana', nivel: 'urgente' };
  return { txt: `faltan ${n} días`, nivel: n <= 3 ? 'urgente' : 'ok' };
}

const ESTADOS = { sin_guion: 'Falta guion', guion: 'Guion listo', grabado: 'Grabado', edicion: 'En edición', revision: 'En revisión', listo: 'Aprobado', entregado: 'Entregado' };

  if (/sin_ajustes/.test(m)) return 'Escribe al menos un ajuste.';
  if (/fechas_grabacion/.test(m)) return 'La grabación no puede terminar antes de empezar.';
  if (/fechas_entrega/.test(m)) return 'La entrega no puede ser antes de que termine la grabación.';
  if (/fecha_editor/.test(m)) return 'La fecha límite del editor tiene que quedar entre la grabación y la entrega.';
  if (/_url_check/.test(m)) return 'Los links tienen que empezar con https://';
  if (/script_text_check/.test(m)) return 'El guion es demasiado largo; mejor compártelo como link.';
  if (/team_notes_check/.test(m)) return 'Las notas son demasiado largas.';
  if (/change_request_check/.test(m)) return 'El comentario de cambios es demasiado largo (máximo 2,000 caracteres).';
  if (/videos_per_cycle_check/.test(m)) return 'El número de videos por mes tiene que estar entre 1 y 40.';
  if (/reportes_periodo/.test(m)) return 'El periodo del reporte no puede terminar antes de empezar.';
  if (/mejor_porque_check|ajustes_check/.test(m)) return 'El texto del reporte es demasiado largo.';
  if (/reportes_\w+_check/.test(m)) return 'Revisa los números del reporte: no pueden ser negativos.';
  if (/contact_email_check/.test(m)) return 'El correo de contacto no es válido.';
  if (/contact_phone_check/.test(m)) return 'El WhatsApp debe tener de 10 a 15 dígitos.';
  if (/contact_name_check/.test(m)) return 'El nombre de contacto es demasiado largo.';
  if (/facturas_limite/.test(m)) return 'Ya pediste varias facturas en la última hora. Si te falta alguna, escríbenos por WhatsApp.';
  if (/facturas_rfc_check|pago_datos_rfc_check/.test(m)) return 'Revisa el RFC: son 12 caracteres si es empresa o 13 si es persona física.';
  if (/facturas_cp_check/.test(m)) return 'El código postal fiscal tiene 5 dígitos.';
  if (/facturas_monto_check/.test(m)) return 'Revisa el monto del pago.';
  if (/pago_datos_clabe_check/.test(m)) return 'La CLABE tiene 18 dígitos.';
  if (/pago_datos_cuenta_check/.test(m)) return 'El número de cuenta solo lleva dígitos (de 6 a 20).';
  if (/ajustes_prestador_rfc_check/.test(m)) return 'Revisa tu RFC: 13 caracteres (persona física).';
  if (/ajustes_prestador_domicilio_check/.test(m)) return 'Escribe tu domicilio completo.';
  if (/ajustes_\w+_check/.test(m)) return 'Revisa los datos del contrato.';
  if (/clients_mensualidad_check/.test(m)) return 'Revisa la mensualidad: solo números.';
  if (/acceso_propio/.test(m)) return 'No puedes borrarte a ti mismo.';
  if (/acceso_admin/.test(m)) return 'Primero cámbialo de Administrador a otro rol y después bórralo.';
  if (/propuestas_precio_check|propuestas_anticipo_check/.test(m)) return 'Revisa el precio y el anticipo: tienen que ser mayores a cero.';
  if (/propuestas_whatsapp_check/.test(m)) return 'El WhatsApp debe tener de 10 a 15 dígitos.';
  if (/propuestas_correo_check/.test(m)) return 'El correo no es válido.';
  if (/propuestas_(nombre|empresa|titulo)_check/.test(m)) return 'Faltan el nombre, la empresa o el título de la propuesta.';
  if (/propuestas_\w+_check/.test(m)) return 'Algún texto de la propuesta es demasiado largo.';
  if (/name_check/.test(m)) return 'Escribe un nombre.';
  if (/duplicate key|_number_key/.test(m)) return 'Ya existe un video con ese número en este mes.';
  if (/JWT|jwt expired|invalid claim/i.test(m)) return 'Tu sesión expiró. Sal y vuelve a entrar.';
  if (/Could not find the (function|table)|schema cache|does not exist/i.test(m) && /postula|factura|pago|propuesta/i.test(m)) return 'Falta preparar la base de datos: corre trabajo-y-pagos.sql en Supabase (SQL Editor).';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'No hay conexión con la base de datos. Revisa tu internet. Si eres el administrador, revisa que el proyecto de Supabase no esté en pausa.';
  return m || 'Algo falló. Intenta de nuevo.';
}

let timerAviso;
function aviso(msg, error) {
  const el = document.getElementById('aviso');
  el.textContent = msg;
  el.className = 'aviso' + (error ? ' error' : '');
  el.hidden = false;
  clearTimeout(timerAviso);
  timerAviso = setTimeout(() => { el.hidden = true; }, error ? 7000 : 2600);
}

// ---------- Datos ----------------------------------------------------
async function q(peticion) { const { data, error } = await peticion; if (error) throw error; return data; }

async function cargarEquipo() {
  const desde = aISO(sumarDias(hoy(), -150));
  const [clientes, ciclos, perfiles, videos, asignaciones] = await Promise.all([
    q(sb.from('clients').select('*').order('name')),
    q(sb.from('cycles').select('*').order('delivery_date')),
    q(sb.from('profiles').select('id,email,full_name,role,client_id,created_at').order('created_at')),
    q(sb.from('videos').select('*, cycles!inner(delivery_date)').gte('cycles.delivery_date', desde).order('number')),
    q(sb.from('editor_clients').select('editor_id,client_id'))
  ]);
  S.clientes = clientes || [];
  S.ciclos = ciclos || [];
  S.perfiles = perfiles || [];
  S.asignaciones = asignaciones || [];
  S.videos = (videos || []).map(v => { const x = Object.assign({}, v); delete x.cycles; return x; });
  const est = await sb.from('estilos').select('*');
  S.estilos = est.error ? [] : est.data || [];
  if (S.perfil.role === 'admin') {
    try { S.solicitudes = await q(sb.from('solicitudes').select('*').order('created_at', { ascending: false }).limit(300)) || []; }
    catch (e) { S.solicitudes = []; }
    try { S.reportes = await q(sb.from('reportes').select('*')) || []; }
    catch (e) { S.reportes = []; }
    // Postulaciones y pagos: si aún no se corre trabajo-y-pagos.sql, el portal sigue funcionando
    const [post, facs, datos, props] = await Promise.all([
      sb.from('postulaciones').select('*').order('created_at', { ascending: false }).limit(500),
      sb.from('facturas').select('*').order('created_at', { ascending: false }).limit(300),
      sb.from('pago_datos').select('*').eq('id', 1).maybeSingle(),
      sb.from('propuestas').select('*').order('created_at', { ascending: false }).limit(300)
    ]);
    S.propuestas = props.error ? [] : props.data || [];
    const [aj, cts, ps, sm] = await Promise.all([
      sb.from('ajustes').select('*').eq('id', 1).maybeSingle(),
      sb.from('contratos').select('id,propuesta_id,client_id,razon_social,rfc,correo,whatsapp,correo_google,plataformas,firmado_por,firmado_at,firma_prestador_at,primer_ciclo').order('firmado_at', { ascending: false }).limit(300),
      sb.from('pagos_stripe').select('*').order('created_at', { ascending: false }).limit(100),
      sb.rpc('stripe_modo')
    ]);
    S.ajustes = aj.error ? null : aj.data;
    // Cotizador: si aún no se corre cotizador.sql, el portal sigue funcionando
    const [cc, cl] = await Promise.all([
      sb.from('cotizador_config').select('*').eq('id', 1).maybeSingle(),
      sb.from('cotizaciones').select('*').order('created_at', { ascending: false }).limit(300)
    ]);
    S.cot.falta = !!(cc.error || cl.error);
    S.cot.config = cc.error ? null : cc.data;
    S.cot.lista = cl.error ? [] : cl.data || [];
    const cob = await sb.from('cobros').select('*').order('vence');
    S.cobros = cob.error ? [] : cob.data || [];
    S.stripeModo = sm.error ? null : sm.data;
    S.contratos = cts.error ? [] : cts.data || [];
    S.pagosStripe = ps.error ? [] : ps.data || [];
    S.postulaciones = post.error ? [] : post.data || [];
    S.facturas = facs.error ? [] : facs.data || [];
    S.pagoDatos = datos.error ? null : datos.data;
    S.faltaBase = !!(post.error || facs.error || datos.error);
    try {
      await q(sb.rpc('mailerlite_revisar'));
      S.mlLog = await q(sb.from('mailerlite_sync_log').select('id,created_at,client_id,accion,origen,estado,mensaje,datos').order('id', { ascending: false }).limit(300)) || [];
    } catch (e) { S.mlLog = []; }
  }
  S.cargadoEn = Date.now();
}

async function cargarCliente() {
  const [portal, pagos] = await Promise.all([q(sb.rpc('client_portal')), sb.rpc('client_pagos')]);
  S.portal = portal;
  S.pagosCli = pagos.error ? null : pagos.data;
  S.cargadoEn = Date.now();
  elegirMesCliente(S.portal);
}

function elegirMesCliente(P) {
  const ciclos = (P && P.cycles) || [];
  if (ciclos.some(c => c.id === S.cicloCliente)) return;
  const h = aISO(hoy());
  const proximos = ciclos.filter(c => c.delivery_date >= h).sort((a, b) => a.delivery_date.localeCompare(b.delivery_date));
  S.cicloCliente = (proximos[0] || ciclos[0] || {}).id || null;
}

async function recargar(sinPintar) {
  try {
    if (S.perfil.role === 'cliente') await cargarCliente(); else await cargarEquipo();
    if (!sinPintar) render();
  } catch (e) { aviso(humano(e), true); }
}

// ---------- Barra superior ------------------------------------------
// Lo que espera al admin, por vista; las pestañas de arriba suman las de su grupo
function cuentas() {
  if (S.perfil.role !== 'admin') return {};
  return {
    solicitudes: S.solicitudes.filter(x => !x.atendida).length,
    propuestas: S.propuestas.filter(x => x.aceptada_at && !x.client_id).length + S.contratos.filter(c => !c.firma_prestador_at && S.propuestas.some(pr => pr.id === c.propuesta_id)).length,
    accesos: S.perfiles.filter(x => x.role === 'pendiente').length,
    postulaciones: S.postulaciones.filter(x => x.estado === 'nueva').length,
    pagos: S.facturas.filter(x => x.estado === 'pendiente').length
  };
}
const TXT_CUENTA = { solicitudes: 'solicitudes sin atender', propuestas: 'contratos por firmar o aceptadas sin dar de alta', accesos: 'accesos pendientes', postulaciones: 'postulaciones por revisar', pagos: 'facturas por emitir' };

function barra() {
  const p = S.perfil, esAdmin = p.role === 'admin';
  const tabs = esAdmin ? PESTANAS : p.role === 'editor' ? [['produccion', 'Producción']] : [];
  const n = cuentas(), errML = esAdmin ? mlConError().length : 0;
  const punto = id => {
    if (id === 'clientes' && errML) return `<span class="punto punto-error" aria-label="${errML} con error de MailerLite">!</span>`;
    const partes = (GRUPOS[id] ? GRUPOS[id].map(([v]) => v) : [id]).filter(v => n[v]);
    const total = partes.reduce((t, v) => t + n[v], 0);
    return total ? `<span class="punto" aria-label="${esc(partes.map(v => `${n[v]} ${TXT_CUENTA[v]}`).join(', '))}">${total}</span>` : '';
  };
  const actual = S.vista === 'previa' ? 'clientes' : grupoDe(S.vista) || S.vista;
  return `<header class="barra"><div class="barra-in">
    <div class="marca"><b>Connect Studios</b><span>Portal</span></div>
    ${tabs.length ? `<nav class="nav" aria-label="Secciones">${tabs.map(([id, txt]) => `<button data-accion="ir" data-id="${S.subVista[id] || (GRUPOS[id] ? GRUPOS[id][0][0] : id)}"${actual === id ? ' aria-current="page"' : ''}>${txt}${punto(id)}</button>`).join('')}</nav>` : ''}
    <div class="quien">
      <span class="quien-txt"><strong>${esc(nombreDe(p))}</strong><small>${esc(p.role === 'cliente' && S.portal && S.portal.client ? S.portal.client.name : ROL[p.role])}</small></span>
      ${p.role !== 'cliente' ? '<button class="btn btn-s btn-t" data-accion="actualizar">Actualizar</button>' : ''}
      <button class="btn btn-s" data-accion="salir">Salir</button>

// ---------- Fechas: agenda de Inicio, historial y portal del cliente ----------
const pl = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
const horaDe = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
// Fechas de un mes, sin texto: cada quien las nombra a su manera
function fechasCiclo(c, vs) {
  const ev = [];
  if (c.script_due) ev.push({ f: c.script_due, tipo: 'guion', k: 'guiones' });
  [...new Set([c.record_start, c.record_end].filter(Boolean))].forEach(f => ev.push({ f, tipo: 'grab', k: 'grabacion' }));
  if (c.editor_due) ev.push({ f: c.editor_due, tipo: 'edit', k: 'edicion' });
  if (c.delivery_date) ev.push({ f: c.delivery_date, tipo: 'entrega', k: 'entrega' });
  if (c.revision_hasta && c.revision_estado === 'revision') ev.push({ f: c.revision_hasta, tipo: 'rev', k: 'revision' });
  const pub = agrupar((vs || []).filter(v => v.programado_at).map(v => Object.assign({}, v, { dia: aISO(new Date(v.programado_at)) })), 'dia');
  Object.keys(pub).forEach(f => ev.push({ f, tipo: 'publica', k: 'publica', vs: pub[f].sort((a, b) => a.programado_at.localeCompare(b.programado_at)) }));
  return ev;
}
const TXT_FECHA_CLIENTE = { guiones: 'Último día para mandar tus guiones', grabacion: 'Grabamos', entrega: 'Recibes tus videos', revision: 'Último día para pedir ajustes' };
const TXT_FECHA = { guiones: 'Fecha límite de guiones', grabacion: 'Grabación', edicion: 'Vence la edición', entrega: 'Entrega', revision: 'Último día para pedir ajustes' };
const txtPublica = e => { const ya = e.f < hoyISO();
  return e.vs.length === 1 ? `${ya ? 'Se publicó' : 'Se publica'} “${e.vs[0].title || 'Video ' + e.vs[0].number}”` : `${ya ? 'Se publicaron' : 'Se publican'} ${e.vs.length} videos`; };
function diaTxt(f) {
  const n = diasEntre(hoy(), aFecha(f));
  if (n === 0) return 'Hoy';
  if (n === 1) return 'Mañana';
  if (n === -1) return 'Ayer';
  return fDia(f) + (aFecha(f).getFullYear() !== hoy().getFullYear() ? ` ${aFecha(f).getFullYear()}` : '');
}
// Lista de fechas agrupada por día; las pasadas se ven apagadas
function htmlAgenda(ev, desc) {

// ---------- Inicio (admin): lo que espera, el dinero del mes y lo que viene ----------
const anticipoDe = x => x.anticipo != null ? Number(x.anticipo) : Math.round(x.precio * 50) / 100;
const conIva = (x, m) => x.iva === 'mas_iva' ? Math.round(m * 116) / 100 : Number(m);
const enMes = (ts, mes) => !!ts && aISO(new Date(ts)).slice(0, 7) === mes;

function cobradoVentas(mes) {

function porHacer() {
  const h = hoyISO(), n = cuentas(), cob = cuentasCobranza(), xs = [];
  const add = (num, txt, ir, malo) => { if (num) xs.push({ num, txt, ir, malo }); };

  add(cob.tocan.length, cob.tocan.length === 1 ? 'mensualidad toca cobrar' : 'mensualidades tocan cobrar', 'pagos');

  const atrasados = S.ciclos.filter(c => c.script_due && c.script_due < h && c.record_start >= h)
    .reduce((t, c) => t + S.videos.filter(v => v.cycle_id === c.id && v.status === 'sin_guion').length, 0);
  add(atrasados, atrasados === 1 ? 'guion atrasado (ya pasó su fecha límite)' : 'guiones atrasados (ya pasó su fecha límite)', 'produccion');
  const firmar = S.contratos.filter(c => !c.firma_prestador_at && S.propuestas.some(pr => pr.id === c.propuesta_id)).length;
  add(firmar, firmar === 1 ? 'contrato espera tu firma' : 'contratos esperan tu firma', 'propuestas');
  const sinAlta = S.propuestas.filter(x => x.aceptada_at && !x.client_id).length;
  add(sinAlta, sinAlta === 1 ? 'propuesta aceptada sin dar de alta' : 'propuestas aceptadas sin dar de alta', 'propuestas');
  const sinAnticipo = S.propuestas.filter(x => x.aceptada_at && !x.pagada_at).length;
  add(sinAnticipo, sinAnticipo === 1 ? 'anticipo pendiente' : 'anticipos pendientes', 'propuestas');
  // Seguimiento: enviadas hace más de 3 días, vigentes y sin respuesta
  const sinResp = S.propuestas.filter(x => { const e = estadoPropuesta(x).clave; return ['enviada', 'vista'].includes(e) && x.enviada_at && diasEntre(aFecha(aISO(new Date(x.enviada_at))), hoy()) > 3; }).length;
  add(sinResp, sinResp === 1 ? 'propuesta sin respuesta hace más de 3 días: dale seguimiento' : 'propuestas sin respuesta hace más de 3 días: dales seguimiento', 'propuestas');
  add(n.solicitudes, n.solicitudes === 1 ? 'solicitud sin atender' : 'solicitudes sin atender', 'solicitudes');
  add(n.pagos, n.pagos === 1 ? 'factura por emitir' : 'facturas por emitir', 'pagos');

  add(n.postulaciones, n.postulaciones === 1 ? 'postulación por revisar' : 'postulaciones por revisar', 'postulaciones');
  return xs;
}

// ---------- Métricas de ventas ----------------------------------------------
const PERIODOS = { 30: 'Últimos 30 días', 90: 'Últimos 90 días', anio: 'Este año', todo: 'Todo' };
const esPrueba = x => !!x && (x.origen || {}).utm_source === 'prueba';
// Barras de un embudo o un conteo: el % es contra el paso anterior (embudo) o contra el total
function barras(filas, embudo) {
  const max = Math.max(1, ...filas.map(f => f[1]));
  return `<div class="emb">${filas.map(([txt, n], i) => {
    const base = embudo ? (i ? filas[i - 1][1] : 0) : filas.reduce((t, f) => t + f[1], 0);
    const pct = base ? Math.round(n / base * 100) : null;
    return `<div class="emb-fila" title="${esc(`${txt}: ${n}${pct !== null ? ` (${pct}%${embudo ? ' del paso anterior' : ' del total'})` : ''}`)}"><span>${esc(txt)}</span>
      <div class="emb-barra"><i style="width:${n / max * 100}%"></i></div>
      <span class="emb-num"><b>${n}</b>${pct !== null ? `<small>${pct}%</small>` : ''}</span></div>`;
  }).join('')}</div>`;
}
function vistaMetricas() {
  const per = S.metPeriodo || '90';

  const enviadas = props.filter(x => x.enviada_at), aceptadas = props.filter(x => x.aceptada_at);

  const dias = aceptadas.map(x => { const s = solDe(x); return (new Date(x.aceptada_at) - new Date((s || x).created_at)) / 86400000; });
  const promDias = dias.length ? Math.round(dias.reduce((t, d) => t + d, 0) / dias.length) : null;

  const vacio = '<p class="rep-txt">Aún no hay suficientes datos en este periodo.</p>';

    <div><h1>Métricas</h1><p class="sub">Cuántos prospectos llegan, cuántos cierran y de dónde vienen los que sí compran. No cuenta las descargas de la guía ni las pruebas.</p></div>
    <div class="controles"><select class="campo-in" data-cambio="met-periodo" aria-label="Periodo">${Object.entries(PERIODOS).map(([v, t]) => opt(v, t)).join('')}</select></div>

  <section class="rep">

      <div class="rep-dato"><b>${promDias !== null ? promDias : '—'}</b><span>Días promedio de la solicitud al sí</span></div>
      <div class="rep-dato dinero"><b>${esc(dinero(suma(aceptadas)) || '$0.00')}</b><span>Cerrado, de ${esc(dinero(suma(enviadas)) || '$0.00')} propuesto</span></div>
      <div class="rep-dato dinero"><b>${aceptadas.length ? esc(dinero(Math.round(suma(aceptadas) / aceptadas.length))) : '—'}</b><span>Ticket promedio (mensualidad o proyecto)</span></div>
    </div>
  </section>
  <div class="ini-grid">
    <section class="rep">
      <div class="rep-cab"><h2>Tus <span>prospectos</span></h2></div>

function historialCliente(id) {

  const dia = (f, tipo, txt) => { if (f) ev.push({ f, tipo, txt }); };

  const sols = S.solicitudes.filter(x => props.some(p => p.solicitud_id === x.id) || (correo && String(x.correo || '').toLowerCase() === correo));
  sols.forEach(x => {
    const f = fuenteDe(x);
    ts(x.created_at, 'venta', `${x.tipo === 'guia' ? 'Descargó la guía' : 'Llegó su solicitud'}${f ? ` (${f})` : ''}`);
    if (x.cita) ts(x.cita, 'llamada', 'Llamada de venta');

  props.forEach(x => {

    ts(x.aceptada_at, 'entrega', `Aceptó la propuesta${x.aceptada_por ? ` (${x.aceptada_por})` : ''}`);
    ts(x.pagada_at, 'cobro', pagoTotalDe(x) ? 'Pagó todo de una vez' : `Pagó el anticipo${x.pago_metodo ? ` ${x.pago_metodo === 'tarjeta' ? 'con tarjeta' : 'por transferencia'}` : ''}`);
    if (!pagoTotalDe(x)) ts(x.liquidada_at, 'cobro', 'Pagó el resto del proyecto');
  });
  S.contratos.filter(c => c.client_id === id || props.some(p => p.id === c.propuesta_id)).forEach(c => {
    ts(c.firmado_at, 'venta', `Firmó el contrato${c.firmado_por ? ` (${c.firmado_por})` : ''}`);
    ts(c.firma_prestador_at, 'venta', 'Firmaste el contrato');
  });
  ts(cl.created_at, 'entrega', 'Lo diste de alta como cliente');
  S.ciclos.filter(c => c.client_id === id).forEach(c => {
    fechasCiclo(c, S.videos.filter(v => v.cycle_id === c.id)).forEach(e => dia(e.f, e.tipo, `${c.name}: ${e.k === 'publica' ? txtPublica(e).replace(/^Se p/, 'se p') : TXT_FECHA[e.k].toLowerCase()}`));
    ts(c.entregado_at, 'entrega', `${c.name}: le entregaste los videos`);
    ts(c.ajustes_at, 'rev', `${c.name}: pidió ajustes`);
    ts(c.aprobado_at, 'entrega', `${c.name}: ${c.aprobado_por === 'tiempo' ? 'se aprobó solo (no pidió ajustes)' : 'aprobó los videos'}`);
    const r = S.reportes.find(x => x.cycle_id === c.id && x.publicado);
    if (r) ts(r.updated_at, 'venta', `${c.name}: publicaste su reporte`);
  });
  (S.cobros || []).filter(x => x.client_id === id).forEach(x => {
    const cy = S.ciclos.find(c => c.id === x.cycle_id), de = `mensualidad${cy ? ` de ${cy.name}` : ''}`;
    if (x.estado === 'pagado') ts(x.pagado_at, 'cobro', `Pagó la ${de}${x.monto ? ` (${dinero(x.monto)})` : ''}`);
    else if (x.estado === 'pendiente') dia(x.vence, 'cobro', `${estadoCobro(x).clave === 'vencido' ? 'Venció' : 'Toca pagar'} la ${de}${x.monto ? ` (${dinero(x.monto)})` : ''}`);
  });
  S.facturas.filter(x => x.client_id === id).forEach(x => {
    ts(x.created_at, 'cobro', `Pidió factura: ${x.concepto}`);
    if (x.estado === 'emitida') ts(x.emitida_at, 'cobro', `Emitiste la factura: ${x.concepto}`);
  });
  // Lo que tiene hora ya pasó si su hora pasó; lo que solo tiene día, desde hoy cuenta como "lo que viene"
  const ahora = new Date(), h = hoyISO();
  return { viene: ev.filter(e => e.t ? e.t > ahora : e.f >= h), paso: ev.filter(e => e.t ? e.t <= ahora : e.f < h) };
}
function modalHistorial(id) {
  const cl = clientePorId(id); if (!cl) return;
  const { viene, paso } = historialCliente(id);
  abrirModal(`<div class="d-cab"><div><h2 class="d-titulo">Historial de ${esc(cl.name)}</h2>
      <p class="d-sub">${cl.active ? 'Cliente activo' : 'En pausa'}${cl.mensualidad ? ` · ${esc(dinero(cl.mensualidad))} al mes` : ''} · ${pl(cl.videos_per_cycle, 'video', 'videos')} por mes</p></div></div>
    ${viene.length ? `<h3 class="hist-tit">Lo que viene</h3>${htmlAgenda(viene)}` : ''}
    <h3 class="hist-tit">Lo que pasó</h3>
    ${paso.length ? htmlAgenda(paso, true) : '<p class="nota">Todavía no hay nada.</p>'}
    <div class="d-pie"><button type="button" class="btn" data-accion="cerrar">Cerrar</button></div>`);
}

// ---------- Producción (admin y editores) ---------------------------
function gruposProduccion() {
  const f = S.filtro, yo = S.perfil.id;
  const porCiclo = agrupar(S.videos, 'cycle_id');
  return S.ciclos
    .filter(c => porCiclo[c.id] && (f.cliente === 'todos' || c.client_id === f.cliente))
    .map(c => {
      const todos = porCiclo[c.id].slice().sort((a, b) => a.number - b.number);
      let visibles = todos;
      if (f.estado !== 'todos') visibles = visibles.filter(v => v.status === f.estado);
      if (f.mios) visibles = visibles.filter(v => v.editor_id === yo);
      if (S.perfil.role === 'editor' && !f.entregados && f.estado === 'todos') visibles = visibles.filter(v => v.status !== 'listo' && v.status !== 'entregado');
      return { c, cli: clientePorId(c.client_id), todos, visibles, entregado: todos.every(v => v.status === 'entregado') };
    })
    .filter(g => (f.entregados || !g.entregado) && g.visibles.length)
    .sort((a, b) => (a.entregado - b.entregado) || a.c.editor_due.localeCompare(b.c.editor_due));
}

function nivelGrupo(g) {
  if (g.todos.every(v => v.status === 'listo' || v.status === 'entregado')) return 'hecho';
  return plazo(g.c.editor_due).nivel;
}

// Resumen corto de estados para el mes plegado: "2 en revisión · 3 en edición · 7 grabados"
const RESUMEN = [['sin_guion', 'sin guion', 'sin guion'], ['guion', 'con guion', 'con guion'], ['grabado', 'grabado', 'grabados'],
  ['edicion', 'en edición', 'en edición'], ['revision', 'en revisión', 'en revisión'], ['listo', 'aprobado', 'aprobados'], ['entregado', 'entregado', 'entregados']];
const resumenEstados = vs => RESUMEN.map(([k, uno, varios]) => { const n = vs.filter(v => v.status === k).length; return n ? `${n} ${n === 1 ? uno : varios}` : ''; }).filter(Boolean).join(' · ');

function cabGrupo(g, abierto) {
  const { c, cli, todos } = g, esAdmin = S.perfil.role === 'admin', yo = S.perfil.id;

  const aprobados = cuenta(['listo']);
  const terminados = cuenta(['revision', 'listo', 'entregado']);
  const porEmpezar = todos.filter(v => v.status === 'grabado' && (!v.editor_id || v.editor_id === yo)).length;
  const sinGrabar = todos.filter(v => (v.status === 'sin_guion' || v.status === 'guion') && (!v.editor_id || v.editor_id === yo)).length;
  return `<div class="g-cab">
    <div class="g-info">
      <h3 class="g-cliente"><button class="g-plegar" data-accion="plegar" data-id="${c.id}" aria-expanded="${abierto}" aria-label="${esc((cli ? cli.name + ', ' : '') + c.name)}"><span class="g-flecha" aria-hidden="true"></span>${esc(c.name)}</button></h3>
      ${abierto ? '' : `<p class="g-mes"><span class="g-resumen">${esc(resumenEstados(todos))}</span></p>`}
      <div class="g-datos">
        <span>Grabación <b>${diasGrab(c.record_start, c.record_end)}</b></span>
        <span class="limite${nivel !== 'hecho' ? ' plazo-' + p.nivel : ''}">Límite de edición <b>${fDia(c.editor_due)}</b>${nivel !== 'hecho' ? ` <em class="faltan">${p.txt}</em>` : ''}</span>
        ${esAdmin ? `<span>Entrega al cliente <b>${fDia(c.delivery_date)}</b></span>` : ''}
        ${c.revision_estado ? `<span>Cliente: <b>${c.revision_estado === 'ajustes' ? 'pidió ajustes' : c.revision_estado === 'revision' && c.revision_hasta >= hoyISO() ? 'revisando' : 'aprobado'}</b></span>` : ''}
        ${esAdmin ? (c.raw_url ? enlace(c.raw_url, 'Crudos en Drive') : '<span class="nota">Sin carpeta de crudos</span>')
          : (c.raw_url ? '' : '<span class="nota">Crudos: aún sin carpeta</span>')}
        ${esAdmin ? (c.delivery_url ? enlace(c.delivery_url, 'Videos terminados en Drive') : '<span class="nota">Sin carpeta de videos</span>')
          : (c.delivery_url ? '' : '<span class="nota">Terminados: aún sin carpeta</span>')}
      </div>
    </div>
    <div class="g-der">
      <span class="nota">${terminados} de ${todos.length} terminados</span>
      ${tira(todos)}
    </div>
    ${esAdmin ? `<div class="g-acc">
      ${porGrabar ? `<button class="btn btn-s" data-accion="marcar-grabado" data-id="${c.id}">Marcar ${porGrabar} como grabados</button>` : ''}
      <button class="btn btn-s" data-accion="asignar-mes" data-id="${c.id}">Asignar editor</button>
      <button class="btn btn-s${c.delivery_url ? '' : ' btn-p'}" data-accion="carpetas-mes" data-id="${c.id}">${c.delivery_url ? 'Carpetas de Drive' : 'Asignar carpeta de Drive'}</button>
      ${enRevision ? `<button class="btn btn-s" data-accion="aprobar-ciclo" data-id="${c.id}">Aprobar ${enRevision} en revisión</button>` : ''}
      ${aprobados ? `<button class="btn btn-s btn-p" data-accion="entregar-ciclo" data-id="${c.id}">Entregar ${aprobados} al cliente</button>` : ''}
      <button class="btn btn-s btn-t" data-accion="editar-ciclo" data-id="${c.id}">Editar mes</button>
    </div>` : ((porEmpezar || sinGrabar || c.raw_url || c.delivery_url) ? `<div class="g-acc">
      ${porEmpezar ? `<button class="btn btn-s btn-p" data-accion="empezar-ciclo" data-id="${c.id}">Marcar todos en edición (${porEmpezar})</button>`
        : sinGrabar ? `<button class="btn btn-s" disabled>Marcar todos en edición</button><span class="nota">Se activa cuando Connect marque los videos como grabados.</span>` : ''}
      ${urlSegura(c.raw_url) ? `<a class="btn btn-s" href="${esc(urlSegura(c.raw_url))}" target="_blank" rel="noopener noreferrer">Abrir crudos</a>` : ''}
      ${urlSegura(c.delivery_url) ? `<a class="btn btn-s" href="${esc(urlSegura(c.delivery_url))}" target="_blank" rel="noopener noreferrer">Subir terminados</a>` : ''}
    </div>` : '')}
  </div>`;
}

// Tablero del editor: sus números y su próxima fecha límite
function tableroEditor() {
  const yo = S.perfil.id, mios = S.videos.filter(v => v.editor_id === yo);
  const cuenta = f => mios.filter(f).length;
  const porEmpezar = S.videos.filter(v => v.status === 'grabado' && (!v.editor_id || v.editor_id === yo)).length;
  const conCambios = cuenta(v => v.status === 'edicion' && v.change_request);
  const datos = [
    [porEmpezar, 'Por empezar', 'grabado'],
    [cuenta(v => v.status === 'edicion'), 'En edición', 'produccion'],
    [cuenta(v => v.status === 'revision'), 'En revisión', 'guion'],
    [cuenta(v => v.status === 'listo' || v.status === 'entregado'), 'Aprobados', 'entregado']
  ];
  const pendientes = S.ciclos
    .filter(c => S.videos.some(v => v.cycle_id === c.id && (v.status === 'grabado' || v.status === 'edicion') && (!v.editor_id || v.editor_id === yo)))
    .sort((a, b) => a.editor_due.localeCompare(b.editor_due));
  const prox = pendientes[0], p = prox && plazo(prox.editor_due), cl = prox && clientePorId(prox.client_id);
  return `<section class="tablero" aria-label="Tus pendientes">
    ${datos.map(([n, txt, foto]) => `<div class="t-dato" data-foto="${foto}"><b class="${n ? '' : 'cero'}">${n}</b><span>${txt}</span></div>`).join('')}
    ${conCambios ? `<div class="t-dato t-alerta" data-foto="sin_guion"><b>${conCambios}</b><span>Con cambios pedidos</span></div>` : ''}
    <div class="t-prox${prox ? ' n-' + p.nivel : ''}" data-foto="set"><span>Tu próxima fecha límite</span>
      ${prox ? `<b class="t-fecha">${esc(fDia(prox.editor_due))}</b><strong class="t-faltan">${esc(p.txt[0].toUpperCase() + p.txt.slice(1))}</strong>
        <small>${esc(cl ? cl.name : '')} · ${esc(prox.name)}</small>` : '<b class="t-fecha">Al día</b><small>No tienes videos por editar.</small>'}
    </div>
  </section>`;
}

function vistaProduccion() {
  const esAdmin = S.perfil.role === 'admin', f = S.filtro;
  const grupos = gruposProduccion();
  // Con un filtro de estado o "solo mis videos", los meses se muestran abiertos para ver lo que coincide
  const filtrando = f.estado !== 'todos' || f.mios;
  // Primero por cliente (en el orden de su mes más urgente) y dentro, sus meses
  const porCliente = [];
  grupos.forEach(g => {
    let b = porCliente.find(x => x.id === g.c.client_id);
    if (!b) porCliente.push(b = { id: g.c.client_id, cli: g.cli, grupos: [] });
    b.grupos.push(g);
  });
  const todosAbiertos = grupos.length > 0 && porCliente.every(b => S.abiertos.has('pc:' + b.id)) && grupos.every(g => S.abiertos.has(g.c.id));
  const conMeses = S.clientes.filter(cl => S.ciclos.some(c => c.client_id === cl.id));
  let vacio;
  if (!grupos.length) {
    if (esAdmin && !S.clientes.length) vacio = `<div class="caja-vacia"><p>Todavía no hay clientes. Da de alta el primero y crea su mes de contenido.</p><button class="btn btn-p" data-accion="nuevo-cliente">Nuevo cliente</button></div>`;
    else if (esAdmin && !S.videos.length) vacio = `<div class="caja-vacia"><p>No hay meses en producción. Crea el mes de un cliente y aquí aparecerán sus videos.</p><button class="btn btn-p" data-accion="ir" data-id="clientes">Ir a Clientes</button></div>`;
    else if (!esAdmin && !S.clientes.length) vacio = `<div class="caja-vacia"><p>Aún no tienes clientes asignados. Avísale a Connect Studios y en cuanto te asignen uno verás aquí sus videos.</p><button class="btn" data-accion="actualizar">Revisar de nuevo</button></div>`;
    else if (S.videos.length) vacio = `<div class="caja-vacia"><p>Nada coincide con estos filtros.</p></div>`;
    else vacio = `<div class="caja-vacia"><p>No hay videos en producción por ahora. Cuando empiece un mes, aparecerá aquí.</p></div>`;
  }
  return `<div class="encabezado">
    <div><h1>Producción</h1><p class="sub">${esAdmin ? 'Todos los meses en curso. Arriba lo que vence primero.' : 'Tus pendientes. Arriba lo que vence primero.'}</p></div>
    <div class="controles">
      <select class="campo-in" data-cambio="filtro-cliente" aria-label="Filtrar por cliente">
        <option value="todos">Todos los clientes</option>
        ${conMeses.map(cl => `<option value="${cl.id}"${f.cliente === cl.id ? ' selected' : ''}>${esc(cl.name)}</option>`).join('')}
      </select>
      <select class="campo-in" data-cambio="filtro-estado" aria-label="Filtrar por estado">
        <option value="todos">Todos los estados</option>
        ${Object.entries(ESTADOS).map(([k, t]) => `<option value="${k}"${f.estado === k ? ' selected' : ''}>${t}</option>`).join('')}
      </select>
      ${!esAdmin ? `<label class="interruptor"><input type="checkbox" data-cambio="filtro-mios"${f.mios ? ' checked' : ''}> Solo mis videos</label>` : ''}
      <label class="interruptor"><input type="checkbox" data-cambio="filtro-entregados"${f.entregados ? ' checked' : ''}> ${esAdmin ? 'Ver meses entregados' : 'Ver aprobados y entregados'}</label>
      ${grupos.length && !filtrando ? `<button class="btn btn-s btn-t" data-accion="${todosAbiertos ? 'plegar-todo' : 'desplegar-todo'}">${todosAbiertos ? 'Plegar todo' : 'Desplegar todo'}</button>` : ''}
    </div>
  </div>
  ${esAdmin ? avisosRevision() : ''}
  ${!esAdmin && S.clientes.length ? tableroEditor() : ''}
  ${porCliente.length ? porCliente.map(b => {
    const abiertoCli = filtrando || S.abiertos.has('pc:' + b.id);
    return `<section class="cli-prod n-${nivelCliente(b)}">
      ${cabCliente(b, abiertoCli)}
      ${abiertoCli ? `<div class="cp-meses">${b.grupos.map(g => { const abierto = filtrando || S.abiertos.has(g.c.id); return `<section class="grupo n-${nivelGrupo(g)}">
        ${cabGrupo(g, abierto)}
        ${abierto ? `<div class="filas">${g.visibles.map(filaVideo).join('')}</div>
        ${esAdmin ? `<div class="g-pie"><button class="btn btn-s btn-t" data-accion="agregar-video" data-id="${g.c.id}">Agregar video</button></div>` : ''}` : ''}
      </section>`; }).join('')}</div>` : ''}
    </section>`;
  }).join('') : vacio}`;
}

// Nivel de urgencia de un cliente: el de su mes más apurado
function nivelCliente(b) {
  const niveles = b.grupos.map(nivelGrupo);
  return ['vencido', 'urgente', 'ok'].find(n => niveles.includes(n)) || 'hecho';
}

// ---------- Calendario ------------------------------------------------
function vistaCalendario() {
  const DW = 24, DIAS = 92, esAdmin = S.perfil.role === 'admin';
  const inicio = S.calInicio || primerDia(hoy());
  const fin = sumarDias(inicio, DIAS - 1);
  const iISO = aISO(inicio), fISO = aISO(fin);
  const idx = iso => diasEntre(inicio, aFecha(iso));
  const ancho = DIAS * DW;
  const enRango = S.ciclos.filter(c => c.record_start <= fISO && c.delivery_date >= iISO);
  const filasCli = S.clientes.filter(cl => cl.active || enRango.some(c => c.client_id === cl.id));

  let regla = '', fondo = '';
  for (let i = 0; i < DIAS; i++) {
    const d = sumarDias(inicio, i), finde = d.getDay() === 0 || d.getDay() === 6;
    if (i === 0 || d.getDate() === 1) regla += `<span class="lt-mes" style="left:${i * DW}px">${nombreMes(d)}</span>`;
    regla += `<span class="lt-dia" style="left:${i * DW}px">${d.getDate()}</span>`;
    if (finde) fondo += `<i class="lt-finde" style="left:${i * DW}px"></i>`;
    if (d.getDate() === 1 && i > 0) fondo += `<i class="lt-corte" style="left:${i * DW}px"></i>`;
  }
  const t = idx(aISO(hoy()));
  const lineaHoy = (t >= 0 && t < DIAS) ? `<div class="lt-hoy" style="left:calc(var(--lbl) + ${t * DW + DW / 2 - 1}px)"><span>Hoy</span></div>` : '';

  const carga = new Array(DIAS).fill(0);
  enRango.forEach(c => {
    [...new Set([c.record_start, c.record_end])].forEach(d => { const i = idx(d); if (i >= 0 && i < DIAS) carga[i]++; });
  });
  const celdasCarga = carga.map((n, i) => n ? `<span class="carga ${n > 1 ? 'c2' : 'c1'}" style="left:${i * DW}px" title="${n} ${n > 1 ? 'grabaciones' : 'grabación'} el ${fLarga(aISO(sumarDias(inicio, i)))}">${n}</span>` : '').join('');
  // Publicaciones programadas y llamadas de venta: un círculo por día con cuántas hay
  const porDia = (fechas, cls, txt) => Object.entries(fechas.reduce((m, x) => { const i = idx(x.f); if (i >= 0 && i < DIAS) (m[i] = m[i] || []).push(x.t); return m; }, {}))
    .map(([i, ts]) => `<span class="${cls}" style="left:${i * DW}px" title="${esc(`${fLarga(aISO(sumarDias(inicio, +i)))}: ${txt(ts.length)}\n${ts.join('\n')}`)}">${ts.length}</span>`).join('');
  const pubs = porDia(S.videos.filter(v => v.programado_at).map(v => { const cy = S.ciclos.find(c => c.id === v.cycle_id), cl = cy && clientePorId(cy.client_id);
    return { f: aISO(new Date(v.programado_at)), t: `${cl ? cl.name + ': ' : ''}${v.title || 'Video ' + v.number}` }; }), 'pub', n => n === 1 ? '1 video se publica' : `${n} videos se publican`);
  const llamadas = esAdmin ? porDia(S.solicitudes.filter(x => x.cita).map(x => ({ f: aISO(new Date(x.cita)), t: `${horaDe(x.cita)} ${x.nombre}${x.empresa ? ` (${x.empresa})` : ''}` })), 'llam', n => n === 1 ? '1 llamada de venta' : `${n} llamadas de venta`) : '';

  const tramo = (a, b, cls, txt, c, titulo) => {
    let i0 = idx(a), i1 = idx(b);
    if (i1 < i0 || i1 < 0 || i0 > DIAS - 1) return '';
    i0 = Math.max(0, i0); i1 = Math.min(DIAS - 1, i1);
    if (cls === 'clip-grab' && (i1 - i0 + 1) * DW < 90) txt = 'Rec';
    const estilo = `left:${i0 * DW + 1}px;width:${(i1 - i0 + 1) * DW - 2}px`;
    // El editor solo mira el calendario; el admin toca un tramo para cambiar fechas
    return esAdmin
      ? `<button class="clip ${cls}" style="${estilo}" data-accion="editar-ciclo" data-id="${c.id}" title="${esc(titulo)}">${esc(txt)}</button>`
      : `<span class="clip ${cls} solo-ver" style="${estilo}" title="${esc(titulo)}">${esc(txt)}</span>`;
  };
  const filas = filasCli.map(cl => {
    const clips = enRango.filter(c => c.client_id === cl.id).map(c => {
      const e = idx(c.delivery_date);
      const tGrab = `${c.name}: grabación ${diasGrab(c.record_start, c.record_end)}`;
      // Si los dos días no van seguidos, cada uno es su propio tramo
      const grab = diasEntre(aFecha(c.record_start), aFecha(c.record_end)) > 1
        ? tramo(c.record_start, c.record_start, 'clip-grab', 'Grabación', c, tGrab) + tramo(c.record_end, c.record_end, 'clip-grab', 'Grabación', c, tGrab)
        : tramo(c.record_start, c.record_end, 'clip-grab', 'Grabación', c, tGrab);
      return grab
        + tramo(aISO(sumarDias(aFecha(c.record_end), 1)), c.editor_due, 'clip-edit', `${esAdmin ? 'Edición' : 'Tu edición'} ${c.name}`, c, `${c.name}: edición hasta ${fDia(c.editor_due)}`)
        + tramo(aISO(sumarDias(aFecha(c.editor_due), 1)), aISO(sumarDias(aFecha(c.delivery_date), -1)), 'clip-rev', 'Revisión', c, `${c.name}: ${esAdmin ? 'tu revisión' : 'revisión de Connect Studios'} antes de entregar`)
        + ((e >= 0 && e < DIAS) ? `<span class="hito" style="left:${e * DW + DW / 2 - 1}px" title="${esc(c.name)}: entrega ${fDia(c.delivery_date)}"></span>` : '');
    }).join('');
    return `<div class="lt-fila"><div class="lt-lbl">${esc(cl.name)}${cl.active ? '' : '<small>En pausa</small>'}</div><div class="lt-pista" style="width:${ancho}px">${clips}</div></div>`;
  }).join('');

  return `<div class="encabezado">
    <div><h1>Calendario</h1><p class="sub">${esAdmin
      ? 'Grabaciones, edición y entregas de todos tus clientes en una sola línea de tiempo. Si dos clientes graban el mismo día, el número se pone en rojo.'
      : 'Grabaciones, tu tiempo de edición y las entregas de los clientes que llevas. La barra dorada termina en tu fecha límite.'}</p></div>
    <div class="controles">
      <button class="btn btn-s" data-accion="cal-mover" data-id="-1" aria-label="Mes anterior">‹</button>
      <button class="btn btn-s" data-accion="cal-mover" data-id="0">Hoy</button>
      <button class="btn btn-s" data-accion="cal-mover" data-id="1" aria-label="Mes siguiente">›</button>
    </div>
  </div>
  ${filasCli.length ? `<div class="lt" style="--dw:${DW}px"><div class="lt-in" style="width:calc(var(--lbl) + ${ancho}px)">
    <div class="lt-fondo" style="left:var(--lbl);width:${ancho}px">${fondo}</div>
    ${lineaHoy}
    <div class="lt-fila lt-regla"><div class="lt-lbl"><small>${rango(iISO, fISO)}</small></div><div class="lt-pista" style="width:${ancho}px">${regla}</div></div>
    <div class="lt-fila"><div class="lt-lbl">Grabaciones<small>por día</small></div><div class="lt-pista" style="width:${ancho}px">${celdasCarga}</div></div>
    <div class="lt-fila"><div class="lt-lbl">Publicaciones<small>programadas</small></div><div class="lt-pista" style="width:${ancho}px">${pubs}</div></div>
    ${esAdmin ? `<div class="lt-fila"><div class="lt-lbl">Llamadas<small>de venta</small></div><div class="lt-pista" style="width:${ancho}px">${llamadas}</div></div>` : ''}
    ${filas}
  </div></div>
  <div class="leyenda">
    <span><i style="background:var(--crema)"></i>Grabación</span>
    <span><i style="background:var(--dorado)"></i>${esAdmin ? 'Edición' : 'Tu edición'}</span>
    <span><i style="background:repeating-linear-gradient(135deg,rgba(227,178,60,.6) 0 4px,rgba(227,178,60,.18) 4px 8px)"></i>${esAdmin ? 'Tu revisión' : 'Revisión de Connect'}</span>
    <span><i style="background:var(--verde);width:4px"></i>Entrega al cliente</span>
    <span><i style="background:var(--verde-2);width:10px;border-radius:50%"></i>Publicaciones</span>
    ${esAdmin ? '<span><i style="border:2px solid var(--crema);width:10px;border-radius:50%"></i>Llamadas de venta</span>' : ''}
    <span><i style="background:var(--dorado);width:2px"></i>Hoy</span>
  </div>
  ${enRango.length ? (esAdmin ? '<p class="nota">Toca cualquier tramo para cambiar las fechas de ese mes.</p>' : '')
    : `<p class="nota">No hay meses en estas fechas.${esAdmin ? ' Créalos desde Clientes.' : ''}</p>`}` :
  (esAdmin ? `<div class="caja-vacia"><p>Cuando tengas clientes, aquí verás tu capacidad de grabación y edición mes con mes.</p><button class="btn btn-p" data-accion="ir" data-id="clientes">Ir a Clientes</button></div>`
    : '<div class="caja-vacia"><p>Aún no tienes clientes asignados. Cuando te asignen uno, aquí verás sus fechas.</p></div>')}`;
}

  const usuarios = S.perfiles.filter(p => p.role === 'cliente' && p.client_id === cl.id);
  const editores = editoresDeCliente(cl.id);
  const mostrar = S.verTodos[cl.id] ? cs : cs.slice(0, 4);
  const abierto = S.abiertos.has('cc:' + cl.id);
  return `<section class="cli">
    <div class="cli-cab">
      <div>
        <h2 class="cli-nombre${cl.active ? '' : ' pausado'}"><button class="g-plegar" data-accion="plegar" data-id="cc:${cl.id}" aria-expanded="${abierto}"><span class="g-flecha" aria-hidden="true"></span>${esc(cl.name)}</button></h2>
        <p class="cli-meta"><b>${cs.length ? `${cs.length} ${cs.length === 1 ? 'mes' : 'meses'}` : 'Sin meses'}</b>${cs.length && !abierto ? ` (${esc(cs.slice(0, 3).map(c => c.name).join(', '))}${cs.length > 3 ? '…' : ''})` : ''}.
          ${cl.videos_per_cycle} videos por mes${cl.active ? '' : ', en pausa'}. ${usuarios.length ? `Con acceso: ${usuarios.map(u => esc(nombreDe(u))).join(', ')}.` : 'Nadie de este cliente tiene acceso todavía.'}
          ${editores.length ? `Editores: ${editores.map(u => esc(nombreDe(u))).join(', ')}.` : 'Sin editor asignado (se asigna en Equipo → Accesos al portal).'}</p>
        ${lineaMailerlite(cl)}
        <p class="cli-meta">${(e => e && e.confirmado_at ? `Estilo visual confirmado el ${esc(fCorta(e.confirmado_at))}.` : e ? 'Estilo visual en proceso: todavía no lo confirma.' : 'Estilo visual: todavía no lo elige.')(estiloFila(cl.id))}</p>
      </div>
      <div class="controles">
        <button class="btn btn-s btn-t" data-accion="cli-historial" data-id="${cl.id}">Historial</button>
        <button class="btn btn-s btn-t" data-accion="estilo-cliente" data-id="${cl.id}">Estilo</button>
        ${cs.length ? `<button class="btn btn-s btn-t" data-accion="previa" data-id="${cl.id}">Ver como cliente</button>` : ''}
        <button class="btn btn-s" data-accion="editar-cliente" data-id="${cl.id}">Editar</button>
        <button class="btn btn-s btn-p" data-accion="nuevo-ciclo" data-id="${cl.id}">Nuevo mes</button>
      </div>
    </div>
    ${abierto ? `${cs.length ? `<div class="ciclos">${mostrar.map(filaCiclo).join('')}</div>` : '<p class="nota">Sin meses todavía.</p>'}
    ${cs.length > 4 && !S.verTodos[cl.id] ? `<button class="btn btn-s btn-t" data-accion="ver-todos" data-id="${cl.id}">Ver los ${cs.length} meses</button>` : ''}` : ''}
  </section>`;
}

function lineaMailerlite(cl) {
  const l = mlUltimo(cl.id);
  const correo = cl.contact_email || (S.perfiles.find(p => p.role === 'cliente' && p.client_id === cl.id) || {}).email;
  let txt;
  if (!l) txt = cl.active ? 'MailerLite: sin enviar todavía.' : 'MailerLite: nunca se envió.';
  else if (l.estado === 'error') txt = `<span class="ml-error">MailerLite: error.</span> ${esc(l.mensaje || '')}`;
  else if (l.estado === 'pendiente') txt = 'MailerLite: enviando…';
  else if (l.accion === 'baja') txt = 'MailerLite: fuera de “Clientes activos” (en pausa).';
  else {
    const d = l.datos || {};
    txt = `MailerLite: al día${d.fecha_limite_texto ? `, guiones hasta el ${esc(d.fecha_limite_texto)}` : ', sin mes próximo'}.`;
  }
  return `<p class="cli-meta ml-linea">${txt}${correo ? ` <span class="nota">(${esc(correo)})</span>` : ''}
    <button class="btn btn-s btn-t" data-accion="ml-reenviar" data-id="${cl.id}">Reenviar a MailerLite</button></p>`;
}

function filaCiclo(c) {
  const vs = S.videos.filter(v => v.cycle_id === c.id).sort((a, b) => a.number - b.number);
  const ent = vs.filter(v => v.status === 'entregado').length;
  const r = S.reportes.find(x => x.cycle_id === c.id);
  return `<div class="ciclo">
    <b>${esc(c.name)}</b>
    <span class="nota">${c.script_due ? `Guiones hasta ${fCorta(c.script_due)}. ` : ''}Graba ${diasGrab(c.record_start, c.record_end)}. Edición hasta ${fCorta(c.editor_due)}. Entrega ${fCorta(c.delivery_date)}.</span>
    ${vs.length ? `<div class="ciclo-av">${tira(vs)}<span class="nota">${ent} de ${vs.length} entregados</span></div>` : `<button class="btn btn-s btn-t" data-accion="historial" data-id="${c.id}">Ver videos</button>`}
    <span class="controles">
      ${ent || (r && r.publicado) ? `<button class="btn btn-s btn-t" data-accion="wa-aviso" data-id="${c.id}" title="Avisar al cliente por WhatsApp">WhatsApp</button>` : ''}
      <button class="btn btn-s${r ? '' : ' btn-t'}" data-accion="reporte" data-id="${c.id}">${r ? (r.publicado ? 'Reporte publicado' : 'Reporte en borrador') : 'Hacer reporte'}</button>
      <button class="btn btn-s btn-t" data-accion="editar-ciclo" data-id="${c.id}">Editar</button>
    </span>
  </div>`;
}

// ---------- Solicitudes (páginas /solicitud y /guia) ------------------
const INTERES = { mensual: 'Contenido mensual', proyecto: 'Video o proyecto', no_se: 'Aún no sabe' };
const fHora = s => { const d = new Date(s); return `${d.getDate()} ${MESES_C[d.getMonth()]} · ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const waDe = t => { let d = String(t || '').replace(/\D/g, ''); if (d.length === 10) d = '52' + d; return d; };
const sitioDe = t => {
  const v = String(t || '').trim();
  if (!v) return '';
  if (/^@?[\w.]+$/.test(v) && !/\.[a-z]{2,}$/i.test(v)) return enlace('https://instagram.com/' + v.replace(/^@/, ''), v.startsWith('@') ? v : '@' + v);
  return enlace(/^https?:\/\//i.test(v) ? v : 'https://' + v, v.replace(/^https?:\/\//i, '')) || esc(v);
};

// /solicitud: ruta A (mensual) o B (proyecto), si califica y en qué va
const RUTAS = { A: 'Mensual', B: 'Proyecto' };
const ESTADOS_SOL = { incompleto: 'Incompleta', completo: 'Completa, sin agendar', agendado: 'Agendada' };
const qaDe = x => Array.isArray((x.respuestas || {})._qa) ? x.respuestas._qa : [];
// De dónde llegó: lo que contestó en "¿cómo nos conociste?" o, si no, la campaña del link
function fuenteDe(x) {
  const o = x.origen || {}, conocio = (qaDe(x).find(r => r[0] === 'conocio') || [])[2];
  return x.tipo === 'solicitud'
    ? [conocio && !/^Llegó por un link/.test(conocio) ? conocio : o.utm_source, o.utm_campaign].filter(Boolean).join(' · ')
    : [o.utm_source, o.utm_campaign, o.utm_content].filter(Boolean).join(' · ');
}
function mensajeWA(x, pila) {
  if (x.tipo === 'guia') return `Hola ${pila}, soy Manuel de Connect Studios. Vi que descargaste la guía de videos, ¿te sirvió?`;
  if (x.tipo === 'web') return `Hola ${pila}, soy Manuel de Connect Studios. Vi tu mensaje en la página.`;
  if (x.tipo !== 'solicitud') return `Hola ${pila}, soy Manuel de Connect Studios. Vi tu solicitud.`;
  if (x.estado === 'incompleto') return `Hola ${pila}, soy Manuel de Connect Studios. Vi que empezaste tu solicitud en la página, ¿te ayudo con algo?`;
  if (x.estado === 'agendado') return `Hola ${pila}, soy Manuel de Connect Studios. Ya vi que agendaste nuestra llamada, ¡nos vemos!`;
  if (x.califica) return `Hola ${pila}, soy Manuel de Connect Studios. Vi tu solicitud y me encantaría platicarla, ¿te ayudo a agendar la llamada?`;
  return `Hola ${pila}, soy Manuel de Connect Studios. Revisé tu solicitud.`;
}

function vistaSolicitudes() {
  const todas = S.solicitudes, nuevas = todas.filter(x => !x.atendida).length, f = S.solFiltro;
  const filtrando = f.ruta || f.califica || f.estado;
  const lista = todas.filter(x => (S.verAtendidas || !x.atendida)
    && (!f.ruta || x.ruta === f.ruta)
    && (!f.califica || (x.tipo === 'solicitud' && x.estado !== 'incompleto' && String(!!x.califica) === f.califica))
    && (!f.estado || x.estado === f.estado));
  const link = location.origin + '/solicitud/';
  const opt = (v, t, actual) => `<option value="${v}"${actual === v ? ' selected' : ''}>${t}</option>`;
  return `<div class="encabezado">
    <div><h1>Solicitudes</h1><p class="sub">Quien llena la <a href="${esc(link)}" target="_blank" rel="noopener">${esc(link.replace(/^https?:\/\//, ''))}</a> o descarga la <a href="${esc(location.origin + '/guia/')}" target="_blank" rel="noopener">guía</a> aparece aquí. Márcala como atendida cuando ya le escribiste.</p></div>
    <div class="controles">
      <select class="campo-in" data-cambio="sol-filtro" data-campo="ruta" aria-label="Filtrar por ruta">${opt('', 'Todas las rutas', f.ruta)}${opt('A', 'Mensual', f.ruta)}${opt('B', 'Proyecto', f.ruta)}</select>
      <select class="campo-in" data-cambio="sol-filtro" data-campo="califica" aria-label="Filtrar por calificación">${opt('', 'Califica o no', f.califica)}${opt('true', 'Califica', f.califica)}${opt('false', 'No califica', f.califica)}</select>
      <select class="campo-in" data-cambio="sol-filtro" data-campo="estado" aria-label="Filtrar por estado">${opt('', 'Todos los estados', f.estado)}${Object.entries(ESTADOS_SOL).map(([k, t]) => opt(k, t, f.estado)).join('')}</select>
      <label class="interruptor"><input type="checkbox" data-cambio="sol-ver-atendidas"${S.verAtendidas ? ' checked' : ''}> Ver atendidas</label>
    </div>
  </div>
  ${nuevas ? `<p class="aviso-linea">${nuevas === 1 ? 'Hay 1 solicitud sin atender.' : `Hay ${nuevas} solicitudes sin atender.`}</p>` : ''}
  ${lista.length ? `<div class="sol-lista">${lista.map(x => {
    const wa = waDe(x.whatsapp), pila = String(x.nombre || '').split(/\s+/)[0], qa = qaDe(x);
    const fuente = fuenteDe(x);
    const sol = x.tipo === 'solicitud';
    const ultima = sol && x.estado === 'incompleto' && qa.length ? qa[qa.length - 1][1] : '';
    const detalle = qa.filter(r => !['nombre', 'correo', 'whatsapp'].includes(r[0]));
    return `<article class="sol${x.atendida ? ' atendida' : ''}${sol && x.estado !== 'incompleto' && !x.califica ? ' no-califica' : ''}">
      <div>
        <div class="sol-nombre">${esc(x.nombre)} <span>· ${x.empresa ? esc(x.empresa) : 'Sin negocio todavía'}</span></div>
        <div class="sol-meta">
          ${wa ? `<a href="https://wa.me/${wa}?text=${encodeURIComponent(mensajeWA(x, pila))}" target="_blank" rel="noopener">WhatsApp ${esc(x.whatsapp)}</a>` : ''}
          <a href="mailto:${esc(x.correo)}">${esc(x.correo)}</a>
          ${x.sitio ? `<span>${sitioDe(x.sitio)}</span>` : ''}
        </div>
        ${x.mensaje ? `<p class="sol-msg">${esc(x.mensaje)}</p>` : ''}
        ${ultima ? `<p class="nota">Se quedó después de: ${esc(ultima)}</p>` : ''}
        ${sol && detalle.length ? `<details class="sol-det"><summary>Ver respuestas</summary><dl>${detalle.map(r =>`<dt>${esc(r[1])}</dt><dd>${esc(r[2])}</dd>`).join('')}</dl></details>` : ''}
        ${x.tipo !== 'guia' ? (prop => `<div class="sol-acc">${prop
          ? `<button class="btn btn-s" data-accion="ir-propuestas">Propuesta: ${esc(estadoPropuesta(prop).txt.toLowerCase())}</button>`
          : `<button class="btn btn-s btn-t" data-accion="prop-nueva" data-id="${x.id}">Hacer propuesta</button>`}</div>`)(S.propuestas.find(pr => pr.solicitud_id === x.id)) : ''}
      </div>
      <div class="sol-der">
        ${sol ? `${x.ruta ? `<span class="sol-int">${RUTAS[x.ruta]}</span>` : ''}
          ${x.estado !== 'incompleto' ? `<span class="sol-int${x.califica ? ' sol-ok' : ''}">${x.califica ? 'Califica' : 'No califica'}</span>` : ''}
