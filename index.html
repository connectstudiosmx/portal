  async 'ciclo-aprobar'(el, id) {
    const c = S.ciclos.find(x => x.id === id); if (!c) return;
    if (!await confirmar(c.revision_estado === 'ajustes' ? '¿Ya entregaste los ajustes?' : '¿Marcar el mes como aprobado?', 'El cliente ya no podrá pedir ajustes de este mes.', 'Sí, aprobado')) return;
    await q(sb.from('cycles').update({ revision_estado: 'aprobado', aprobado_at: new Date().toISOString(), aprobado_por: 'admin' }).eq('id', id));
    await recargar(); aviso('Mes aprobado');
  },
  async 'aprobar-mes'(el, id) {
    if (S.vista === 'previa') return;
    const c = ((S.portal && S.portal.cycles) || []).find(x => x.id === id); if (!c) return;
    if (!await confirmar(`¿Apruebas tus videos de ${c.name}?`, 'Ya no se podrán pedir ajustes de este mes.', 'Sí, aprobar')) return;
    await q(sb.rpc('client_aprobar_mes', { p_cycle: id }));
    await recargar(); aviso('¡Gracias! Tus videos quedaron aprobados');
  },
  'pedir-ajustes'(el, id) { if (S.vista !== 'previa') modalPedirAjustes(id); },
  'pago-metodo'(el, id) { S.metodoPago = id === 'transferencia' ? 'transferencia' : 'tarjeta'; render(); },
  async 'pagar-mensualidad'(el) {
    if (S.vista === 'previa') return aviso('En la vista previa no se paga.');
    el.disabled = true;
    try {
      const { data } = await sb.auth.getSession();
      const r = await fetch(PAGOS_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + ((data.session || {}).access_token || '') }, body: JSON.stringify({ accion: 'mensualidad' }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.url) throw new Error(d.error || 'No se pudo iniciar el pago.');
      location.href = d.url;
    } catch (e) { el.disabled = false; aviso(String(e.message || e) + ' También puedes pagar por transferencia.', true); }
  },
  'cot-ajustes'() { modalCotAjustes(); },
  async 'cot-nueva'(el, id) {
    S.cot.actual = cotNueva(id); render(); window.scrollTo(0, 0);
    const e = document.getElementById('cot-empresa'); if (e) e.focus();
  },
  async 'cot-salir'() { if (!await cotSalirOk()) return; S.cot.actual = null; render(); window.scrollTo(0, 0); },
  'cot-quitar'(el, i) { S.cot.actual.lineas.splice(Number(i), 1); S.cot.actual.sucio = true; render(); },
  async 'cot-guardar'(el) {
    el.disabled = true;
    try { if (await cotGuardar()) render(); } finally { if (document.contains(el)) el.disabled = false; }
  },
  async 'cot-propuesta'(el) {
    el.disabled = true;
    let c;
    try { c = await cotGuardar(true); } finally { if (document.contains(el)) el.disabled = false; }
    if (!c) return;
    render();
    const p = cotPlant(c.plantilla), r = cotCalc(c), def = PROP_DEF[p.tipo];
    const grab = c.lineas.filter(l => l.ref === 'dia_grabacion').reduce((s, l) => s + l.cant, 0);
    const dron = c.lineas.some(l => l.ref === 'dron' && l.cant > 0);
    modalPropuesta(null, { cot: c.id, para: { empresa: c.empresa }, duplicar: Object.assign({}, def, {
      tipo: p.tipo, titulo: c.titulo || p.nombre, precio: r.precio, iva: 'mas_iva', anticipo: null, diagnostico: '', ejemplo_url: '',
      servicio: p.tipo === 'proyecto' && p.id !== 'blanco' ? p.id : null,
      condiciones: p.tipo === 'proyecto' ? condDe(p.id) : def.condiciones,
      incluye: p.incluye ? p.incluye({ grab, dron }).join('\n') : def.incluye,
      notas: `Del cotizador: costo ${pesos(r.costo)}, utilidad ${pesos(r.utilReal)} (${Math.round(r.margen)}%).`,
      videos_ciclo: 12, dias_grabacion: p.tipo === 'mensual' ? Math.max(1, Math.round(grab) || 2) : 2, plazo_minimo: 3
    }) });
  },
  async 'cot-abrir'(el, id) {
    const x = S.cot.lista.find(y => y.id === id); if (!x || !await cotSalirOk()) return;
    S.cot.actual = cotDesde(x); render(); window.scrollTo(0, 0);
  },
  async 'cot-duplicar'(el, id) {
    const x = S.cot.lista.find(y => y.id === id); if (!x || !await cotSalirOk()) return;
    S.cot.actual = cotDesde(x, true); render(); window.scrollTo(0, 0);
    const e = document.getElementById('cot-empresa'); if (e) e.focus();
  },
  async 'cot-borrar'(el, id) {
    const x = S.cot.lista.find(y => y.id === id); if (!x) return;
    if (!await confirmar(`¿Borrar la cotización de ${x.empresa}?`, 'Se borra solo la cotización; si ya hiciste propuesta, la propuesta se queda.', 'Borrar', true)) return;
    await q(sb.from('cotizaciones').delete().eq('id', id));
    if (S.cot.actual && S.cot.actual.id === id) S.cot.actual = null;
    await cotRecargarLista(); aviso('Cotización borrada'); render();
  },
  'prop-nueva'(el, id) {
    const sol = id ? S.solicitudes.find(x => x.id === id) : null;
    modalPropuesta(null, sol ? { solicitud: sol } : {});
  },
  'prop-editar'(el, id) { modalPropuesta(id); },
  'prop-cobrar-final'(el, id) { const x = S.propuestas.find(pr => pr.id === id); if (x) modalCobroFinal(x); },
  async 'cobro-final'(el, id) {
    const x = S.propuestas.find(pr => pr.id === id); if (!x) return;
    const txt = (document.getElementById('wa-texto') || {}).value || '';
    if (el.dataset.modo === 'wa') window.open(`https://wa.me/${waDe(x.whatsapp)}?text=${encodeURIComponent(txt)}`, '_blank', 'noopener');
    else { el.dataset.texto = txt; el.dataset.ok = 'Mensaje copiado: pégalo en tu chat'; await ACC.copiar(el); }
    // Desde aquí la propuesta le muestra el pago final
    if (!x.liquidacion_pedida_at) await q(sb.from('propuestas').update({ liquidacion_pedida_at: new Date().toISOString() }).eq('id', id));
    cerrarModal(); await recargar();
  },
  async 'prop-final-recibido'(el, id) {
    const x = S.propuestas.find(pr => pr.id === id); if (!x) return;
    if (!await confirmar(`¿Ya recibiste el pago final de ${x.empresa}?`, `Marca ${dinero(restanteDe(x))} como pagado por transferencia. Su propuesta dirá que todo quedó pagado.`, 'Sí, ya lo recibí')) return;
    await q(sb.from('propuestas').update({ liquidada_at: new Date().toISOString(), liquidacion_metodo: 'transferencia' }).eq('id', id));
    aviso('Pago final marcado'); await recargar();
  },
  'prop-duplicar'(el, id) {
    const x = S.propuestas.find(pr => pr.id === id); if (!x) return;
    modalPropuesta(null, { duplicar: Object.assign({}, x, { nombre: '', empresa: '', whatsapp: '', correo: '', diagnostico: '', notas: '' }) });
  },
  'ir-propuestas'() { S.vista = 'propuestas'; S.propFiltro = ''; render(); window.scrollTo(0, 0); },
  async 'prop-copiar'(el, id) {
    const x = S.propuestas.find(pr => pr.id === id); if (!x) return;
    el.dataset.texto = linkPropuesta(x); el.dataset.ok = 'Link copiado: pégalo en tu mensaje';
    await ACC.copiar(el);
    marcarEnviada(x);
  },
  'prop-wa'(el, id) {
    const x = S.propuestas.find(pr => pr.id === id); if (!x) return;
    window.open(`https://wa.me/${waDe(x.whatsapp)}?text=${encodeURIComponent(textoWAPropuesta(x))}`, '_blank', 'noopener');
    cerrarModal();
    marcarEnviada(x);
  },
  async 'prop-borrar'(el, id) {
    const x = S.propuestas.find(pr => pr.id === id); if (!x) return;
    // Con pago o ya dado de alta, la propuesta es el registro de la venta: no se borra
    if (x.pagada_at || x.client_id || S.pagosStripe.some(ps => ps.propuesta_id === id)) {
      return aviso(`No se puede borrar: ${x.client_id ? `${x.empresa} ya es cliente` : 'ya tiene un pago registrado'} y esta propuesta es el registro de la venta. Para no verla, usa el filtro de Propuestas.`, true);
    }
    // Si firmó contrato pero no pagó, el contrato se va con la propuesta para no dejarlo suelto
    const ct = contratoDe(x);
    const texto = ct ? `También se borra el contrato que firmó ${ct.firmado_por || x.nombre} el ${fCorta(ct.firmado_at)}. El link deja de funcionar. No se puede deshacer.` : 'El link deja de funcionar. No se puede deshacer.';
    if (!await confirmar(`¿Borrar la propuesta para ${x.empresa}?`, texto, 'Borrar', true)) return;
    try {
      if (ct) await q(sb.from('contratos').delete().eq('id', ct.id));
      await q(sb.from('propuestas').delete().eq('id', id));
      aviso(ct ? 'Propuesta y contrato borrados' : 'Propuesta borrada'); await recargar();
    }
    catch (e) { aviso(humano(e), true); }
  },
  async 'prop-cliente'(el, id) {
    const x = S.propuestas.find(pr => pr.id === id); if (!x) return;
    const ctx = contratoDe(x);
    if (!await confirmar(`¿Dar de alta a ${x.empresa} como cliente?`, `Se crea el cliente con su contacto${x.tipo === 'mensual' ? ' y su mensualidad (para que pueda pagar con tarjeta)' : ''}. Después le creas su primer mes en Clientes${ctx && ctx.primer_ciclo ? `: según el contrato, se graba del ${fCorta(ctx.primer_ciclo.inicio)} al ${fCorta(ctx.primer_ciclo.fin)}` : ''}.${ctx ? ` Su cuenta de Google para el portal: ${ctx.correo_google}.` : ''}`, 'Dar de alta')) return;
    try {
      const ct = contratoDe(x);
      const datos = { name: x.empresa, contact_name: x.nombre || null, contact_email: (ct && ct.correo) || x.correo || null,
        contact_phone: (ct && ct.whatsapp) || x.whatsapp || null, onboarding_date: aISO(hoy()), videos_per_cycle: x.videos_ciclo || 12,
        mensualidad: x.tipo === 'mensual' ? x.precio : null, iva: x.iva };
      const cl = await q(sb.from('clients').insert(datos).select('id').single());
      await q(sb.from('propuestas').update({ client_id: cl.id }).eq('id', x.id));
      if (ct) await q(sb.from('contratos').update({ client_id: cl.id }).eq('id', ct.id));
      await recargar();
      modalYaCliente(x);
    } catch (e) { aviso(humano(e), true); }
  },
  async 'borrar-acceso'(el, id) {
    const p = perfilPorId(id); if (!p) return;
    const editor = p.role === 'editor';
    if (!await confirmar(`¿Borrar a ${nombreDe(p)}?`, `Se borra su acceso al portal${editor ? ' y los clientes que tenía asignados; sus videos se quedan sin editor' : ''}. Si vuelve a entrar con Google, aparece otra vez como pendiente.`, 'Borrar', true)) return;
    try { await q(sb.rpc('admin_borrar_acceso', { p_id: id })); aviso('Acceso borrado'); await recargar(); }
    catch (e) { aviso(humano(e), true); }
  },
  factura(el, id) { modalFactura(id); },
  async 'borrar-factura'(el, id) {
    const x = S.facturas.find(f => f.id === id); if (!x) return;
    const cl = clientePorId(x.client_id);
    if (!await confirmar(`¿Borrar la solicitud de factura de ${cl ? cl.name : 'este cliente'}?`, 'El cliente deja de verla en su portal. Si ya la emitiste y solo hubo un error, mejor márcala como cancelada.', 'Borrar', true)) return;
    try { await q(sb.from('facturas').delete().eq('id', id)); aviso('Solicitud de factura borrada'); await recargar(); }
    catch (e) { aviso(humano(e), true); }
  },
  'pedir-factura'() {
    if (S.vista === 'previa') return aviso('En la vista previa no se piden facturas.');
    if (!S.pagosCli) return aviso('Esta sección no cargó. Toca “Revisar de nuevo”.', true);
    modalPedirFactura();
  },
  'nuevo-ciclo'(el, id) { modalCiclo(null, id); },
  'editar-ciclo'(el, id) { modalCiclo(id); },
  async 'borrar-ciclo'(el, id) {
    const c = S.ciclos.find(x => x.id === id); if (!c) return;
    if (!await confirmar(`¿Borrar ${c.name}?`, 'Se borran todos los videos de este mes, con sus guiones y links. No se puede deshacer.', 'Borrar mes', true)) return;
    try { await q(sb.from('cycles').delete().eq('id', id)); aviso('Mes borrado'); await recargar(); }
    catch (e) { aviso(humano(e), true); }
  },
  async historial(el, id) {
    const c = S.ciclos.find(x => x.id === id); if (!c) return;
    try {
      const vs = await q(sb.from('videos').select('*').eq('cycle_id', id).order('number'));
      S.videos = S.videos.filter(v => v.cycle_id !== id).concat(vs || []);
      render();
      const cl = clientePorId(c.client_id);
      abrirModal(`<div class="d-cab"><div><h2 class="d-titulo">${esc(cl ? cl.name : '')}: ${esc(c.name)}</h2><p class="d-sub">Entrega ${esc(fLarga(c.delivery_date))}</p></div></div>
        <div class="filas">${(vs || []).map(v => `<div class="fila"><span class="f-num">${pad(v.number)}</span>
          <div class="f-cuerpo"><div class="f-titulo">${v.title ? esc(v.title) : '<span class="vacio">Sin título</span>'}</div>
          <div class="f-meta">${enlace(v.final_url, 'Video terminado')}${enlace(v.script_url, 'Guion')}</div></div>
          <div class="f-der solo">${pill(v.status)}</div></div>`).join('')}</div>
        <div class="d-pie"><button class="btn" data-accion="cerrar">Cerrar</button></div>`);
    } catch (e) { aviso(humano(e), true); }
  }
};

const CAMBIOS = {
  'filtro-cliente'(el) { S.filtro.cliente = el.value; render(); },
  'filtro-estado'(el) { S.filtro.estado = el.value; render(); },
  'filtro-mios'(el) { S.filtro.mios = el.checked; render(); },
  'filtro-entregados'(el) { S.filtro.entregados = el.checked; render(); },
  'perfil-rol'(el) { actualizarPerfil(el.dataset.id, { role: el.value }, true); },
  'perfil-cliente'(el) { actualizarPerfil(el.dataset.id, { client_id: el.value || null }, true); },
  'perfil-nombre'(el) { actualizarPerfil(el.dataset.id, { full_name: el.value.trim() || null }, false); },
  'sol-ver-atendidas'(el) { S.verAtendidas = el.checked; render(); },
  'sol-filtro'(el) { S.solFiltro[el.dataset.campo] = el.value; render(); },
  'sol-atendida'(el) { marcarSolicitud(el.dataset.id, el.checked); },
  'post-filtro'(el) { S.postFiltro[el.dataset.campo] = el.value; render(); },
  'post-estado'(el) { guardarPostulacion(el.dataset.id, { estado: el.value }, true); },
  'post-nota'(el) {
    const x = S.postulaciones.find(p => p.id === el.dataset.id), nota = el.value.trim() || null;
    if (x && (x.nota || null) !== nota) guardarPostulacion(el.dataset.id, { nota }, false);
  },
  'fac-filtro'(el) { S.facFiltro = el.value; render(); },
  'prop-filtro'(el) { S.propFiltro = el.value; render(); },
  'met-periodo'(el) { S.metPeriodo = el.value; render(); },
  'cot-agregar'(el) {
    const g = el.dataset.grupo, v = el.value, c = S.cot.actual; if (!v || !c) return;
    const cfg = cotCfg(), t = cfg.tarifas;
    const dias = c.lineas.filter(l => l.ref === 'dia_grabacion').reduce((s, l) => s + l.cant, 0) || 1;
    const TIEMPO = { hora: ['Horas de trabajo', 'h', 1, t.hora], dia_grabacion: ['Día de grabación', 'día', 1, t.dia_grabacion], dia_edicion: ['Día de edición', 'día', 1, t.dia_edicion] };
    let l;
    if (v === '__otro') l = { ref: null, nombre: '', unidad: g === 'tiempo' ? 'h' : g === 'extras' ? 'pieza' : 'día', cant: 1, precio: 0 };
    else if (g === 'tiempo') { const [nombre, unidad, cant, precio] = TIEMPO[v]; l = { ref: v, nombre, unidad, cant, precio }; }
    else { const it = cfg[g].find(x => x.id === v); if (!it) return;
      const unidad = it.unidad || 'día'; l = { ref: it.id, nombre: it.nombre, unidad, cant: unidad === 'día' ? dias : 1, precio: it.precio }; }
    c.lineas.push(Object.assign({ k: cotClave(), grupo: g }, l));
    c.sucio = true; render();
    if (v === '__otro') { const ins = document.querySelectorAll('.cot-nombre'); const ult = [...ins].find(i => Number(i.dataset.i) === c.lineas.length - 1); if (ult) ult.focus(); }
  },
  'cob-filtro'(el) { S.cobFiltro = el.value; render(); },
  'estilo-color'(el) { cambiarEstilo({ color: el.value.toUpperCase() }); },
  'estilo-notas'(el) { cambiarEstilo({ notas: el.value.trim() }); },
  'estilo-logo'(el) { subirLogo(el); }
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-accion]');
  if (!el || el.disabled) return;
  const fn = ACC[el.dataset.accion];
  if (!fn) return;
  ev.preventDefault();
  Promise.resolve(fn(el, el.dataset.id, ev)).catch(e => aviso(humano(e), true));
});
document.addEventListener('change', ev => {
  const el = ev.target.closest('[data-cambio]');
  if (el && CAMBIOS[el.dataset.cambio]) CAMBIOS[el.dataset.cambio](el);
});
document.addEventListener('submit', ev => {
  const f = ev.target.closest('form[data-form]');
  if (!f || !FORMS[f.dataset.form]) return;
  ev.preventDefault();
  const btn = f.querySelector('[type=submit]');
  if (btn) btn.disabled = true;
  Promise.resolve(FORMS[f.dataset.form](f))
    .catch(e => aviso(humano(e), true))
    .finally(() => { if (btn && document.contains(btn)) btn.disabled = false; });
});
// Cotizador: cada tecla actualiza la cotización y sus números, sin repintar la página
document.addEventListener('input', ev => {
  const el = ev.target.closest('[data-cot]'), c = S.cot.actual;
  if (!el || !c) return;
  const k = el.dataset.cot, l = c.lineas[Number(el.dataset.i)];
  if (k === 'nombre' && l) l.nombre = el.value;
  else if ((k === 'cant' || k === 'precio') && l) l[k] = cotNum(el.value);
  else if (k === 'pct') c.pct[el.dataset.k] = cotNum(el.value);
  else if (k === 'precio-final') c.precio = el.value.trim() ? cotNum(el.value) : null;
  else if (['empresa', 'titulo', 'notas'].includes(k)) c[k] = el.value;
  c.sucio = true;
  cotNumeros();
});
raizModal.addEventListener('click', ev => { if (ev.target.classList.contains('velo')) cerrarModal(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && raizModal.innerHTML) cerrarModal(); });
const refrescarSiToca = () => {
  if (document.visibilityState === 'visible' && S.perfil && S.perfil.role !== 'pendiente'
      && !raizModal.innerHTML && Date.now() - S.cargadoEn > 60000) recargar();
};
window.addEventListener('focus', refrescarSiToca);
document.addEventListener('visibilitychange', refrescarSiToca);

// ---------- Arranque --------------------------------------------------
function leerErrorURL() {
  const p = new URLSearchParams(location.search + '&' + location.hash.replace(/^#/, ''));
  const e = p.get('error_description') || p.get('error');
  if (!e) return '';
  if (/signups? not allowed|not allowed for this instance/i.test(e)) return 'Tu cuenta no tiene acceso a este portal. Pídele acceso a Connect Studios.';
  return 'No se pudo entrar: ' + e.replace(/\+/g, ' ');
}
function limpiarURL() { if (location.search || location.hash) history.replaceState(null, '', location.pathname); }

let arrancando = null;
function arrancar() {
  if (!arrancando) arrancando = _arrancar().finally(() => { arrancando = null; });
  return arrancando;
}
async function _arrancar() {
  cerrarModal();
  if (!window.supabase) return pintar(pantallaSimple('Sin conexión', 'No se pudo cargar el portal. Revisa tu internet y recarga la página.', 'Recargar', 'recargar-pagina'));
  if (!configLista() || !sb) return pintar(pantallaSimple('Falta configurar', 'Abre index.html, llena CONFIG con la URL y la Publishable key de tu proyecto de Supabase, y vuelve a subirlo. Los pasos están en GUIA.md.'));
  const errorURL = leerErrorURL();
  pintar('<main class="entrada"><p class="nota">Cargando…</p></main>');
  let sesion = null;
  try { const r = await sb.auth.getSession(); sesion = r.data.session; } catch (e) { sesion = null; }
  limpiarURL();
  S.sesion = sesion;
  if (!sesion) { S.perfil = null; return pintar(pantallaEntrada(errorURL)); }
  try {
    S.perfil = await q(sb.from('profiles').select('*').eq('id', sesion.user.id).maybeSingle());
    if (!S.perfil || S.perfil.role === 'pendiente') {
      const email = sesion.user.email || '';
      S.perfil = null;
      return pintar(pantallaPendiente(email));
    }
    if (S.perfil.role !== 'admin') S.vista = 'produccion';
    if (PAGO_OK && S.perfil.role === 'cliente') S.pestanaCli = 'pagos';
    await recargar();
    if (PAGO_OK && S.perfil.role === 'cliente') aviso('¡Gracias! Recibimos tu pago con tarjeta. En unos segundos se confirma.');
  } catch (e) {
    pintar(pantallaSimple('No cargó', humano(e), 'Reintentar', 'reintentar'));
  }
}

if (sb) {
  sb.auth.onAuthStateChange(evento => {
    if (evento === 'SIGNED_OUT' && S.perfil) setTimeout(arrancar, 0);
    if (evento === 'SIGNED_IN' && !S.perfil && !arrancando) setTimeout(arrancar, 0);
  });
}
arrancar();
</script>
