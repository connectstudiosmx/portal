const cotPlant = id => COT_PLANT.find(p => p.id === id) || COT_PLANT[COT_PLANT.length - 1];
function cotCfg() {
  const c = (S.cot.config && S.cot.config.config) || {};
  return {
    tarifas: Object.assign({}, COT_DEF.tarifas, c.tarifas), meta: Object.assign({}, COT_DEF.meta, c.meta),
    pct: Object.assign({}, COT_DEF.pct, c.pct), redondeo: c.redondeo || COT_DEF.redondeo,
    equipo: c.equipo || COT_DEF.equipo, crew: c.crew || COT_DEF.crew, extras: c.extras || COT_DEF.extras
  };
}
const cotClave = () => Math.random().toString(36).slice(2, 9);
const pesos = n => (Number(n) < 0 ? '−$' : '$') + Math.abs(Math.round(Number(n) || 0)).toLocaleString('es-MX');
// Acepta "1,500", "$1500" y "0,5" (coma decimal)
const cotNum = s => {
  let t = String(s ?? '').trim().replace(/[$\s]/g, '');
  t = /^\d+,\d{1,2}$/.test(t) ? t.replace(',', '.') : t.replace(/,/g, '');
  const n = Number(t); return isFinite(n) && n >= 0 ? n : 0;
};
const COT_UNIDAD = { h: ['Horas', 'Por hora'], 'día': ['Días', 'Por día'], pieza: ['Cantidad', 'Cada uno'] };

function cotNueva(pid) {
  const p = cotPlant(pid), cfg = cotCfg(), t = cfg.tarifas, L = [];
  const lin = (grupo, ref, nombre, unidad, cant, precio) => L.push({ k: cotClave(), grupo, ref, nombre, unidad, cant, precio });
  if (p.horas) lin('tiempo', 'hora', p.horasTxt || 'Preproducción: diagnóstico, guion, scouting y juntas', 'h', p.horas, t.hora);
  if (p.grab) lin('tiempo', 'dia_grabacion', 'Días de grabación con dirección', 'día', p.grab, t.dia_grabacion);
  if (p.edicion) lin('tiempo', 'dia_edicion', p.edicionTxt || 'Días de edición, color y audio', 'día', p.edicion, t.dia_edicion);
  ['equipo', 'crew', 'extras'].forEach(g => Object.entries(p[g] || {}).forEach(([id, v]) => {
    const it = cfg[g].find(x => x.id === id); if (!it) return;
    lin(g, id, it.nombre, it.unidad || 'día', v === true ? p.grab : v, it.precio);
  }));
  return { id: null, plantilla: p.id, empresa: '', titulo: p.id === 'blanco' ? '' : p.nombre, lineas: L,
    pct: Object.assign({}, cfg.pct), redondeo: cfg.redondeo, precio: p.precioFijo || null, notas: '', sucio: false };
}

function cotCalc(c) {
  const suma = g => c.lineas.filter(l => !g || l.grupo === g).reduce((s, l) => s + (Number(l.cant) || 0) * (Number(l.precio) || 0), 0);
  const por = { tiempo: suma('tiempo'), equipo: suma('equipo'), crew: suma('crew'), extras: suma('extras') };
  const costo = suma(), pct = c.pct || {};
  const generales = costo * (pct.generales || 0) / 100;
  const imprevistos = (costo + generales) * (pct.imprevistos || 0) / 100;
  const base = costo + generales + imprevistos;
  const utilidad = base * (pct.utilidad || 0) / 100;
  const r = Number(c.redondeo) || 1;
  const sugerido = Math.ceil((base + utilidad) / r) * r;
  const precio = c.precio > 0 ? c.precio : sugerido;
  const utilReal = precio - base, iva = precio * 0.16, total = precio + iva;
  const fuera = por.crew + por.extras;                        // colaboradores y terceros
  const tuyo = precio - fuera - generales;                    // para tu tiempo, tu equipo y la utilidad
  const dias = c.lineas.filter(l => l.grupo === 'tiempo').reduce((s, l) => s + (l.unidad === 'h' ? l.cant / 8 : l.unidad === 'día' ? l.cant : 0), 0);
  return { por, costo, generales, imprevistos, base, utilidad, sugerido, precio, utilReal, margen: precio ? utilReal / precio * 100 : 0,
    iva, total, anticipo: precio / 2, fuera, tuyo, dias, porDia: dias ? tuyo / dias : 0,
    // Stripe, si paga con tarjeta (la absorbes): 3.6% + $3, más 5% a 3 meses o 7.5% a 6 meses sin intereses, todo + IVA
    comision: (total * 0.036 + 3) * 1.16, comision3: (total * 0.086 + 3) * 1.16, comision6: (total * 0.111 + 3) * 1.16 };
}
// Lo mínimo que debe valer tu día, según tu meta mensual
const cotMetaDia = () => { const m = cotCfg().meta; return m.dias ? m.mensual / m.dias : 0; };

function cotMercado(p, precio) {
  if (!p.mercado) return '<p class="nota" style="margin:.3rem 0 .8rem">Sin referencia de mercado para este servicio: guíate por tus costos.</p>';
  const [a, b] = p.mercado, lo = a * 0.5, hi = b * 1.3;
  const x = v => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
  const [cl, txt, consejo] = precio < a ? ['bajo', 'Abajo del mercado', 'Revisa que de verdad cubra tu tiempo.']
    : precio > b ? ['alto', 'Arriba del mercado', 'Justifícalo con lo que incluye o revisa días y equipo.']
    : ['ok', 'En el rango del mercado', ''];
  return `<div class="cot-merc m-${cl}">
    <div class="cot-merc-cab"><b>${txt}</b><span>${pesos(a)} – ${pesos(b)}</span></div>
    <div class="cot-barra" aria-hidden="true"><span class="cot-rango" style="left:${x(a)}%;width:${x(b) - x(a)}%"></span><span class="cot-punto" style="left:${x(precio)}%"></span></div>
    <p class="nota">${consejo ? esc(consejo) + ' ' : ''}${esc(p.fuente)}</p>
  </div>`;
}

  return `<div class="cot-datos">

    </div>
    <aside class="cot-resumen" aria-label="Resumen de la cotización">${cotResumen(c, r, p)}</aside>
  </div>`;
}

function cotResumen(c, r, p) {
  const fila = (t, k, cls) => `<div class="cot-r${cls ? ' ' + cls : ''}"><span>${t}</span><b data-r="${k}">${cotValor(r, k)}</b></div>`;
  const pct = (t, k) => `<div class="cot-r"><span>${t} <input class="cot-pct" data-cot="pct" data-k="${k}" inputmode="decimal" autocomplete="off" value="${esc(c.pct[k])}" aria-label="Porcentaje de ${t.toLowerCase()}">%</span><b data-r="${k}">${cotValor(r, k)}</b></div>`;
  return `<h3>Resumen</h3>
    ${fila('Tu tiempo', 'tiempo')}${fila('Tu equipo', 'equipo')}${fila('Colaboradores', 'crew')}${fila('Terceros y gastos', 'extras')}
    ${fila('Costo', 'costo', 'cot-r-sub')}
    ${pct('Gastos generales', 'generales')}${pct('Imprevistos', 'imprevistos')}${pct('Utilidad', 'utilidad')}
    ${fila('Precio sugerido', 'sugerido', 'cot-r-sub')}
    <div class="campo cot-final"><label for="cot-precio">Precio final antes de IVA</label>
      <input id="cot-precio" inputmode="decimal" autocomplete="off" data-cot="precio-final" value="${c.precio > 0 ? esc(c.precio) : ''}" placeholder="${esc(r.sugerido)}">
      <p class="ayuda">Vacío = el sugerido. Si lo cambias, abajo ves tu utilidad real.</p></div>
    <div data-r-merc>${cotMercado(p, r.precio)}</div>
    ${fila('Utilidad real', 'utilReal', r.utilReal < 0 ? 'cot-r-mal' : '')}
    ${fila('IVA (16%)', 'iva')}
    ${fila('Total con IVA', 'total', 'cot-r-total')}
    ${fila(p.tipo === 'mensual' ? 'Anticipo (50% del primer mes)' : 'Anticipo (50%)', 'anticipo')}
    <div class="cot-tuyo">
      <p><b data-r="fuera">${cotValor(r, 'fuera')}</b> se van a colaboradores y terceros.</p>
      <p><b data-r="tuyo">${cotValor(r, 'tuyo')}</b> te quedan a ti, ya descontados los gastos generales: es lo que paga tu tiempo, tu equipo y la utilidad.</p>
      <p class="cot-dia${r.porDia < cotMetaDia() ? ' cot-dia-bajo' : ''}" data-r-dia>${cotDiaTxt(r)}</p>
      <p class="nota">Si paga con tarjeta, la comisión de Stripe es de unos <span data-r="comision">${cotValor(r, 'comision')}</span>${p.tipo === 'proyecto'
        ? `; a 3 meses sin intereses, <span data-r="comision3">${cotValor(r, 'comision3')}</span>, y a 6 meses, <span data-r="comision6">${cotValor(r, 'comision6')}</span>`
        : ''}. La absorbes tú.</p>
    </div>
    <div class="cot-acc">
      <button class="btn btn-p" data-accion="cot-propuesta">Crear propuesta con este precio</button>
      <button class="btn" data-accion="cot-guardar">${c.id ? 'Guardar cambios' : 'Guardar cotización'}</button>
    </div>`;
}
function cotDiaTxt(r) {
  if (!r.dias) return '';
  const d = Math.round(r.dias * 10) / 10, meta = cotMetaDia();
  return `Son ${d} ${d === 1 ? 'día' : 'días'} de trabajo tuyo: te sale en <b>${pesos(r.porDia)} por día</b>.` +
    (meta && r.porDia < meta ? ` Tu meta es de ${pesos(meta)} por día.` : '');
}
function cotValor(r, k) {
  if (k in r.por) return pesos(r.por[k]);
  if (k === 'utilReal') return `${pesos(r.utilReal)} · ${Math.round(r.margen)}%`;
  if (k === 'anticipo') return pesos(r.anticipo) + ' + IVA';
  return pesos(r[k]);
}
// Al teclear solo se actualizan los números: si se repintara todo, se perdería el cursor
function cotNumeros() {
  const c = S.cot.actual, r = cotCalc(c), raiz = document.querySelector('.cot-layout');
  if (!raiz) return;
  raiz.querySelectorAll('[data-r]').forEach(el => { el.textContent = cotValor(r, el.dataset.r); });
  raiz.querySelectorAll('[data-r-grupo]').forEach(el => { el.textContent = pesos(r.por[el.dataset.rGrupo]); });
  raiz.querySelectorAll('[data-r-linea]').forEach(el => { const l = c.lineas[Number(el.dataset.rLinea)]; if (l) el.textContent = pesos(l.cant * l.precio); });
  const real = raiz.querySelector('[data-r="utilReal"]'); if (real) real.parentElement.classList.toggle('cot-r-mal', r.utilReal < 0);
  const merc = raiz.querySelector('[data-r-merc]'); if (merc) merc.innerHTML = cotMercado(cotPlant(c.plantilla), r.precio);
  const dia = raiz.querySelector('[data-r-dia]'); if (dia) { dia.innerHTML = cotDiaTxt(r); dia.classList.toggle('cot-dia-bajo', r.porDia < cotMetaDia()); }
  const pr = document.getElementById('cot-precio'); if (pr) pr.placeholder = String(r.sugerido);
}

}
async function cotGuardar(silencio) {
  const c = S.cot.actual, r = cotCalc(c), empresa = (c.empresa || '').trim();
  if (!empresa) { aviso('Escribe el cliente o empresa.', true); const el = document.getElementById('cot-empresa'); if (el) el.focus(); return null; }
  const d = { empresa, plantilla: c.plantilla, titulo: (c.titulo || '').trim() || null, notas: (c.notas || '').trim() || null,
    lineas: c.lineas.map(l => ({ grupo: l.grupo, ref: l.ref || null, nombre: (l.nombre || '').trim() || 'Concepto', unidad: l.unidad, cant: l.cant, precio: l.precio })),
    pct: Object.assign({}, c.pct, { redondeo: c.redondeo, precio_manual: c.precio > 0 }),
    costo: Math.round(r.costo * 100) / 100, precio: Math.round(r.precio * 100) / 100 };
  if (c.id) await q(sb.from('cotizaciones').update(d).eq('id', c.id));
  else c.id = (await q(sb.from('cotizaciones').insert(d).select('id').single())).id;
  c.sucio = false;

const REGIMENES = { '601': 'General de Ley Personas Morales', '626': 'Régimen Simplificado de Confianza',
  '612': 'Personas Físicas con Actividades Empresariales y Profesionales', '603': 'Personas Morales con Fines no Lucrativos',
  '606': 'Arrendamiento', '621': 'Incorporación Fiscal', '625': 'Plataformas Tecnológicas', '605': 'Sueldos y Salarios',

// Dígito verificador de la CLABE (pesos 3, 7, 1): evita publicar una CLABE con un número mal tecleado
function clabeValida(c) {
  if (!/^\d{18}$/.test(c)) return false;
  let s = 0;
  for (let i = 0; i < 17; i++) s += (Number(c[i]) * [3, 7, 1][i % 3]) % 10;
  return (10 - s % 10) % 10 === Number(c[17]);
}
const regimenTxt = k => k ? `${k} · ${REGIMENES[k] || 'Otro'}` : '';
const usoTxt = k => k ? `${k} · ${USOS_CFDI[k] || 'Otro'}` : '';

}
function avisoStripe() {

// Recuadro de firma (admin): devuelve { vacio, borrar, png }
function padFirma(cv, pista) {
  const ctx = cv.getContext('2d');
  let trazos = 0, dibujando = false, ultimo = null;
  const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111'; ctx.lineWidth = 2.4;
  const punto = e => { const b = cv.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
  cv.addEventListener('pointerdown', e => { dibujando = true; ultimo = punto(e); pista.hidden = true; try { cv.setPointerCapture(e.pointerId); } catch (_) { /* igual dibuja */ } e.preventDefault(); });
  cv.addEventListener('pointermove', e => { if (!dibujando) return; const p = punto(e); ctx.beginPath(); ctx.moveTo(ultimo.x, ultimo.y); ctx.lineTo(p.x, p.y); ctx.stroke(); ultimo = p; trazos++; });
  ['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => { dibujando = false; }));
  return {
    vacio: () => trazos < 12,
    borrar: () => { ctx.clearRect(0, 0, cv.width, cv.height); trazos = 0; pista.hidden = false; },
    png: () => cv.toDataURL('image/png')
  };
}

// ---------- Cobranza: cada mes vence el día de su entrega, con 5 días de tolerancia ----------
const hoyISO = () => aISO(hoy());
function estadoCobro(x) {
  if (x.estado === 'pagado') return { clave: 'pagado', et: 'Pagado', txt: `Pagado${x.metodo === 'tarjeta' ? ' con tarjeta' : x.metodo === 'transferencia' ? ' por transferencia' : ''}${x.pagado_at ? ' el ' + fCorta(aISO(new Date(x.pagado_at))) : ''}` };
  if (x.estado === 'no_aplica') return { clave: 'no_aplica', et: 'No aplica', txt: 'No se cobra' };
  const h = hoyISO(), limite = aISO(sumarDias(aFecha(x.vence), 5));
  if (h > limite) return { clave: 'vencido', et: 'Vencido', txt: `Venció el ${fCorta(limite)} (tocaba el ${fCorta(x.vence)})` };
  if (h >= x.vence) return { clave: 'toca', et: 'Toca pagar', txt: h === x.vence ? 'Toca hoy' : `Tocaba el ${fCorta(x.vence)}; tolerancia hasta el ${fCorta(limite)}` };
  return { clave: 'pendiente', et: 'Pendiente', txt: `Vence el ${fCorta(x.vence)}` };
}
function waRecordatorio(x, cl, cy) {
  const tel = cl && waDe(cl.contact_phone); if (!tel) return '';
  const e = estadoCobro(x), pila = String((cl && cl.contact_name) || '').split(/\s+/)[0];
  const cuando = e.clave === 'vencido' ? 'ya pasó su fecha de pago' : e.clave === 'toca' ? 'hoy es su día de pago' : `vence el ${fLarga(x.vence)}`;
  return `https://wa.me/${tel}?text=${encodeURIComponent(`Hola${pila ? ' ' + pila : ''}, te recuerdo la mensualidad de ${cl.name}${cy ? ` (${cy.name})` : ''}: ${x.monto ? dinero(x.monto) : ''}; ${cuando}. La puedes pagar con tarjeta o por transferencia desde tu portal, en la pestaña Pagos: ${PORTAL_URL}\n\n¡Gracias!`)}`;
}
// Las cuentas de cobranza: las usan Pagos e Inicio, para que siempre den lo mismo
const sumaMontos = xs => xs.reduce((t, x) => t + Number(x.monto || 0), 0);
function cuentasCobranza() {
  const todos = (S.cobros || []).map(x => Object.assign({}, x, { e: estadoCobro(x), cl: clientePorId(x.client_id), cy: S.ciclos.find(c => c.id === x.cycle_id) }));
  const mes = hoyISO().slice(0, 7);
  return {
    todos,
    vencidos: todos.filter(x => x.e.clave === 'vencido'),
    tocan: todos.filter(x => x.e.clave === 'toca'),
    porCobrar: sumaMontos(todos.filter(x => x.estado === 'pendiente')),
    cobrado: sumaMontos(todos.filter(x => x.estado === 'pagado' && x.pagado_at && aISO(new Date(x.pagado_at)).slice(0, 7) === mes))
  };
}
function bloqueCobranza() {
  const f = S.cobFiltro || 'pendientes';
  const { todos, vencidos, tocan, cobrado } = cuentasCobranza(), suma = sumaMontos;
  const orden = { vencido: 0, toca: 1, pendiente: 2, pagado: 3, no_aplica: 4 };
  const lista = todos.filter(x => f === 'todos' || (f === 'pendientes' ? x.estado === 'pendiente' : x.estado === 'pagado'))
    .sort((a, b) => (orden[a.e.clave] - orden[b.e.clave]) || (f === 'pagados' ? b.vence.localeCompare(a.vence) : a.vence.localeCompare(b.vence)));
  const opt = (v, t) => `<option value="${v}"${f === v ? ' selected' : ''}>${t}</option>`;
  return `<section class="rep">
    <div class="rep-cab"><h2><span>Cobranza</span></h2><select class="campo-in" data-cambio="cob-filtro" aria-label="Filtrar cobros">${opt('pendientes', 'Por cobrar')}${opt('pagados', 'Pagados')}${opt('todos', 'Todos')}</select></div>
    <div class="rep-datos">
      <div class="rep-dato${vencidos.length ? ' malo' : ''}"><b>${vencidos.length}</b><span>Vencidos${vencidos.length ? ` · ${esc(dinero(suma(vencidos)))}` : ''}</span></div>
      <div class="rep-dato"><b>${tocan.length}</b><span>Toca cobrar ahora</span></div>
      <div class="rep-dato dinero"><b>${esc(dinero(suma(todos.filter(x => x.estado === 'pendiente'))))}</b><span>Por cobrar</span></div>
      <div class="rep-dato dinero"><b>${esc(dinero(cobrado))}</b><span>Cobrado este mes</span></div>
    </div>
    ${lista.length ? `<div class="fac-lista">${lista.map(x => {
      const wa = x.estado === 'pendiente' ? waRecordatorio(x, x.cl, x.cy) : '';
      return `<div class="fac cob-${x.e.clave}"><div>
          <div class="fac-tit">${esc(x.cl ? x.cl.name : 'Cliente')}${x.cy ? ` · ${esc(x.cy.name)}` : ''}</div>
          <div class="fac-meta">${x.monto ? esc(dinero(x.monto)) : 'Sin monto'} · ${esc(x.e.txt)}</div></div>
        <div class="fac-der"><span class="estado e-cob-${x.e.clave}">${x.e.et}</span>
          ${x.estado === 'pendiente' ? `${wa ? `<a class="btn btn-s" href="${esc(wa)}" target="_blank" rel="noopener noreferrer">Recordar</a>` : ''}
            <button class="btn btn-s btn-p" data-accion="cobro-transfer" data-id="${x.id}">Pagó por transferencia</button>
            <button class="btn btn-s btn-t" data-accion="cobro-noaplica" data-id="${x.id}">No aplica</button>`
          : x.metodo !== 'tarjeta' ? `<button class="btn btn-s btn-t" data-accion="cobro-deshacer" data-id="${x.id}">Deshacer</button>` : ''}</div></div>`;
    }).join('')}</div>`
      : `<p class="rep-txt">${f === 'pagados' ? 'Todavía no hay cobros pagados.' : 'Nada por cobrar. Cada mes de un cliente con mensualidad aparece aquí.'}</p>`}
    <p class="nota" style="margin:.9rem 0 0">Cada mes de un cliente con mensualidad genera su cobro, que vence el día de su entrega, con 5 días de tolerancia. Los pagos con tarjeta se marcan solos. Te llega un Telegram el día que toca cobrar y cuando se vence.</p>
  </section>`;
}

// ---------- Revisión del mes (admin): en revisión del cliente o con ajustes pedidos ----------
function avisosRevision() {
  const h = hoyISO();
  const enRev = S.ciclos.filter(c => c.revision_estado === 'revision' && c.revision_hasta >= h);
  const ajustes = S.ciclos.filter(c => c.revision_estado === 'ajustes');
  if (!enRev.length && !ajustes.length) return '';
  const fila = (c, txt, acciones) => { const cl = clientePorId(c.client_id); return `<div class="rev-fila"><div><b>${esc(cl ? cl.name : 'Cliente')} · ${esc(c.name)}</b><span class="nota">${txt}</span></div><div class="controles">${acciones}</div></div>`; };
  return `<section class="rep revs">
    ${enRev.map(c => {
      const cl = clientePorId(c.client_id), tel = cl && waDe(cl.contact_phone), n = S.videos.filter(v => v.cycle_id === c.id).length;
      const pila = String((cl && cl.contact_name) || '').split(/\s+/)[0];
      const wa = tel ? `https://wa.me/${tel}?text=${encodeURIComponent(`Hola${pila ? ' ' + pila : ''}, ¡ya ${n === 1 ? 'está tu video' : `están tus ${n} videos`} de ${c.name}! Míralos en tu portal: ${PORTAL_URL}\n\nTienes hasta el ${fLarga(c.revision_hasta)} para pedirme una ronda de ajustes, en un solo mensaje, desde ahí mismo. Si todo está bien, apruébalos; si no me pides nada, se aprueban solos.`)}` : '';
      return fila(c, `En revisión del cliente hasta el ${esc(fLarga(c.revision_hasta))}. Si no pide ajustes, se aprueba solo.`,
        `${wa ? `<a class="btn btn-s btn-p" href="${esc(wa)}" target="_blank" rel="noopener noreferrer">Avisarle por WhatsApp</a>` : ''}<button class="btn btn-s btn-t" data-accion="ciclo-aprobar" data-id="${c.id}">Marcar aprobado</button>`);
    }).join('')}
    ${ajustes.map(c => fila(c, `Pidió ajustes el ${esc(fCorta(aISO(new Date(c.ajustes_at))))}${c.ajustes_general ? `: “${esc(c.ajustes_general)}”` : ''}. Los videos con ajuste regresaron a edición; al entregarlos, el mes queda aprobado.`,
      `<button class="btn btn-s btn-t" data-accion="ciclo-aprobar" data-id="${c.id}">Marcar ajustes entregados</button>`)).join('')}
  </section>`;
}

// ---------- Revisión del mes (cliente) ----------
function panelRevision(c, previa) {
  if (c.revision_estado === 'revision') {
    return `<section class="revision"><div><p class="rep-et">Revisa tus videos</p><h2>Tienes hasta el ${esc(fLarga(c.revision_hasta))}</h2>
      <p>Si algo no te convence, pide tus ajustes en un solo mensaje. Si todo está bien, apruébalos. Si no pides nada, se aprueban solos.</p></div>
      <div class="controles"><button class="btn btn-p" data-accion="aprobar-mes" data-id="${c.id}"${previa ? ' disabled' : ''}>Aprobar mis videos</button>
        <button class="btn" data-accion="pedir-ajustes" data-id="${c.id}"${previa ? ' disabled' : ''}>Pedir ajustes</button></div></section>`;
  }
  if (c.revision_estado === 'ajustes') {
    const pedidos = (c.videos || []).filter(v => v.ajuste_cliente);
    return `<section class="revision espera"><div><p class="rep-et">Tus ajustes</p><h2>Los estamos haciendo</h2>
      <p>Los pediste el ${esc(fCorta(aISO(new Date(c.ajustes_at))))}. Te avisamos en cuanto estén.</p>
      ${pedidos.length || c.ajustes_general ? `<ul>${pedidos.map(v => `<li><b>${pad(v.number)}</b> ${esc(v.ajuste_cliente)}</li>`).join('')}${c.ajustes_general ? `<li>${esc(c.ajustes_general)}</li>` : ''}</ul>` : ''}</div></section>`;
  }
  if (c.revision_estado === 'aprobado') {

  }
  return '';
}
function modalPedirAjustes(id) {

    <div class="d-cab"><div><h2 class="d-titulo">Pedir ajustes</h2><p class="d-sub">${esc(c.name)} · tienes hasta el ${esc(fLarga(c.revision_hasta))}. Es una sola ronda: escribe todo lo que quieras cambiar de una vez.</p></div></div>
    <div class="resumen">Se puede ajustar: cortes, textos en pantalla, subtítulos, música o el texto de publicación. Los errores de ortografía, de datos o de logotipo se corrigen siempre. Lo que ya se grabó no se regraba ni cambia lo que dice.</div>
    ${(c.videos || []).map(v => `<div class="campo"><label for="aj-${v.id}">${pad(v.number)} · ${esc(v.title || 'Sin título')}</label>

    <div class="campo"><label for="aj-general">¿Algo general? <span class="opc">(opcional)</span></label><textarea class="aj" id="aj-general" name="general" maxlength="1500"></textarea></div>
    <div class="d-pie"><button type="button" class="btn" data-accion="cerrar">Cancelar</button><button type="submit" class="btn btn-p">Enviar mis ajustes</button></div>

// Vista previa del admin: lo mismo que regresaría client_pagos para ese cliente
function pagosLocal(idCliente) {
  const d = S.pagoDatos, facs = S.facturas.filter(f => f.client_id === idCliente), cl = clientePorId(idCliente);
  const props = new Set((S.propuestas || []).filter(x => x.client_id === idCliente).map(x => x.id));
  return {
    datos: d ? { banco: d.banco, titular: d.titular, clabe: d.clabe, cuenta: d.cuenta, rfc: d.rfc, concepto: d.concepto, notas: d.notas } : null,
    facturas: facs.map(f => Object.assign({}, f, { factura_url: f.estado === 'emitida' ? f.factura_url : null })),
    fiscales: facs[0] || null,
    mensualidad: cl ? cl.mensualidad : null, iva: cl ? cl.iva : null,
    stripe: !!(S.ajustes && S.ajustes.stripe_activo),
    pagos: (S.pagosStripe || []).filter(x => x.client_id === idCliente || props.has(x.propuesta_id)).map(x => ({ fecha: x.created_at, tipo: x.tipo, monto: x.monto })),
    cobros: (S.cobros || []).filter(x => x.client_id === idCliente && x.estado !== 'no_aplica').map(x => Object.assign({}, x, { mes: (S.ciclos.find(c => c.id === x.cycle_id) || {}).name }))
      .sort((a, b) => b.vence.localeCompare(a.vence))
  };
}

function celdaEditor(p) {
  const cls = clientesDeEditor(p.id);
  return `<button class="btn btn-s${cls.length ? '' : ' btn-p'}" data-accion="editor-clientes" data-id="${p.id}">${cls.length ? 'Cambiar clientes' : 'Asignar clientes'}</button>
    <div class="nota">${cls.length ? cls.map(cl => esc(cl.name)).join(', ') : 'Sin clientes: no ve nada todavía'}</div>`;
}

// ---------- Vista del cliente -----------------------------------------
function vistaCliente(P, previa) {
  if (!P || !P.client) {
    return `<div class="caja-vacia"><p>Tu cuenta ya está activa, pero falta ligarla a tu empresa. Avísale a Connect Studios y en cuanto lo hagan verás aquí tus videos.</p><button class="btn" data-accion="actualizar">Revisar de nuevo</button></div>`;
  }
  const ciclos = P.cycles || [];
  // Resultados: solo el reporte más reciente, en su propia pestaña
  const ultimo = ultimoReporte(ciclos);
  const nuevo = !previa && ultimo && reporteVisto() !== claveReporte(ultimo);
  const pest = S.pestanaCli;
  const tab = (id, txt) => `<button role="tab" aria-selected="${pest === id}" data-accion="cli-pestana" data-id="${id}">${txt}</button>`;
  const pestanas = `<div class="cli-tabs" role="tablist" aria-label="Secciones">
      ${tab('videos', 'Mis videos')}${tab('estilo', 'Mi estilo' + (P.estilo && P.estilo.confirmado_at ? '' : ' <span class="cli-nuevo">Por definir</span>'))}${tab('resultados', 'Resultados' + (nuevo ? ' <span class="cli-nuevo">Nuevo</span>' : ''))}${tab('pagos', 'Pagos')}
    </div>`;
  if (pest === 'estilo') {
    S.estiloCtx = { modo: previa ? 'previa' : 'cliente' };
    return `${pestanas}<div class="cli-panel" role="tabpanel">${vistaEstilo(P.estilo, previa ? 'previa' : 'cliente', P.client.id)}</div>`;
  }
  if (pest === 'pagos') {
    return `${pestanas}<div class="cli-panel" role="tabpanel">${vistaPagosCliente(previa ? pagosLocal(S.previa) : S.pagosCli, P, previa)}</div>`;
  }
  if (pest === 'resultados') {
    return `${pestanas}<div class="cli-panel" role="tabpanel">${ultimo
      ? `<p class="rep-intro">Los números de tu mes más reciente de publicaciones. Cada mes que cerramos, aquí aparece el nuevo.</p>${bloqueReporte(ultimo.report, ultimo.name)}`
      : `<div class="caja-vacia"><p>Aquí vas a ver cómo le fue a tu contenido: cuántas personas lo vieron, el video que mejor funcionó y qué ajustamos. Tus primeros resultados llegan al cerrar tu primer mes de publicaciones.</p><button class="btn" data-accion="cli-pestana" data-id="videos">Ver mis videos</button></div>`}</div>`;
  }
  if (!ciclos.length) {
    return `${pestanas}<div class="cli-panel" role="tabpanel"><section class="hero-cli"><p class="cli-empresa">${esc(P.client.name)}</p><h1 class="mes-grande">Bienvenido</h1></section>
      <div class="caja-vacia"><p>Aún no hay meses programados. Cuando agendemos tu grabación, aquí verás cada video, del guion a la entrega.</p></div></div>`;
  }
  const c = ciclos.find(x => x.id === S.cicloCliente) || ciclos[0];
  const vs = c.videos || [];
  const conGuion = vs.filter(v => v.status !== 'sin_guion').length;
  const entregados = vs.filter(v => v.status === 'entregado').length;
  let mensaje, cuenta = conGuion, que = 'guiones';
  if (vs.length && entregados === vs.length) { mensaje = `Tus ${vs.length} videos están entregados.`; cuenta = entregados; que = 'entregados'; }
  else if (aISO(hoy()) > c.record_end || entregados) { mensaje = `Estamos editando. Van ${entregados} de ${vs.length} entregados.`; cuenta = entregados; que = 'entregados'; }
  else if (conGuion < vs.length) mensaje = `Llevas ${conGuion} de ${vs.length} guiones. Súbelos a más tardar el ${fLarga(c.script_due || c.record_start)}.`;
  else mensaje = `Tus ${vs.length} guiones están listos para grabar.`;
  return `${pestanas}<div class="cli-panel" role="tabpanel">
    ${(G => { const x = G && (G.cobros || []).filter(k => k.estado === 'pendiente').sort((a, b) => a.vence.localeCompare(b.vence))[0]; const e = x && estadoCobro(x);
      return e && (e.clave === 'toca' || e.clave === 'vencido') ? `<p class="aviso-linea${e.clave === 'vencido' ? ' malo' : ''}">${e.clave === 'vencido' ? 'Tu mensualidad está vencida' : 'Toca pagar tu mensualidad'}${x.monto ? `: ${esc(dinero(x.monto))}` : ''}. <button class="f-ver" data-accion="cli-pestana" data-id="pagos">Pagar ahora</button></p>` : ''; })(previa ? pagosLocal(S.previa) : S.pagosCli)}
    ${!(P.estilo && P.estilo.confirmado_at) ? `<p class="aviso-linea">Elige tu estilo visual para que tus videos salgan como te gustan. <button class="f-ver" data-accion="cli-pestana" data-id="estilo">Elegir mi estilo</button></p>` : ''}
    ${ciclos.length > 1 ? `<div class="mes-tabs" role="group" aria-label="Meses">${ciclos.map(x => `<button data-accion="ver-mes" data-id="${x.id}" aria-pressed="${x.id === c.id}">${esc(x.name)}</button>`).join('')}</div>` : ''}
    <section class="hero-cli">
      <p class="cli-empresa">${esc(P.client.name)}</p>
      <h1 class="mes-grande">${esc(c.name)}</h1>
      <div class="mes-info">
        ${c.script_due && aISO(hoy()) <= c.record_start && conGuion < vs.length ? `<div class="clave">Tus guiones, a más tardar<b>el ${esc(fLarga(c.script_due))}</b></div>` : ''}
        <div>Grabamos<b>${esc(diasGrab(c.record_start, c.record_end, true))}</b></div>
        <div class="clave">Recibes tus videos<b>el ${esc(fLarga(c.delivery_date))}</b></div>
        ${urlSegura(P.client.shared_url) ? `<div>Carpeta compartida<b>${enlace(P.client.shared_url, 'Abrir en Drive')}</b></div>` : ''}
      </div>
      ${urlSegura(c.delivery_url) ? `<div class="hero-cta"><a class="btn btn-p btn-grande" href="${esc(urlSegura(c.delivery_url))}" target="_blank" rel="noopener noreferrer">▶ Ver y descargar tus videos</a>
        <span class="nota">Todos los videos entregados de ${esc(c.name)}, en una carpeta de Drive.</span></div>` : ''}
    </section>
    ${panelRevision(c, previa)}
    <div class="avance-cli">
      <b class="avance-num" aria-label="${cuenta} de ${vs.length} ${que}">${pad(cuenta)}<small>/${pad(vs.length)}</small></b>
      <div class="avance-txt"><span>${esc(mensaje)}</span>${tira(vs)}</div>
    </div>
    <div class="hoja">${vs.map(v => cuadro(v, previa)).join('')}</div>
    <section class="rep fechas-mes" style="margin-top:1.6rem">
      <div class="rep-cab"><h2>Fechas de <span>${esc(c.name)}</span></h2></div>
      ${htmlAgenda(fechasCiclo(c, vs).map(e => ({ f: e.f, tipo: e.tipo, txt: e.k === 'publica' ? txtPublica(e) : TXT_FECHA_CLIENTE[e.k] })))}
    </section>
    <p class="nota" style="margin-top:1.25rem">${previa ? 'En esta vista previa, tocar un video abre su ficha interna.' : 'Toca un video para subir o cambiar su guion. Cuando esté entregado, desde ahí lo abres.'}</p>
  </div>`;
}

// El reporte que ve el cliente: el del mes más reciente que tenga uno
function ultimoReporte(ciclos) {
  return (ciclos || []).filter(x => x.report).sort((a, b) => b.delivery_date.localeCompare(a.delivery_date))[0] || null;
}
// "Nuevo" en la pestaña hasta que el cliente abre ese reporte (se recuerda en su navegador)
const claveReporte = c => `${c.id}:${(c.report && (c.report.updated_at || c.report.created_at)) || ''}`;
function reporteVisto() { try { return localStorage.getItem('portal.reporteVisto'); } catch (e) { return null; } }
function marcarReporteVisto(c) { try { localStorage.setItem('portal.reporteVisto', claveReporte(c)); } catch (e) { /* sin almacenamiento */ } }

// Reporte mensual: lo que se publicó, cuánto alcanzó, el mejor video y qué se ajusta
const numero = n => (n === null || n === undefined || n === '') ? null : Number(n).toLocaleString('es-MX');
function bloqueReporte(r, mes) {
  const datos = [[r.publicados, r.publicados === 1 ? 'Video publicado' : 'Videos publicados'], [r.alcance, 'Personas alcanzadas'],
    [r.vistas, 'Reproducciones'], [r.interacciones, 'Interacciones']].filter(([n]) => numero(n) !== null);
  const periodo = r.periodo_inicio && r.periodo_fin ? rango(r.periodo_inicio, r.periodo_fin) : '';
  const mejorUrl = urlSegura(r.mejor_url);
  const hayMejor = r.mejor_titulo || mejorUrl || r.mejor_porque;
  return `<section class="rep" aria-label="Resultados de ${esc(mes)}">
    <div class="rep-cab"><h2>Resultados <span>${esc(mes)}</span></h2>
      ${r.borrador ? '<span class="rep-borrador">Borrador: el cliente todavía no lo ve</span>' : periodo ? `<span class="nota">Publicaciones del ${esc(periodo)}</span>` : ''}</div>
    ${datos.length ? `<div class="rep-datos">${datos.map(([n, txt]) => `<div class="rep-dato"><b>${esc(numero(n))}</b><span>${txt}</span></div>`).join('')}</div>` : ''}
    ${hayMejor || r.ajustes ? `<div class="rep-grid">
      ${hayMejor ? `<div class="rep-caja mejor"><p class="rep-et">El video que mejor funcionó</p>
        ${r.mejor_titulo ? `<p class="rep-tit">${esc(r.mejor_titulo)}</p>` : ''}
        ${numero(r.mejor_alcance) !== null || numero(r.mejor_vistas) !== null ? `<p class="rep-cifras">
          ${numero(r.mejor_alcance) !== null ? `<span><b>${esc(numero(r.mejor_alcance))}</b> personas</span>` : ''}
          ${numero(r.mejor_vistas) !== null ? `<span><b>${esc(numero(r.mejor_vistas))}</b> reproducciones</span>` : ''}</p>` : ''}
        ${r.mejor_porque ? `<p class="rep-txt">${esc(r.mejor_porque)}</p>` : ''}
        ${mejorUrl ? `<a class="btn btn-s" href="${esc(mejorUrl)}" target="_blank" rel="noopener noreferrer">▶ Ver el video</a>` : ''}
      </div>` : ''}
      ${r.ajustes ? `<div class="rep-caja ajuste"><p class="rep-et">Lo que ajustamos el próximo mes</p><p class="rep-txt">${esc(r.ajustes)}</p></div>` : ''}
    </div>` : ''}
  </section>`;
}

const ACCION_CUADRO = { sin_guion: '+ Agregar guion', guion: 'Ver o cambiar guion', entregado: '▶ Ver video' };
function cuadro(v, previa) {
  const accion = ACCION_CUADRO[v.status];
  return `<button class="cuadro s-${esc(v.status)}" data-foto="${esc(v.status)}" data-accion="${previa ? 'abrir-video' : 'abrir-guion'}" data-id="${v.id}" aria-label="Video ${v.number}: ${esc(v.title || 'sin título')}. ${esc(ESTADOS_CLIENTE[v.status] || '')}">
    <span class="c-num">${pad(v.number)}</span>
    ${pill(v.status, true)}
    <span class="c-pie">
      ${v.title ? `<span class="c-tit">${esc(v.title)}</span>` : ''}
      ${v.programado_at ? `<span class="c-pub">${new Date(v.programado_at) > new Date() ? 'Se publica' : 'Publicado'} el ${esc(fDia(aISO(new Date(v.programado_at))))}</span>` : ''}
      ${accion ? `<span class="c-accion" aria-hidden="true">${accion}</span>` : ''}
    </span>
  </button>`;
}

function portalLocal(idCliente) {
  const cl = clientePorId(idCliente);
  const cycles = S.ciclos.filter(c => c.client_id === idCliente)
    .sort((a, b) => b.delivery_date.localeCompare(a.delivery_date))
    .map(c => ({
      id: c.id, name: c.name, record_start: c.record_start, record_end: c.record_end, script_due: c.script_due, delivery_date: c.delivery_date,
      revision_estado: c.revision_estado === 'revision' && c.revision_hasta < hoyISO() ? 'aprobado' : c.revision_estado,
      revision_hasta: c.revision_hasta, ajustes_at: c.ajustes_at, ajustes_general: c.ajustes_general, aprobado_at: c.aprobado_at,
      aprobado_por: c.revision_estado === 'revision' && c.revision_hasta < hoyISO() ? 'tiempo' : c.aprobado_por,
      // Igual que client_portal: la carpeta aparece cuando ya hay algún video entregado
      delivery_url: S.videos.some(v => v.cycle_id === c.id && v.status === 'entregado') ? c.delivery_url : null,
      videos: S.videos.filter(v => v.cycle_id === c.id).sort((a, b) => a.number - b.number).map(v => ({
        id: v.id, number: v.number, title: v.title, script_url: v.script_url, script_text: v.script_text,
        status: ['edicion', 'revision', 'listo'].includes(v.status) ? 'produccion' : v.status,
        final_url: v.status === 'entregado' ? v.final_url : null,
        copy: v.status === 'entregado' ? v.copy : null,
        portada_url: v.status === 'entregado' ? v.portada_url : null,
        ajuste_cliente: v.ajuste_cliente, programado_at: v.programado_at
      })),
      // A diferencia de client_portal, aquí se ve también el borrador para revisarlo antes de publicarlo
      report: (r => r ? Object.assign({}, r, { borrador: !r.publicado }) : null)(S.reportes.find(r => r.cycle_id === c.id))
    })).filter(c => c.videos.length);
  return { client: cl ? { id: cl.id, name: cl.name, shared_url: cl.shared_url } : null, estilo: estiloFila(idCliente), cycles };
}

function vistaPrevia() {
  const P = portalLocal(S.previa);
  const cl = clientePorId(S.previa);
  return `<div class="aviso-vista"><span>Así ve el portal ${esc(cl ? cl.name : 'tu cliente')}.</span><button class="btn btn-s" data-accion="ir" data-id="clientes">Salir de la vista previa</button></div>
    ${vistaCliente(P, true)}`;
}

// ---------- Ventanas ---------------------------------------------------
const raizModal = document.getElementById('modal');
let alCerrarModal = null, focoPrevio = null;

function abrirModal(html, alMontar, alCerrar) {
  if (raizModal.innerHTML) cerrarModal();
  focoPrevio = document.activeElement;
  alCerrarModal = alCerrar || null;
  raizModal.innerHTML = `<div class="velo"><div class="dialogo" role="dialog" aria-modal="true">${html}</div></div>`;
  const dlg = raizModal.querySelector('.dialogo');
  if (alMontar) alMontar(dlg);
  const primero = dlg.querySelector('input:not([disabled]):not([type=checkbox]),textarea:not([disabled]),select:not([disabled]),button');
  if (primero) primero.focus();
}

function cerrarModal() {
  if (!raizModal.innerHTML) return;
  raizModal.innerHTML = '';
  const f = alCerrarModal; alCerrarModal = null;
  if (f) f();
  if (focoPrevio && document.contains(focoPrevio) && focoPrevio.focus) focoPrevio.focus();
}

let resolverConfirmacion = null;
function confirmar(titulo, texto, ok, peligro) {
  return new Promise(res => {
    resolverConfirmacion = res;
    abrirModal(`<div class="d-cab"><div><h2 class="d-titulo">${esc(titulo)}</h2>${texto ? `<p class="d-sub">${esc(texto)}</p>` : ''}</div></div>
      <div class="d-pie"><button class="btn" data-accion="conf-no">Cancelar</button><button class="btn ${peligro ? 'btn-peligro' : 'btn-p'}" data-accion="conf-si">${esc(ok || 'Confirmar')}</button></div>`,
      null, () => { if (resolverConfirmacion) { resolverConfirmacion(false); resolverConfirmacion = null; } });
  });
}

// La muestra del estilo: un cuadro de video con sus subtítulos y su portada
let turnoMuestra = 0;
async function pintarMuestras() {
  if (!document.querySelector('canvas[data-portada-muestra], canvas[data-perfil-muestra]') || !S.estiloMuestra) return;
  const mio = ++turnoMuestra, e = S.estiloMuestra;
  const [fondos, logo] = await Promise.all([Promise.all(MUESTRAS.map(imagen)), imagen(urlSegura(e.logo_url))]);
  const tmp = document.createElement('canvas');
  await dibujarPortada(tmp, { fuente: fondos[0], titulo: TITULOS_MUESTRA[0], estilo: e, logo });
  if (mio !== turnoMuestra) return;
  document.querySelectorAll('canvas[data-portada-muestra]').forEach(cv => { cv.width = tmp.width; cv.height = tmp.height; cv.getContext('2d').drawImage(tmp, 0, 0); });
  // El perfil: seis portadas recortadas como las enseña Instagram (3:4)
  if (!document.querySelector('canvas[data-perfil-muestra]')) return;
  const grid = document.createElement('canvas'); grid.width = 720; grid.height = 640;
  const gx = grid.getContext('2d'); gx.fillStyle = '#000'; gx.fillRect(0, 0, 720, 640);
  for (let i = 0; i < 6; i++) {
    const t = i ? document.createElement('canvas') : tmp;
    if (i) await dibujarPortada(t, { fuente: fondos[i % MUESTRAS.length], titulo: TITULOS_MUESTRA[i], estilo: e, logo });
    if (mio !== turnoMuestra) return;
    gx.drawImage(t, 0, PORTADA.arriba, PORTADA.w, PORTADA.abajo - PORTADA.arriba, (i % 3) * 240 + 1, Math.floor(i / 3) * 320 + 1, 238, 318);
  }
  document.querySelectorAll('canvas[data-perfil-muestra]').forEach(cv => { cv.width = 720; cv.height = 640; cv.getContext('2d').drawImage(grid, 0, 0); });
}

// Pestaña "Mi estilo": el cliente va paso por paso (una decisión por pantalla) y al final
// revisa su resumen y lo confirma. En la ventana del admin se ve todo junto para ajustarlo rápido.
const PASOS_ESTILO = [
  ['color', 'El color de tu marca', 'Va en tus portadas y en lo que resalta en pantalla.', 'Color'],
  ['fuente', 'La letra de tu marca', 'Se usa en tus portadas, títulos y subtítulos.', 'Letra'],
  ['portada', 'Tu portada', 'Cómo se ve cada video en tu perfil. A la derecha ves tu perfil completo.', 'Portada'],
  ['logo_uso', 'Tu logo', 'Súbelo y elige dónde aparece.', 'Logo']
];
function vistaEstilo(fila, modo, idCliente) {
  const e = conDefecto(fila), bloq = !!e.confirmado_at;
  const edita = modo === 'admin' || (modo === 'cliente' && !bloq);
  S.estiloMuestra = e;
  const color = String(e.color).toUpperCase(), f = FUENTES[e.fuente] || FUENTES.anton;
  const op = (campo, val, cont, clase = '') => `<button type="button" class="op${clase}" data-accion="estilo-op" data-campo="${campo}" data-valor="${esc(val)}" aria-pressed="${String(campo === 'color' ? color === val : e[campo] === val)}"${edita ? '' : ' disabled'}>${cont}</button>`;
  const opciones = campo => { const ops = OPCIONES_ESTILO.find(o => o[0] === campo)[3]; return `<div class="op-grid" style="--n:${Math.min(4, Object.keys(ops).length)}">${Object.entries(ops).map(([k, [t, d]]) => op(campo, k, `<b>${esc(t)}</b><span>${esc(d)}</span>`)).join('')}</div>`; };
  const cuerpos = {
    color: `<div class="swatches">${COLORES.map(c => op('color', c, `<span style="background:${c}"></span>`, ' sw')).join('')}
      <label class="sw-libre${COLORES.includes(color) ? '' : ' activo'}"><input type="color" value="${esc(e.color)}" data-cambio="estilo-color"${edita ? '' : ' disabled'} aria-label="Otro color"><span>${COLORES.includes(color) ? 'Otro' : esc(color)}</span></label></div>`,
    fuente: `<div class="op-grid" style="--n:4">${Object.entries(FUENTES).map(([k, x]) => op('fuente', k, `<b class="op-letra" style="font-family:${esc(x.css)};font-weight:${x.peso};text-transform:${x.mayus ? 'uppercase' : 'none'}">Título</b><span>${esc(x.tipo)} · ${esc(x.nombre)}</span>`)).join('')}</div>`,
    portada: opciones('portada'),
    logo_uso: `<div class="logo-subir">${urlSegura(e.logo_url) ? `<img src="${esc(e.logo_url)}" alt="Tu logo">` : '<span class="logo-vacio">Todavía sin logo</span>'}
      ${edita ? `<label class="btn btn-s">${e.logo_url ? 'Cambiar logo' : 'Subir logo'}<input type="file" accept="image/png,image/jpeg" data-cambio="estilo-logo" hidden></label><span class="nota">PNG con fondo transparente, de preferencia.</span>` : ''}</div>${opciones('logo_uso')}`
  };
  const notas = `<div class="campo" style="margin:0"><label for="est-notas">¿Algo más? <span class="opc">(opcional)</span></label>
    <textarea id="est-notas" data-cambio="estilo-notas" maxlength="1000" placeholder="Ej. Mi logo siempre en blanco; nada de rosa ni morado."${edita ? '' : ' disabled'}>${esc(e.notas || '')}</textarea></div>`;
  const cab = (i, t, sub, clase = '') => `<div class="est-cab"><span class="est-n">${String(i + 1).padStart(2, '0')}</span><div><h3>${t}</h3>${sub ? `<p>${sub}</p>` : ''}</div></div>`;
  const muestra = acciones => `<aside class="est-muestra"><p class="rep-et">Tu portada</p>
      <div class="tel"><canvas data-portada-muestra aria-label="Muestra de tu portada"></canvas></div>
      <p class="rep-et" style="margin-top:1.1rem">Así se ve tu perfil</p>
      <canvas class="perfil-muestra" data-perfil-muestra width="720" height="640" aria-label="Muestra de tu perfil con seis portadas"></canvas>
      ${acciones ? `<div class="est-acciones" style="margin-top:1rem">${acciones}</div>` : ''}</aside>`;

  if (modo === 'admin') {
    const acciones = bloq ? `<button class="btn" data-accion="estilo-desbloquear" data-id="${esc(idCliente)}">Desbloquear para que lo cambie</button><p class="nota">Tú lo puedes ajustar aunque esté confirmado.</p>`
      : '<p class="nota">El cliente todavía no lo confirma. Lo que cambies aquí lo ve en su portal.</p>';
    return `${bloq ? `<div class="est-ok">✓ Confirmado el ${esc(fCorta(e.confirmado_at))}${e.confirmado_por ? ` por ${esc(e.confirmado_por)}` : ''}.</div>` : ''}<div class="est">
      <div>${PASOS_ESTILO.map(([k, t, sub], i) => `<section class="est-bloque">${cab(i, t, sub)}${cuerpos[k]}</section>`).join('')}<section class="est-bloque">${notas}</section></div>
      ${muestra(acciones)}</div>`;
  }

  const total = PASOS_ESTILO.length;
  if (S.estiloPaso === undefined) S.estiloPaso = fila ? total : 0;   // si ya eligió algo, arranca en su resumen
  const paso = bloq ? total : Math.max(0, Math.min(S.estiloPaso, total));
  const progreso = bloq ? '' : `<nav class="est-progreso" aria-label="Pasos">${PASOS_ESTILO.map(([, , , corto], i) => `<button type="button" data-accion="estilo-paso" data-id="${i}" class="${i < paso ? 'hecho' : ''}"${i === paso ? ' aria-current="step"' : ''}>${i + 1}. ${esc(corto)}</button>`).join('')}
    <button type="button" data-accion="estilo-paso" data-id="${total}"${paso === total ? ' aria-current="step"' : ''}>Resumen</button></nav>`;
  const wa = CONFIG.WHATSAPP ? `https://wa.me/${encodeURIComponent(CONFIG.WHATSAPP)}?text=${encodeURIComponent('Hola, quiero cambiar algo de mi estilo visual.')}` : '';
  const intro = bloq ? `<div class="est-intro"><h2>Tu estilo visual</h2><p>Así se editan todos tus videos. Si quieres cambiar algo, escríbenos y lo vemos juntos.</p></div>
      <div class="est-ok">✓ Confirmado el ${esc(fCorta(e.confirmado_at))}${e.confirmado_por ? ` por ${esc(e.confirmado_por)}` : ''}.${modo === 'cliente' && wa ? ` <a class="btn btn-s" href="${esc(wa)}" target="_blank" rel="noopener noreferrer">Quiero cambiar algo</a>` : ''}</div>`
    : `<div class="est-intro"><h2>Tu estilo visual</h2><p>Cuatro decisiones rápidas y listo. Con esto armamos tus portadas y tus textos en pantalla; tu editor lo sigue en cada video.</p></div>`;
  let contenido;
  if (paso < total) {
    const [k, t, sub] = PASOS_ESTILO[paso];
    contenido = `<section class="est-bloque est-paso">${cab(paso, t, sub)}${cuerpos[k]}</section>
      <div class="est-nav">${paso ? `<button class="btn" data-accion="estilo-paso" data-id="${paso - 1}">Atrás</button>` : '<span></span>'}
        <button class="btn btn-p" data-accion="estilo-paso" data-id="${paso + 1}">${paso === total - 1 ? 'Ver mi resumen' : 'Siguiente'}</button></div>`;
  } else {
    const filas = [
      ['Color', `<span class="chip"><i style="background:${esc(color)}"></i>${esc(color)}</span>`],
      ['Letra', `<span style="font-family:${esc(f.css)};font-weight:${f.peso}">${esc(f.nombre)}</span> · ${esc(f.tipo)}`],
      ['Portada', esc(nombreOpcion('portada', e.portada))],
      ['Logo', `${esc(nombreOpcion('logo_uso', e.logo_uso))}${urlSegura(e.logo_url) ? `<img src="${esc(e.logo_url)}" alt="">` : e.logo_uso !== 'sin' ? ' · <span class="error-linea">falta subirlo</span>' : ''}`]
    ];
    contenido = `<section class="est-bloque est-paso"><div class="est-cab"><div><h3>${bloq ? 'Tu estilo' : 'Tu resumen'}</h3>${bloq ? '' : '<p>Revisa que todo esté como lo quieres. Puedes cambiar cualquier cosa antes de confirmar.</p>'}</div></div>
      <div class="est-resumen">${filas.map(([nom, val], i) => `<div class="est-fila"><span>${nom}</span><div>${val}</div>${edita ? `<button class="f-ver" data-accion="estilo-paso" data-id="${i}">Cambiar</button>` : '<span></span>'}</div>`).join('')}</div>
      ${edita || e.notas ? notas : ''}
      ${modo === 'cliente' && !bloq ? `<div class="est-confirmar"><button class="btn btn-p btn-grande" data-accion="estilo-confirmar">Confirmar mi estilo</button><p class="nota">Al confirmarlo queda fijo para tu editor. Si después quieres cambiar algo, lo vemos juntos.</p></div>` : ''}</section>`;
  }
  return `${intro}${progreso}<div class="est"><div>${contenido}</div>${muestra('')}</div>`;
}

// Guardar un cambio de estilo: se ve al instante y luego se guarda
async function cambiarEstilo(cambios) {
  const ctx = S.estiloCtx; if (!ctx) return;
  try {
    if (ctx.modo === 'cliente') {
      S.portal.estilo = Object.assign(conDefecto(S.portal.estilo), cambios);
      render();
      S.portal.estilo = await q(sb.rpc('client_estilo_guardar', { p: cambios }));
      render();
    } else if (ctx.modo === 'admin') {
      const fila = await q(sb.from('estilos').upsert(Object.assign({ client_id: ctx.id }, cambios, { updated_at: new Date().toISOString() })).select().single());
      S.estilos = (S.estilos || []).filter(e => e.client_id !== ctx.id).concat(fila);
      refrescarModalEstilo();
    }
  } catch (e) {
    aviso(/estilo_confirmado/.test(String(e && e.message)) ? 'Tu estilo ya está confirmado. Escríbenos si quieres cambiar algo.' : humano(e), true);
    if (ctx.modo === 'cliente') recargar();
  }
}
async function subirLogo(input) {
  const file = input.files && input.files[0]; if (!file || !S.estiloCtx) return;
  if (!/^image\/(png|jpeg)$/.test(file.type)) return aviso('Sube tu logo en PNG o JPG.', true);
  if (file.size > 5 * 1024 * 1024) return aviso('El logo pesa más de 5 MB.', true);
  const idCliente = S.estiloCtx.modo === 'admin' ? S.estiloCtx.id : (S.portal && S.portal.client && S.portal.client.id);
  if (!idCliente) return;
  const ruta = `logos/${idCliente}/logo-${Date.now()}.${file.type === 'image/png' ? 'png' : 'jpg'}`;
  aviso('Subiendo el logo…');
  const { error } = await sb.storage.from('portadas').upload(ruta, file, { contentType: file.type });
  if (error) return aviso(humano(error), true);
  await cambiarEstilo({ logo_url: sb.storage.from('portadas').getPublicUrl(ruta).data.publicUrl });
  aviso('Logo listo');
}

function modalPortada(id) {
  const v = S.videos.find(x => x.id === id); if (!v) return;

        <div class="campo" id="gen-cuadro" hidden><label for="gen-tiempo">Cuadro del video <span class="opc" id="gen-seg">0.0 s</span></label>
          <input id="gen-tiempo" type="range" min="0" max="1" step="0.04" value="0"></div>

        <div class="campo"><span class="lbl">Estilo</span><div class="seg seg-envuelve" role="group" aria-label="Estilo de portada">${Object.keys(OPCIONES_ESTILO[0][3]).map(k => `<button type="button" data-gen-estilo="${k}" aria-pressed="${gen.estilo.portada === k}">${esc(nombreOpcion('portada', k))}</button>`).join('')}</div></div>
        <div class="gen-perfil"><canvas id="gen-grid" width="360" height="480" aria-label="Así se ve en el perfil"></canvas><span class="nota">Así se ve en el perfil de Instagram (recorte 3:4).</span></div>
      </div>
    </div>
    <div class="d-pie"><button type="button" class="btn" data-accion="abrir-video" data-id="${v.id}">Regresar</button><button type="button" class="btn btn-p" data-accion="portada-guardar" data-id="${v.id}">Guardar portada</button></div>
  </div>`, montarGenerador, () => { if (gen.url) URL.revokeObjectURL(gen.url); if (S.gen === gen) S.gen = null; });
}
function montarGenerador(dlg) {
  const gen = S.gen, $g = id => dlg.querySelector('#' + id);
  let turno = 0;
  const redibujar = async () => {
    const mio = ++turno, tmp = document.createElement('canvas');
    await dibujarPortada(tmp, { fuente: gen.src, titulo: gen.titulo, estilo: gen.estilo, logo: await imagen(urlSegura(gen.estilo.logo_url)) });
    if (mio !== turno) return;   // ya hay un dibujo más nuevo
    const cv = $g('gen-cv'); if (!cv) return;
    cv.width = tmp.width; cv.height = tmp.height; cv.getContext('2d').drawImage(tmp, 0, 0);
    $g('gen-grid').getContext('2d').drawImage(tmp, 0, PORTADA.arriba, PORTADA.w, PORTADA.abajo - PORTADA.arriba, 0, 0, 360, 480);
  };
  gen.redibujar = redibujar;
  $g('gen-archivo').addEventListener('change', ev => {
    const f = ev.target.files && ev.target.files[0]; if (!f) return;
    if (gen.url) URL.revokeObjectURL(gen.url);
    gen.url = URL.createObjectURL(f);
    if (f.type.startsWith('image/')) {
      const i = new Image(); i.onload = () => { gen.src = i; gen.video = null; $g('gen-cuadro').hidden = true; redibujar(); }; i.src = gen.url; return;
    }
    const v = document.createElement('video');
    Object.assign(v, { muted: true, playsInline: true, preload: 'auto', src: gen.url });
    gen.video = v;
    v.addEventListener('loadedmetadata', () => { $g('gen-tiempo').max = String(v.duration || 1); $g('gen-cuadro').hidden = false; v.currentTime = Math.min(1, (v.duration || 2) / 2); });
    v.addEventListener('seeked', () => { gen.src = v; $g('gen-tiempo').value = String(v.currentTime); $g('gen-seg').textContent = v.currentTime.toFixed(1) + ' s'; redibujar(); });
    v.addEventListener('error', () => aviso('Ese video no se puede abrir aquí. Exporta un cuadro como imagen y súbelo.', true));
  });
  $g('gen-tiempo').addEventListener('input', ev => { if (gen.video) gen.video.currentTime = Number(ev.target.value); });
  $g('gen-titulo').addEventListener('input', ev => { gen.titulo = ev.target.value; redibujar(); });
  dlg.querySelectorAll('[data-gen-estilo]').forEach(b => b.addEventListener('click', () => {
    gen.estilo.portada = b.dataset.genEstilo;
    dlg.querySelectorAll('[data-gen-estilo]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    redibujar();
  }));
  redibujar();
}

function montarCiclo(f, nuevo) {
  const $ = n => f.elements[n];
  let nombreTocado = !nuevo;
  $('name').addEventListener('input', () => { nombreTocado = true; });
  // El límite de guiones sigue a la grabación mientras nadie lo cambie a mano
  const guionAuto = () => $('record_start').value ? aISO(sumarDias(aFecha($('record_start').value), -CONFIG.DIAS_GUIONES)) : '';
  let guionTocado = !!$('script_due').value && $('script_due').value !== guionAuto();
  $('script_due').addEventListener('input', () => { guionTocado = true; });
  $('script_due').addEventListener('change', () => resumen());
  const resumen = () => {
    const [a, b, e, g] = ['record_start', 'record_end', 'editor_due', 'delivery_date'].map(n => $(n).value);
    const caja = f.querySelector('#c-resumen');
    if (!a || !b || !e || !g) { caja.textContent = ''; return; }
    const edicion = diasEntre(aFecha(b), aFecha(e)), revision = diasEntre(aFecha(e), aFecha(g));
    const n = Number(($('count') && $('count').value) || S.videos.filter(v => v.cycle_id === f.dataset.id).length || 12);
    let ojo = '';
    const gui = $('script_due').value;
    if (gui && gui > a) ojo = 'Ojo: el límite de guiones queda después de que empieza la grabación.';
    else if (b < a) ojo = 'La grabación termina antes de empezar.';
    else if (g < b) ojo = 'La entrega queda antes de que termine la grabación.';
    else if (e < a || e > g) ojo = 'El límite del editor tiene que quedar entre la grabación y la entrega.';
    else if (edicion < 7) ojo = `Ojo: menos de una semana para editar ${n} videos.`;
    else if (revision < 2) ojo = 'Ojo: casi no te queda margen para revisar antes de entregar.';
    caja.innerHTML = `El editor tiene <b>${Math.max(edicion, 0)} días</b> para editar y tú <b>${Math.max(revision, 0)} días</b> para revisar antes de entregar.${ojo ? `<span class="ojo">${esc(ojo)}</span>` : ''}`;
  };
  $('record_start').addEventListener('change', () => {
    if (!$('record_start').value) return;
    if (!$('record_end').value || $('record_end').value < $('record_start').value) $('record_end').value = $('record_start').value;
    if (!guionTocado) $('script_due').value = guionAuto();
    if (nuevo) {
      const ent = sugerirEntrega($('record_start').value);
      $('delivery_date').value = aISO(ent);
      $('editor_due').value = aISO(sumarDias(ent, -CONFIG.DIAS_COLCHON));
      if (!nombreTocado) $('name').value = nombreMes(ent);
    }
    resumen();
  });
  $('delivery_date').addEventListener('change', () => {
    if (!$('delivery_date').value) return;
    if (nuevo) {
      const ent = aFecha($('delivery_date').value);
      $('editor_due').value = aISO(sumarDias(ent, -CONFIG.DIAS_COLCHON));
      if (!nombreTocado) $('name').value = nombreMes(ent);
    }
    resumen();
  });
  ['record_end', 'editor_due'].forEach(n => $(n).addEventListener('change', resumen));
  if ($('count')) $('count').addEventListener('input', resumen);
  resumen();
}

      <button type="submit" class="btn btn-p">${x ? 'Guardar cambios' : 'Crear propuesta'}</button>
    </div>
  </form>`, dlg => {
    // Al cambiar el tipo, los textos que no tocaste cambian a los del otro tipo
    const f = dlg.querySelector('form'), CAMPOS = ['titulo', 'incluye', 'forma_pago', 'condiciones', 'precio_nota', 'precio'];
    let anterior = f.elements.tipo.value;
    f.elements.tipo.addEventListener('change', () => {
      const de = PROP_DEF[anterior], a = PROP_DEF[f.elements.tipo.value];
      CAMPOS.forEach(k => { const el = f.elements[k]; if (!el.value.trim() || el.value.trim() === String(de[k]).trim()) el.value = a[k]; });
      anterior = f.elements.tipo.value;
      dlg.querySelectorAll('[data-solo-mensual]').forEach(el => { el.hidden = anterior !== 'mensual'; });
      dlg.querySelectorAll('[data-solo-proyecto]').forEach(el => { el.hidden = anterior !== 'proyecto'; });
    });
    // Al cambiar el servicio, lo que no tocaste cambia a lo de ese servicio
    let servPrev = f.elements.servicio.value;
    const nombreServ = s => { const p = COT_PLANT.find(x => x.id === s); return p ? p.nombre : PROP_DEF.proyecto.titulo; };
    f.elements.servicio.addEventListener('change', () => {
      const s = f.elements.servicio.value;
      const poner = (k, de, a) => { const el = f.elements[k]; if (!el.value.trim() || el.value.trim() === String(de).trim()) el.value = a; };
      poner('titulo', nombreServ(servPrev), nombreServ(s));
      poner('incluye', incluyeDe(servPrev), incluyeDe(s));
      poner('condiciones', condDe(servPrev), condDe(s));
      servPrev = s;
    });
  });
}

// ---------- Formularios -----------------------------------------------
const valor = (f, n) => { const el = f.elements[n]; if (!el || el.disabled) return undefined; return String(el.value).trim(); };
function revisarLinks(f, nombres) {
  for (const n of nombres) {
    const x = valor(f, n);
    if (x && !urlSegura(x)) { aviso('Los links tienen que empezar con https://', true); f.elements[n].focus(); return false; }
  }
  return true;
}

async function guardarVideo(id, cambios, ok) {
  try {
    await q(sb.from('videos').update(cambios).eq('id', id));
    cerrarModal();
    aviso(ok || 'Cambios guardados');
    await recargar();
  } catch (e) { aviso(humano(e), true); }
}

const FORMS = {
  async video(f) {
    const id = f.dataset.id, v = S.videos.find(x => x.id === id); if (!v) return;
    if (!revisarLinks(f, ['script_url', 'final_url'])) return;
    const esAdmin = S.perfil.role === 'admin', yo = S.perfil.id, cambios = {};
    const poner = (k, x) => { if (x === undefined) return; const nuevo = x === '' ? null : x; if ((v[k] ?? null) !== nuevo) cambios[k] = nuevo; };
    if (esAdmin) {
      poner('title', valor(f, 'title'));
      poner('script_url', valor(f, 'script_url'));
      poner('script_text', valor(f, 'script_text'));
      poner('editor_id', valor(f, 'editor_id'));
      poner('change_request', valor(f, 'change_request'));
      poner('copy', valor(f, 'copy'));
    }
    poner('status', valor(f, 'status'));
    poner('final_url', valor(f, 'final_url'));
    poner('team_notes', valor(f, 'team_notes'));
    if (!esAdmin) {
      const mio = f.elements.mio;
      if (mio && !mio.disabled) {
        if (mio.checked && !v.editor_id) cambios.editor_id = yo;
        if (!mio.checked && v.editor_id === yo) cambios.editor_id = null;
      }
      if (!v.editor_id && cambios.status && !('editor_id' in cambios)) cambios.editor_id = yo;
    }
    if (!Object.keys(cambios).length) return cerrarModal();
    await guardarVideo(id, cambios);
  },
  async termine(f) {
    const id = f.dataset.id, v = S.videos.find(x => x.id === id); if (!v) return;
    const c = S.ciclos.find(x => x.id === v.cycle_id), carpeta = c && urlSegura(c.delivery_url);
    const texto = valor(f, 'final_url'), url = urlSegura(texto);
    if (texto && !url) { aviso('El link tiene que empezar con https://', true); f.elements.final_url.focus(); return; }
    if (!url && !carpeta) { aviso('Pega el link del video terminado (empieza con https://)', true); f.elements.final_url.focus(); return; }
    const cambios = { status: 'revision' };
    if (url) cambios.final_url = url;
    if (!v.editor_id) cambios.editor_id = S.perfil.id;
    await guardarVideo(id, cambios, 'Enviado a revisión');
  },
  async 'ajustes-mes'(f) {
    const ajustes = [...f.querySelectorAll('textarea[data-video]')].map(t => ({ video_id: t.dataset.video, texto: t.value.trim() })).filter(a => a.texto);
    const general = (f.elements.general.value || '').trim();
    if (!ajustes.length && !general) { aviso('Escribe al menos un ajuste.', true); return; }
    await q(sb.rpc('client_pedir_ajustes', { p_cycle: f.dataset.id, p_ajustes: ajustes, p_general: general }));
    cerrarModal();
    await recargar();
    aviso('Listo: recibimos tus ajustes');
  },
  async guion(f) {
    if (!revisarLinks(f, ['script_url'])) return;
    const url = valor(f, 'script_url'), texto = valor(f, 'script_text');
    try {
      await q(sb.rpc('client_submit_script', { p_video_id: f.dataset.id, p_title: valor(f, 'title') || '', p_script_url: url || '', p_script_text: texto || '' }));
      cerrarModal();
      aviso(url || texto ? 'Guion guardado' : 'Guion quitado');
      await recargar();
    } catch (e) { aviso(humano(e), true); }
  },
  async ciclo(f) {
    const d = {};
    ['name', 'record_start', 'record_end', 'editor_due', 'delivery_date', 'raw_url', 'delivery_url', 'count', 'script_due'].forEach(n => { d[n] = valor(f, n); });
    if (!d.script_due) { aviso('Pon la fecha límite de guiones.', true); return f.elements.script_due.focus(); }
    if (!d.name) { aviso('Escribe el nombre del mes.', true); return f.elements.name.focus(); }
    if (!d.record_start || !d.record_end || !d.editor_due || !d.delivery_date) return aviso('Completa las cuatro fechas.', true);
    if (d.record_end < d.record_start) return aviso('La grabación no puede terminar antes de empezar.', true);
    if (d.delivery_date < d.record_end) return aviso('La entrega no puede ser antes de que termine la grabación.', true);
    if (d.editor_due < d.record_start || d.editor_due > d.delivery_date) return aviso('El límite del editor tiene que quedar entre la grabación y la entrega.', true);
    if (!revisarLinks(f, ['raw_url', 'delivery_url'])) return;
    try {
      if (f.dataset.id) {
        await q(sb.from('cycles').update({ name: d.name, record_start: d.record_start, record_end: d.record_end, editor_due: d.editor_due, delivery_date: d.delivery_date, script_due: d.script_due, raw_url: d.raw_url || null, delivery_url: d.delivery_url || null }).eq('id', f.dataset.id));
      } else {
        const n = Math.round(Number(d.count));
        if (!(n >= 1 && n <= 40)) return aviso('El número de videos tiene que estar entre 1 y 40.', true);
        const nuevo = await q(sb.rpc('create_cycle', { p_client: f.dataset.cliente, p_name: d.name, p_record_start: d.record_start, p_record_end: d.record_end, p_editor_due: d.editor_due, p_delivery: d.delivery_date, p_raw_url: d.raw_url || null, p_count: n }));
        if (nuevo) {
          S.abiertos.add(nuevo); S.abiertos.add('pc:' + f.dataset.cliente); S.abiertos.add('cc:' + f.dataset.cliente); guardarAbiertos();
          // La base pone el límite automático; solo se toca si lo cambiaste o si agregaste carpeta
          const extra = {};
          if (d.delivery_url) extra.delivery_url = d.delivery_url;
          if (d.script_due !== aISO(sumarDias(aFecha(d.record_start), -CONFIG.DIAS_GUIONES))) extra.script_due = d.script_due;
          if (Object.keys(extra).length) await q(sb.from('cycles').update(extra).eq('id', nuevo));
        }
      }
      cerrarModal();
      aviso(f.dataset.id ? 'Mes actualizado' : 'Mes creado');
      await recargar();
    } catch (e) { aviso(humano(e), true); }
  },
  async 'pedir-cambios'(f) {

    await guardarVideo(f.dataset.id, { status: 'edicion', change_request: texto }, 'Cambios pedidos al editor');

  async 'carpetas-mes'(f) {

      await q(sb.from('cycles').update({ delivery_url: valor(f, 'delivery_url') || null, raw_url: valor(f, 'raw_url') || null }).eq('id', f.dataset.id));

  },
  async 'asignar-mes'(f) {
    const id = f.dataset.id, editor = f.elements.editor_id.value || null;

  },
  async 'editor-clientes'(f) {
    const id = f.dataset.id;
    const antes = new Set(clientesDeEditor(id).map(cl => cl.id));
    const ahora = new Set(Array.from(f.querySelectorAll('input[name=cli]:checked'), el => el.value));
    const agregar = [...ahora].filter(x => !antes.has(x)), quitar = [...antes].filter(x => !ahora.has(x));
    if (!agregar.length && !quitar.length) return cerrarModal();
    try {
      if (agregar.length) await q(sb.from('editor_clients').insert(agregar.map(client_id => ({ editor_id: id, client_id }))));
      if (quitar.length) await q(sb.from('editor_clients').delete().eq('editor_id', id).in('client_id', quitar));

      await recargar();
    } catch (e) { aviso(humano(e), true); await recargar(); }

  async reporte(f) {
    if (!revisarLinks(f, ['mejor_url'])) return;
    const datos = { cycle_id: f.dataset.id, publicado: f.elements.publicado.checked };
    for (const k of CAMPOS_REPORTE) {
      const x = valor(f, k);
      if (NUMEROS_REPORTE.includes(k)) {
        const n = x === '' ? null : Number(x);
        if (n !== null && !(Number.isInteger(n) && n >= 0)) { aviso('Los números del reporte tienen que ser enteros y sin signo.', true); return f.elements[k].focus(); }
        datos[k] = n;
      } else datos[k] = x || null;
    }
    if (datos.periodo_inicio && datos.periodo_fin && datos.periodo_fin < datos.periodo_inicio) return aviso('El periodo del reporte no puede terminar antes de empezar.', true);
    const antes = S.reportes.find(x => x.cycle_id === datos.cycle_id);
    try {
      await q(sb.from('reportes').upsert(datos));
      cerrarModal();
      aviso(datos.publicado ? 'Reporte publicado: el cliente ya lo ve' : 'Reporte guardado como borrador');
      await recargar();
      if (datos.publicado && !(antes && antes.publicado)) modalAvisoWA('reporte', datos.cycle_id);
    } catch (e) { aviso(humano(e), true); }
  },
  async cliente(f) {
    const nombre = valor(f, 'name'), n = Math.round(Number(valor(f, 'videos_per_cycle')));
    if (!nombre) { aviso('Escribe el nombre del cliente.', true); return f.elements.name.focus(); }
    if (!(n >= 1 && n <= 40)) return aviso('Los videos por mes tienen que estar entre 1 y 40.', true);
    if (!revisarLinks(f, ['shared_url'])) return;
    const correo = valor(f, 'contact_email');
    if (correo && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(correo)) { aviso('El correo de contacto no es válido.', true); return f.elements.contact_email.focus(); }
    const datos = { name: nombre, videos_per_cycle: n, shared_url: valor(f, 'shared_url') || null,
      contact_name: valor(f, 'contact_name') || null, contact_email: correo || null, onboarding_date: valor(f, 'onboarding_date') || null,
      contact_phone: valor(f, 'contact_phone') || null, iva: valor(f, 'iva') || 'mas_iva' };
    const mens = (valor(f, 'mensualidad') || '').replace(/[$,\s]/g, '');
    datos.mensualidad = mens === '' ? null : Number(mens);
    if (datos.mensualidad !== null && !(datos.mensualidad > 0)) { aviso('Revisa la mensualidad: solo números, por ejemplo 14499.', true); return f.elements.mensualidad.focus(); }
    if (datos.contact_phone && !/^\d{10,15}$/.test(datos.contact_phone.replace(/\D/g, ''))) { aviso('El WhatsApp debe tener de 10 a 15 dígitos.', true); return f.elements.contact_phone.focus(); }
    if (f.elements.active) datos.active = f.elements.active.checked;
    try {
      if (f.dataset.id) await q(sb.from('clients').update(datos).eq('id', f.dataset.id));
      else await q(sb.from('clients').insert(datos));
      cerrarModal();
      aviso(f.dataset.id ? 'Cliente actualizado' : 'Cliente creado');
      await recargar();
    } catch (e) { aviso(humano(e), true); }
  },
  async propuesta(f) {
    const num = n => { const t = (valor(f, n) || '').replace(/[$,\s]/g, ''); return t === '' ? null : Number(t); };
    const d = {
      nombre: valor(f, 'nombre'), empresa: valor(f, 'empresa'), whatsapp: valor(f, 'whatsapp') || null, correo: valor(f, 'correo') || null,
      tipo: valor(f, 'tipo'), titulo: valor(f, 'titulo'), diagnostico: valor(f, 'diagnostico') || null, incluye: valor(f, 'incluye') || null,
      servicio: valor(f, 'tipo') === 'proyecto' ? valor(f, 'servicio') || null : null,

      forma_pago: valor(f, 'forma_pago') || null, condiciones: valor(f, 'condiciones') || null,
      ejemplo_url: valor(f, 'ejemplo_url') || null, vigencia: valor(f, 'vigencia'), notas: valor(f, 'notas') || null,
      videos_ciclo: Math.round(num('videos_ciclo') || 12), dias_grabacion: Math.round(num('dias_grabacion') || 2), plazo_minimo: Number(valor(f, 'plazo_minimo') || 3)
    };
    if (!(d.videos_ciclo >= 1 && d.videos_ciclo <= 60)) { aviso('Los videos por mes van de 1 a 60.', true); return f.elements.videos_ciclo.focus(); }
    if (!(d.dias_grabacion >= 1 && d.dias_grabacion <= 10)) { aviso('Los días de grabación van de 1 a 10.', true); return f.elements.dias_grabacion.focus(); }
    if (!d.nombre || d.nombre.length < 2) { aviso('Escribe el nombre de la persona.', true); return f.elements.nombre.focus(); }
    if (!d.empresa) { aviso('Escribe la empresa o marca.', true); return f.elements.empresa.focus(); }
    if (d.whatsapp && !/^\d{10,15}$/.test(d.whatsapp.replace(/\D/g, ''))) { aviso('El WhatsApp debe tener de 10 a 15 dígitos.', true); return f.elements.whatsapp.focus(); }
    if (d.correo && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.correo)) { aviso('El correo no es válido.', true); return f.elements.correo.focus(); }
    if (!d.titulo || d.titulo.length < 2) { aviso('Escribe el título de la propuesta.', true); return f.elements.titulo.focus(); }
    if (!(d.precio > 0)) { aviso('Pon el precio, solo números (por ejemplo 14499).', true); return f.elements.precio.focus(); }
    if (d.anticipo === null) d.anticipo = Math.round(d.precio * 50) / 100;

  },
  async 'pago-datos'(f) {
    const soloDigitos = x => (x || '').replace(/[\s-]/g, '');
    const d = { id: 1, banco: valor(f, 'banco'), titular: valor(f, 'titular'), clabe: soloDigitos(valor(f, 'clabe')),
      cuenta: soloDigitos(valor(f, 'cuenta')) || null, rfc: (valor(f, 'rfc') || '').toUpperCase().replace(/[\s-]/g, '') || null,
      concepto: valor(f, 'concepto') || null, notas: valor(f, 'notas') || null };
    if (!d.banco || d.banco.length < 2) { aviso('Escribe el banco.', true); return f.elements.banco.focus(); }
    if (!d.titular || d.titular.length < 2) { aviso('Escribe el titular de la cuenta.', true); return f.elements.titular.focus(); }
    if (!/^\d{18}$/.test(d.clabe)) { aviso('La CLABE tiene 18 dígitos.', true); return f.elements.clabe.focus(); }
    if (!clabeValida(d.clabe)) { aviso('Esa CLABE no es válida: revisa que no falte o sobre un número.', true); return f.elements.clabe.focus(); }
    if (d.cuenta && !/^\d{6,20}$/.test(d.cuenta)) { aviso('El número de cuenta solo lleva dígitos (de 6 a 20).', true); return f.elements.cuenta.focus(); }
    if (d.rfc && !RFC_OK.test(d.rfc)) { aviso('Revisa el RFC: son 12 caracteres si es empresa o 13 si es persona física.', true); return f.elements.rfc.focus(); }
    try {
      await q(sb.from('pago_datos').upsert(d));
      cerrarModal();
      aviso('Datos guardados: tus clientes ya los ven');
      await recargar();
    } catch (e) { aviso(humano(e), true); }
  },
  async factura(f) {
    const x = S.facturas.find(y => y.id === f.dataset.id); if (!x) return;
    if (!revisarLinks(f, ['factura_url'])) return;
    const estado = valor(f, 'estado');
    const cambios = { estado, factura_url: valor(f, 'factura_url') || null,
      emitida_at: estado === 'emitida' ? (x.emitida_at || new Date().toISOString()) : null };
    try {
      await q(sb.from('facturas').update(cambios).eq('id', x.id));
      cerrarModal();
      aviso(estado === 'emitida' ? (cambios.factura_url ? 'Factura emitida: el cliente ya puede descargarla' : 'Factura marcada como emitida') : 'Factura actualizada');
      await recargar();
    } catch (e) { aviso(humano(e), true); }
  },
  async 'pedir-factura'(f) {
    const d = {
      p_concepto: valor(f, 'concepto') || '', p_fecha_pago: valor(f, 'fecha_pago') || null,
      p_rfc: (valor(f, 'rfc') || '').toUpperCase().replace(/[\s-]/g, ''), p_razon_social: valor(f, 'razon_social') || '',
      p_regimen: valor(f, 'regimen') || '', p_cp: valor(f, 'cp') || '', p_uso_cfdi: valor(f, 'uso_cfdi') || 'G03',
      p_correo: valor(f, 'correo') || '', p_comentario: valor(f, 'comentario') || ''
    };
    const montoTxt = (valor(f, 'monto') || '').replace(/[$,\s]/g, '');
    d.p_monto = montoTxt === '' ? null : Number(montoTxt);
    if (!d.p_concepto) { aviso('Elige qué pago quieres facturar.', true); return f.elements.concepto.focus(); }
    if (!d.p_fecha_pago) { aviso('Pon la fecha en que pagaste.', true); return f.elements.fecha_pago.focus(); }
    if (d.p_monto !== null && !(d.p_monto > 0 && d.p_monto < 1e7)) { aviso('Revisa el monto: solo números, por ejemplo 16818.84', true); return f.elements.monto.focus(); }
    if (!RFC_OK.test(d.p_rfc)) { aviso('Revisa el RFC: son 12 caracteres si es empresa o 13 si es persona física.', true); return f.elements.rfc.focus(); }
    if (!/^\d{5}$/.test(d.p_cp)) { aviso('El código postal fiscal tiene 5 dígitos.', true); return f.elements.cp.focus(); }
    if (d.p_razon_social.length < 2) { aviso('Escribe tu nombre o razón social.', true); return f.elements.razon_social.focus(); }
    if (!d.p_regimen) { aviso('Elige tu régimen fiscal (viene en tu constancia).', true); return f.elements.regimen.focus(); }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.p_correo)) { aviso('Revisa el correo donde quieres recibir la factura.', true); return f.elements.correo.focus(); }
    try {
      await q(sb.rpc('client_pedir_factura', d));
      cerrarModal();
      aviso('Listo: pediste tu factura. Aquí verás cuando esté.');
      await recargar();
    } catch (e) { aviso(humano(e), true); }
  }
};
