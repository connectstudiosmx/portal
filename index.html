  async reporte(f) {
    if (!revisarLinks(f, ['mejor_url'])) return;
    const datos = { cycle_id: f.dataset.id, publicado: f.elements.publicado.checked };
    for (const k of CAMPOS_REPORTE) {
      const x = valor(f, k);
      if (NUMEROS_REPORTE.includes(k)) {
        const n = x === '' ? null : Number(x);
        if (n !== null && !(Number.isInteger(n) && n >= 0)) { aviso('Los números del reporte tienen que ser enteros y sin signo.', true); return f.elements[k].focus(); }
        datos[k] = n;
      } else datos[k] = x || null;
    }
    if (datos.periodo_inicio && datos.periodo_fin && datos.periodo_fin < datos.periodo_inicio) return aviso('El periodo del reporte no puede terminar antes de empezar.', true);
    const antes = S.reportes.find(x => x.cycle_id === datos.cycle_id);
    try {
      await q(sb.from('reportes').upsert(datos));
      cerrarModal();
      aviso(datos.publicado ? 'Reporte publicado: el cliente ya lo ve' : 'Reporte guardado como borrador');

  async cliente(f) {
    const nombre = valor(f, 'name'), n = Math.round(Number(valor(f, 'videos_per_cycle')));
    if (!nombre) { aviso('Escribe el nombre del cliente.', true); return f.elements.name.focus(); }
    if (!(n >= 1 && n <= 40)) return aviso('Los videos por mes tienen que estar entre 1 y 40.', true);
    if (!revisarLinks(f, ['shared_url'])) return;
    const correo = valor(f, 'contact_email');
    if (correo && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(correo)) { aviso('El correo de contacto no es válido.', true); return f.elements.contact_email.focus(); }
    const datos = { name: nombre, videos_per_cycle: n, shared_url: valor(f, 'shared_url') || null,
      contact_name: valor(f, 'contact_name') || null, contact_email: correo || null, onboarding_date: valor(f, 'onboarding_date') || null,
      contact_phone: valor(f, 'contact_phone') || null };

    if (f.elements.active) datos.active = f.elements.active.checked;
    try {
      if (f.dataset.id) await q(sb.from('clients').update(datos).eq('id', f.dataset.id));
      else await q(sb.from('clients').insert(datos));
      cerrarModal();
      aviso(f.dataset.id ? 'Cliente actualizado' : 'Cliente creado');

  async 'pago-datos'(f) {
    const soloDigitos = x => (x || '').replace(/[\s-]/g, '');
    const d = { id: 1, banco: valor(f, 'banco'), titular: valor(f, 'titular'), clabe: soloDigitos(valor(f, 'clabe')),
      cuenta: soloDigitos(valor(f, 'cuenta')) || null, rfc: (valor(f, 'rfc') || '').toUpperCase().replace(/[\s-]/g, '') || null,
      concepto: valor(f, 'concepto') || null, notas: valor(f, 'notas') || null };
    if (!d.banco || d.banco.length < 2) { aviso('Escribe el banco.', true); return f.elements.banco.focus(); }
    if (!d.titular || d.titular.length < 2) { aviso('Escribe el titular de la cuenta.', true); return f.elements.titular.focus(); }
    if (!/^\d{18}$/.test(d.clabe)) { aviso('La CLABE tiene 18 dígitos.', true); return f.elements.clabe.focus(); }
    if (!clabeValida(d.clabe)) { aviso('Esa CLABE no es válida: revisa que no falte o sobre un número.', true); return f.elements.clabe.focus(); }
    if (d.cuenta && !/^\d{6,20}$/.test(d.cuenta)) { aviso('El número de cuenta solo lleva dígitos (de 6 a 20).', true); return f.elements.cuenta.focus(); }
    if (d.rfc && !RFC_OK.test(d.rfc)) { aviso('Revisa el RFC: son 12 caracteres si es empresa o 13 si es persona física.', true); return f.elements.rfc.focus(); }
    try {
      await q(sb.from('pago_datos').upsert(d));
      cerrarModal();
      aviso('Datos guardados: tus clientes ya los ven');
      await recargar();
    } catch (e) { aviso(humano(e), true); }
  },
  async factura(f) {

    const estado = valor(f, 'estado');

  async 'pedir-factura'(f) {
    const d = {
      p_concepto: valor(f, 'concepto') || '', p_fecha_pago: valor(f, 'fecha_pago') || null,
      p_rfc: (valor(f, 'rfc') || '').toUpperCase().replace(/[\s-]/g, ''), p_razon_social: valor(f, 'razon_social') || '',
      p_regimen: valor(f, 'regimen') || '', p_cp: valor(f, 'cp') || '', p_uso_cfdi: valor(f, 'uso_cfdi') || 'G03',
      p_correo: valor(f, 'correo') || '', p_comentario: valor(f, 'comentario') || ''
    };
    const montoTxt = (valor(f, 'monto') || '').replace(/[$,\s]/g, '');
    d.p_monto = montoTxt === '' ? null : Number(montoTxt);
    if (!d.p_concepto) { aviso('Elige qué pago quieres facturar.', true); return f.elements.concepto.focus(); }
    if (!d.p_fecha_pago) { aviso('Pon la fecha en que pagaste.', true); return f.elements.fecha_pago.focus(); }
    if (d.p_monto !== null && !(d.p_monto > 0 && d.p_monto < 1e7)) { aviso('Revisa el monto: solo números, por ejemplo 16818.84', true); return f.elements.monto.focus(); }
    if (!RFC_OK.test(d.p_rfc)) { aviso('Revisa el RFC: son 12 caracteres si es empresa o 13 si es persona física.', true); return f.elements.rfc.focus(); }
    if (!/^\d{5}$/.test(d.p_cp)) { aviso('El código postal fiscal tiene 5 dígitos.', true); return f.elements.cp.focus(); }
    if (d.p_razon_social.length < 2) { aviso('Escribe tu nombre o razón social.', true); return f.elements.razon_social.focus(); }
    if (!d.p_regimen) { aviso('Elige tu régimen fiscal (viene en tu constancia).', true); return f.elements.regimen.focus(); }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.p_correo)) { aviso('Revisa el correo donde quieres recibir la factura.', true); return f.elements.correo.focus(); }
    try {
      await q(sb.rpc('client_pedir_factura', d));
      cerrarModal();
      aviso('Listo: pediste tu factura. Aquí verás cuando esté.');
      await recargar();
    } catch (e) { aviso(humano(e), true); }
  }
};

    const ta = document.createElement('textarea');

    let hecho = false;
    try { hecho = document.execCommand('copy'); } catch (e) { hecho = false; }

    try {
      const vs = await q(sb.from('videos').select('*').eq('cycle_id', id).order('number'));
      S.videos = S.videos.filter(v => v.cycle_id !== id).concat(vs || []);
      render();
      const cl = clientePorId(c.client_id);
      abrirModal(`<div class="d-cab"><div><h2 class="d-titulo">${esc(cl ? cl.name : '')}: ${esc(c.name)}</h2><p class="d-sub">Entrega ${esc(fLarga(c.delivery_date))}</p></div></div>
        <div class="filas">${(vs || []).map(v => `<div class="fila"><span class="f-num">${pad(v.number)}</span>
          <div class="f-cuerpo"><div class="f-titulo">${v.title ? esc(v.title) : '<span class="vacio">Sin título</span>'}</div>
          <div class="f-meta">${enlace(v.final_url, 'Video terminado')}${enlace(v.script_url, 'Guion')}</div></div>
          <div class="f-der solo">${pill(v.status)}</div></div>`).join('')}</div>
        <div class="d-pie"><button class="btn" data-accion="cerrar">Cerrar</button></div>`);
    } catch (e) { aviso(humano(e), true); }
  }
};

const CAMBIOS = {
  'filtro-cliente'(el) { S.filtro.cliente = el.value; render(); },
  'filtro-estado'(el) { S.filtro.estado = el.value; render(); },
  'filtro-mios'(el) { S.filtro.mios = el.checked; render(); },
  'filtro-entregados'(el) { S.filtro.entregados = el.checked; render(); },
  'perfil-rol'(el) { actualizarPerfil(el.dataset.id, { role: el.value }, true); },
  'perfil-cliente'(el) { actualizarPerfil(el.dataset.id, { client_id: el.value || null }, true); },
  'perfil-nombre'(el) { actualizarPerfil(el.dataset.id, { full_name: el.value.trim() || null }, false); },
  'sol-ver-atendidas'(el) { S.verAtendidas = el.checked; render(); },
  'sol-filtro'(el) { S.solFiltro[el.dataset.campo] = el.value; render(); },
  'sol-atendida'(el) { marcarSolicitud(el.dataset.id, el.checked); },
  'post-filtro'(el) { S.postFiltro[el.dataset.campo] = el.value; render(); },
  'post-estado'(el) { guardarPostulacion(el.dataset.id, { estado: el.value }, true); },
  'post-nota'(el) {
    const x = S.postulaciones.find(p => p.id === el.dataset.id), nota = el.value.trim() || null;
    if (x && (x.nota || null) !== nota) guardarPostulacion(el.dataset.id, { nota }, false);
  },
  'fac-filtro'(el) { S.facFiltro = el.value; render(); }
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-accion]');
  if (!el || el.disabled) return;
  const fn = ACC[el.dataset.accion];
  if (!fn) return;
  ev.preventDefault();
  Promise.resolve(fn(el, el.dataset.id, ev)).catch(e => aviso(humano(e), true));
});
document.addEventListener('change', ev => {
  const el = ev.target.closest('[data-cambio]');
  if (el && CAMBIOS[el.dataset.cambio]) CAMBIOS[el.dataset.cambio](el);
});
document.addEventListener('submit', ev => {
  const f = ev.target.closest('form[data-form]');
  if (!f || !FORMS[f.dataset.form]) return;
  ev.preventDefault();
  const btn = f.querySelector('[type=submit]');
  if (btn) btn.disabled = true;
  Promise.resolve(FORMS[f.dataset.form](f))
    .catch(e => aviso(humano(e), true))
    .finally(() => { if (btn && document.contains(btn)) btn.disabled = false; });
});
raizModal.addEventListener('click', ev => { if (ev.target.classList.contains('velo')) cerrarModal(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && raizModal.innerHTML) cerrarModal(); });
const refrescarSiToca = () => {
  if (document.visibilityState === 'visible' && S.perfil && S.perfil.role !== 'pendiente'
      && !raizModal.innerHTML && Date.now() - S.cargadoEn > 60000) recargar();
};
window.addEventListener('focus', refrescarSiToca);
document.addEventListener('visibilitychange', refrescarSiToca);

// ---------- Arranque --------------------------------------------------
function leerErrorURL() {
  const p = new URLSearchParams(location.search + '&' + location.hash.replace(/^#/, ''));
  const e = p.get('error_description') || p.get('error');
  if (!e) return '';
  if (/signups? not allowed|not allowed for this instance/i.test(e)) return 'Tu cuenta no tiene acceso a este portal. Pídele acceso a Connect Studios.';
  return 'No se pudo entrar: ' + e.replace(/\+/g, ' ');
}
function limpiarURL() { if (location.search || location.hash) history.replaceState(null, '', location.pathname); }

let arrancando = null;
function arrancar() {
  if (!arrancando) arrancando = _arrancar().finally(() => { arrancando = null; });
  return arrancando;
}
async function _arrancar() {
  cerrarModal();
  if (!window.supabase) return pintar(pantallaSimple('Sin conexión', 'No se pudo cargar el portal. Revisa tu internet y recarga la página.', 'Recargar', 'recargar-pagina'));
  if (!configLista() || !sb) return pintar(pantallaSimple('Falta configurar', 'Abre index.html, llena CONFIG con la URL y la Publishable key de tu proyecto de Supabase, y vuelve a subirlo. Los pasos están en GUIA.md.'));
  const errorURL = leerErrorURL();
  pintar('<main class="entrada"><p class="nota">Cargando…</p></main>');
  let sesion = null;
  try { const r = await sb.auth.getSession(); sesion = r.data.session; } catch (e) { sesion = null; }
  limpiarURL();
  S.sesion = sesion;
  if (!sesion) { S.perfil = null; return pintar(pantallaEntrada(errorURL)); }
  try {
    S.perfil = await q(sb.from('profiles').select('*').eq('id', sesion.user.id).maybeSingle());
    if (!S.perfil || S.perfil.role === 'pendiente') {
      const email = sesion.user.email || '';
      S.perfil = null;
      return pintar(pantallaPendiente(email));
    }
    if (S.perfil.role !== 'admin') S.vista = 'produccion';
    await recargar();
  } catch (e) {
    pintar(pantallaSimple('No cargó', humano(e), 'Reintentar', 'reintentar'));
  }
}

if (sb) {
  sb.auth.onAuthStateChange(evento => {
    if (evento === 'SIGNED_OUT' && S.perfil) setTimeout(arrancar, 0);
    if (evento === 'SIGNED_IN' && !S.perfil && !arrancando) setTimeout(arrancar, 0);
  });
}
arrancar();
</script>
